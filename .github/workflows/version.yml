# A release tag must match ATOM_VERSION in sync.py, the one place Atom's version is defined (docs/sync.md, Versions).
name: version

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches ATOM_VERSION in sync.py
        run: |
          version=$(sed -n 's/^ATOM_VERSION = "\(.*\)"$/\1/p' sync.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match ATOM_VERSION \"$version\" in sync.py: raise ATOM_VERSION, commit, and tag that commit"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches ATOM_VERSION $version"
