# Lint and test on Python 3.14 (the Dockerfile's version), then build the Docker image.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Pyflakes
        # Star imports from the function package and config are intentional.
        run: |
          python -m pyflakes main.py sync.py config.py config_extend.py function router script tests \
            | grep -v -e "import \*" -e "may be undefined" -e "unable to detect" \
            && exit 1 || echo "pyflakes: clean"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t atom-ci .

      - name: App imports inside the image
        run: docker run --rm atom-ci python -c "import main; print(len(main.app.routes), 'routes')"
