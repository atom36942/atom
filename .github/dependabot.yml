# Weekly pull requests for newer Python packages (requirements.txt) and GitHub Actions; CI tests each one.
# cooldown waits until a release is a week old before proposing it, so a broken or tampered release can be pulled first.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
