name: Feature
description: A new feature or a change to Atom
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why it does not work with Atom today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest (config, route, function or script). Say if it changes a design decision in docs/about.md.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Can it be done in the project's own `*_extend` files instead?
