<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Message</title>
<!-- ==== atom page: theme ==== -->
<script>
// Identical in every Atom page (docs/page.md, Page standard): the theme before the page draws, so it never flashes the other colours.
// localStorage "theme" = "light" or "dark" (none: System, the computer's mode), chosen in Settings (account menu), kept at logout, shared by every tab; the result is <html data-theme>.
(() => {
  const media = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => { let theme = null; try { theme = localStorage.getItem("theme") } catch {} document.documentElement.dataset.theme = theme === "light" || theme === "dark" ? theme : media.matches ? "dark" : "light" };
  apply();
  media.addEventListener("change", apply);
  addEventListener("storage", e => { if (e.key === "theme" || e.key === null) apply() });
  window.atomThemeApply = apply;
})();
</script>
<!-- ==== end atom page: theme ==== -->
<style>
/* reference client for /my/message-socket; Atom's one page theme (the same palette as Admin, Monitor and API) */
/* ==== atom page: look ==== */
/* Identical in every Atom page (docs/page.md, Page standard); a page's own styles come after this block and only add layout. A test checks the copies match. */
:root{--bg:#0b0d10;--card:#0f1114;--panel:#1a1d23;--field:#14171c;--line:rgba(var(--hl),.08);--line-strong:rgba(var(--hl),.14);--text:#e6eef3;--muted:#9aa0a6;--primary:#38a169;--accent:#4299e1;--brand:#2b6cb0;--brand-soft:#c3dafe;--brand-ink:#90cdf4;--hl:255,255,255;--warn:#ed8936;--danger:#f87171;--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"SF Mono",Menlo,Consolas,monospace;--fs:13px;--fs-small:12px;--fs-title:15px;--radius:8px;color-scheme:dark}
/* light: <html data-theme="light"> (Settings > Theme, or the computer when Theme is System); --hl is the overlay colour (white on dark, ink on light) */
:root[data-theme="light"]{--bg:#f5f7fa;--card:#fff;--panel:#eef1f5;--field:#fff;--text:#1c2430;--muted:#5f6b7a;--primary:#2f855a;--accent:#2b6cb0;--brand-soft:#dbe8fb;--brand-ink:#2b6cb0;--warn:#c05621;--danger:#c53030;--hl:15,23,42;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font)}
:where(button,select,input,textarea){font-family:var(--font);font-size:var(--fs);color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:var(--radius);height:34px;padding:0 12px}
:where(textarea){height:auto;min-height:80px;padding:8px 12px;resize:vertical;font-family:var(--mono);font-size:var(--fs-small)}
:where(button){cursor:pointer;white-space:nowrap;font-weight:500;transition:border-color .15s,background .15s}
:where(button:hover:not(:disabled)){border-color:rgba(66,153,225,.5);background:var(--panel)}
:where(button:disabled){opacity:.5;cursor:default}
button.primary{background:rgba(56,161,105,.12);border-color:rgba(56,161,105,.35);color:var(--primary)}
button.primary:hover:not(:disabled){background:rgba(56,161,105,.2);border-color:rgba(56,161,105,.55)}
button.danger{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:var(--danger)}
button.small{height:28px;padding:0 10px;font-size:var(--fs-small)}
button.link{height:auto;padding:0;border:none;background:none;color:var(--accent);font-size:inherit}
button.link:hover:not(:disabled){background:none;text-decoration:underline}
:where(select){padding-right:8px;cursor:pointer}
:where(input:focus,select:focus,textarea:focus){outline:none;border-color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:var(--fs-small)}
.error-box{padding:10px 12px;border-radius:var(--radius);font-size:var(--fs);background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);color:var(--danger);white-space:pre-wrap}
/* dialogs: a header in its own colour, a padded body, actions on their own band; every dialog of the page uses them */
dialog.dlg{width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:1px solid var(--line-strong);border-radius:12px;background:var(--card);color:var(--text);font-size:var(--fs);box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.dlg::backdrop{background:rgba(0,0,0,.6)}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--brand);color:#fff}
.dlg-head h3{margin:0;font-size:var(--fs-title);font-weight:600;line-height:1.3;color:#fff}
.dlg-sub{margin:3px 0 0;color:var(--brand-soft);font-size:var(--fs-small);font-weight:400}
.dlg-body{padding:18px;overflow-y:auto;display:grid;gap:14px}
.dlg-body:empty{display:none}
/* inside the shared dialogs, fields and buttons look the same on every page, whatever the page's own rules */
dialog.dlg input,dialog.dlg select{width:100%;height:34px;margin:0;padding:0 12px;font-family:var(--font);font-size:var(--fs);color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:var(--radius);box-shadow:none}
dialog.dlg input:focus,dialog.dlg select:focus{outline:none;border-color:var(--accent)}
dialog.dlg input:disabled{color:var(--muted);background:rgba(var(--hl),.02)}
dialog.dlg .pw-wrap input{padding-right:40px}
dialog.dlg .dlg-actions button:not(.kv-btn){height:34px;padding:0 14px;font-size:var(--fs);font-weight:500;border-radius:var(--radius)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;background:var(--panel);border-top:1px solid var(--line-strong)}
.dlg-x{width:30px;height:30px;margin:-4px -6px 0 0;padding:0;border:none;background:none;color:rgba(255,255,255,.8);display:inline-flex;align-items:center;justify-content:center;flex:none}
.dlg-x:hover:not(:disabled){background:rgba(255,255,255,.14);color:#fff}
.dlg-x svg,.kv-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.confirm-text{margin:0}
.dlg-form{display:grid;gap:14px}
:where(input:disabled,select:disabled,textarea:disabled){color:var(--muted);background:rgba(var(--hl),.02);cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{color:var(--muted);font-size:var(--fs-small);font-weight:600}
.field input,.field select{width:100%}
.field-help{margin:0;color:var(--muted);font-size:var(--fs-small)}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{flex:1;padding-right:40px}
.pw-eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:30px;height:30px;padding:0;border:none;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.pw-eye:hover:not(:disabled){background:none;color:var(--text)}
.pw-eye svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kv-btn{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
/* key-value rows: My profile, Login details, Sync and any page's record view */
.kv{width:100%;border:1px solid var(--line);border-radius:10px;border-collapse:separate;border-spacing:0;overflow:hidden}
.kv th{width:38%;padding:10px 12px;text-align:left;vertical-align:middle;background:var(--panel);color:var(--muted);font-weight:600;font-size:var(--fs-small);border-bottom:1px solid var(--line)}
.kv td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.kv tr:last-child th,.kv tr:last-child td{border-bottom:none}
.kv th,.kv td{white-space:normal;font-family:var(--font)}
.kv tbody tr:hover{background:none}
.kv .cell{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync-progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.sync-fill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s ease}
.sync-status{margin:0;min-height:1.5em;color:var(--muted)}
.sync-status.error{color:var(--danger)}
/* toast: bottom right (centred on a phone), the same in every Atom page and in the projects' pages: a green check or a red !, the message, a ×; 6 s, kept while the mouse is over it; a popover, so it shows above an open dialog */
.toast{position:fixed;inset:auto 24px 24px auto;margin:0;max-width:min(440px,calc(100vw - 32px));padding:8px 8px 8px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--text);font-size:var(--fs);box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:visible}
.toast:popover-open{display:flex;align-items:center;gap:10px}
.toast-icon{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;line-height:1}
.toast.error .toast-icon{background:var(--danger)}
.toast-text{flex:1;min-width:0}
.toast-close{flex:none;display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:16px;line-height:1}
.toast-close:hover{color:var(--text);background:rgba(var(--hl),.08)}
@media (max-width:600px){.toast{inset:auto 16px 16px 16px;max-width:none}}
/* header account area: the avatar and its menu (My profile, Login details, Sync, Logout), or Login when logged out */
.atom-account{display:flex;align-items:center;gap:8px}
.account{position:relative;display:flex}
.avatar{width:32px;height:32px;border-radius:50%;border:none;padding:0;background:var(--accent);color:#fff;font-size:12px;font-weight:700;letter-spacing:.5px;display:inline-flex;align-items:center;justify-content:center}
.avatar:hover:not(:disabled),.avatar[aria-expanded="true"]{background:var(--accent);border:none;box-shadow:0 0 0 3px rgba(66,153,225,.35)}
.account-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:190px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line-strong);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.account-item{display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 18px 0 11px;border:none;border-radius:var(--radius);background:none;color:var(--text);font-size:var(--fs);font-weight:400;text-align:left}
.account-item:hover:not(:disabled){background:rgba(var(--hl),.06);border:none}
.account-item svg{flex:none;width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.account-item.danger-item{color:var(--danger)}
.account-item.danger-item:hover:not(:disabled){background:rgba(248,113,113,.12)}
/* login page: a wordmark, the page's intro (badge, heading, a line, four feature cards) on the left, the login card on the right; a page that works without a login (API) shows only the card, over the page, with a × */
.login-page{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(circle at 15% 10%,rgba(43,108,176,.18),transparent 45%),var(--bg);display:flex;flex-direction:column}
.login-page.card-only{background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:16px}
.login-wordmark{display:flex;align-items:center;gap:10px;padding:20px 28px;font-weight:700;font-size:16px}
.login-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;font-size:15px}
.login-wrap{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,400px);gap:56px;align-items:center;width:min(1080px,100%);margin:0 auto;padding:24px 28px 56px}
.login-page.card-only .login-wrap{display:block;flex:none;width:min(400px,100%);padding:0;margin:0}
.login-badge{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(43,108,176,.18);color:var(--brand-ink);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.login-intro h1{margin:16px 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:600;line-height:1.15}
.login-intro>p{margin:0 0 28px;color:var(--muted);font-size:15px;max-width:520px}
.login-features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.login-feature{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.login-feature strong{display:block;font-size:var(--fs);font-weight:600}
.login-feature p{margin:2px 0 0;color:var(--muted);font-size:var(--fs-small)}
.feature-icon{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:rgba(43,108,176,.18);color:var(--brand-ink)}
.feature-icon svg,.login-input>svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login-card{border:1px solid var(--line-strong);border-radius:12px;background:var(--card);box-shadow:0 20px 50px rgba(0,0,0,.45);overflow:hidden}
.login-card .dlg-x{display:inline-flex}
.login-body{display:grid;gap:14px;padding:20px 18px}
.login-body .field{grid-template-columns:none;padding:0;border:0}
.login-input{position:relative;display:flex;align-items:center}
.login-input>svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.login-input input{width:100%;padding-left:36px}
.login-input.pw-wrap input{padding-right:40px}
.login-btn{width:100%;height:38px;border:none;background:var(--brand);color:#fff;font-weight:600}
.login-btn:hover:not(:disabled){background:#2c5282;border:none}
@media (max-width:860px){.login-wrap{grid-template-columns:1fr;align-content:start;gap:24px;padding:8px 16px 32px}.login-features{display:none}.login-intro h1{font-size:28px}.login-wordmark{padding:16px}}
/* Settings: one row per setting; Theme is a three-way choice (System, Light, Dark) */
.setting-row{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px}
.setting-row strong{display:block;font-weight:600}
.setting-row p{margin:2px 0 0;color:var(--muted);font-size:var(--fs-small)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:var(--radius);background:var(--panel)}
dialog.dlg .choices button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-weight:600}
dialog.dlg .choices button:hover:not(:disabled){background:transparent;color:var(--text);border-color:transparent}
dialog.dlg .choices button[aria-checked="true"]{background:var(--card);border-color:var(--line-strong);color:var(--brand-ink)}
.choices svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ==== end atom page: look ==== */
:root{--mine:#1f3a2b;--theirs:#1f2933;--error:#f87171}
body{height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:720px;height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px}
h1{margin:0;font-size:18px;font-weight:600}
#messageState{align-self:center;font-size:12px;color:var(--muted)}
#messageState.on{color:var(--primary)}
#messageState.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary);margin-right:6px}
.actions{display:flex;align-items:center;gap:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.grow{flex:1 1 180px}
#peer{flex:0 0 130px}
#log{flex:1;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.msg time{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:4px}
.theirs{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}
.note{align-self:center;font-size:12px;color:var(--muted);text-align:center}
.note.error{color:var(--error)}
#send{display:flex;gap:8px}
#chatView{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
#text{flex:1;resize:none;height:44px;min-height:44px;font-family:var(--font);font-size:14px}
</style>
</head>
<body>
<main>
  <header class="top" id="top">
    <h1>Message</h1>
    <!-- ==== atom page: account header ==== -->
    <div class="atom-account">
      <button type="button" class="primary" id="loginOpenBtn" hidden>Log in</button>
      <div class="account" id="accountWrap" hidden>
        <button type="button" class="avatar" id="accountBtn" data-tip="Account" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"><span id="avatarText">?</span></button>
        <div class="account-menu" id="accountMenu" role="menu" hidden>
          <button type="button" class="account-item" id="profileBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>My profile</button>
          <button type="button" class="account-item" id="detailsBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Login details</button>
          <button type="button" class="account-item" id="settingsBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
          <button type="button" class="account-item" id="syncBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg>Sync</button>
          <button type="button" class="account-item danger-item" id="logoutBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 4h5v16h-5"/></svg>Logout</button>
        </div>
      </div>
    </div>
    <!-- ==== end atom page: account header ==== -->
  </header>
  <div id="chatView" hidden>
  <div id="messageBar" class="bar">
    <input id="peer" type="number" min="1" placeholder="Other user id"/>
    <button class="primary" id="connect">Connect</button>
    <span id="messageState"></span>
  </div>
  <div id="log" aria-live="polite"><div class="note">Turn on "/my/message-socket" in config_api, log in, enter the other user's id, then connect. Use a second browser profile as the other user.</div></div>
  <form id="send"><textarea id="text" placeholder="Type a message, Enter to send" disabled></textarea><button class="primary" id="sendBtn" disabled>Send</button></form>
  </div>
</main>
<!-- ==== atom page: dialogs ==== -->
<section class="login-page" id="loginPage" aria-labelledby="loginTitle" hidden>
  <div class="login-wordmark" id="loginWordmark"><span class="login-mark">A</span><span id="loginPageName"></span></div>
  <div class="login-wrap">
    <div class="login-intro" id="loginIntro"><span class="login-badge" id="loginBadge"></span><h1 id="loginHeading"></h1><p id="loginText"></p><div class="login-features" id="loginFeatures"></div></div>
    <form class="login-card" id="loginForm" novalidate>
      <div class="dlg-head"><div><h3 id="loginTitle">Login</h3><p class="dlg-sub" id="loginSub"></p></div><button type="button" class="dlg-x" id="loginClose" aria-label="Close" data-tip="Close"></button></div>
      <div class="login-body">
        <div class="field" id="loginRoleField"><label for="loginRole">Role</label><input id="loginRole" inputmode="numeric" autocomplete="off" placeholder="Any role"></div>
        <div class="field"><label for="loginUsername">Username</label><span class="login-input"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v3"/></svg><input id="loginUsername" autocomplete="username" maxlength="120"></span></div>
        <div class="field"><label for="loginPassword">Password</label><span class="login-input pw-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg><input id="loginPassword" type="password" autocomplete="current-password" maxlength="120"><button type="button" class="pw-eye" id="loginEye" aria-label="Show password" data-tip="Show password"></button></span></div>
        <div class="error-box" id="loginError" hidden></div>
        <button type="submit" class="login-btn" id="loginBtn">Login</button>
      </div>
    </form>
  </div>
</section>
<dialog class="dlg" id="blockedDialog" aria-labelledby="blockedTitle">
  <div class="dlg-head"><div><h3 id="blockedTitle"></h3></div></div>
  <div class="dlg-body"><p class="confirm-text" id="blockedText"></p></div>
  <div class="dlg-actions"><button type="button" class="primary" id="blockedOk">OK</button></div>
</dialog>
<dialog class="dlg" id="atomDialog" aria-labelledby="atomTitle">
  <div class="dlg-head"><div><h3 id="atomTitle"></h3><p class="dlg-sub" id="atomSub" hidden></p></div><button type="button" class="dlg-x" id="atomClose" aria-label="Close" data-tip="Close"></button></div>
  <div class="dlg-body" id="atomBody"></div>
  <div class="dlg-actions" id="atomActions" hidden></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" popover="manual"><span class="toast-icon" aria-hidden="true"></span><span class="toast-text"></span><button class="toast-close" id="toastClose" type="button" aria-label="Close" data-tip="Close">×</button></div>
<!-- ==== end atom page: dialogs ==== -->
<script>
/* ==== page settings and the account block ==== */
// Message: any role may log in; no reference data (IndexedDB not used); Sync renews the login and the user
// localStorage "message" = {v, token, user, synced_at} (the account block) plus peer_id, the last conversation
const PAGE = { key: "message", title: "Message", role: null, loginRequired: true, idb: false, intro: { heading: "Message the people on your server", text: "Direct conversations between users of this Atom server, kept in its database.", features: [['<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>', "Conversations", "One thread per person, newest first."], ['<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>', "Send", "Text messages, delivered at once."], ['<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>', "Unread", "New messages marked until you read them."], ['<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>', "Private", "Only the two people in a thread see it."]] }, onIn: () => chatOpen(), onOut: () => chatClose() };
/* ==== atom page: account ==== */
// Identical in every Atom page that logs in (docs/page.md, Page standard); the page sets PAGE just above this block and calls Page.start() last. A test checks the copies match.
// localStorage[PAGE.key] = {v, token, user, info, synced_at, ...the page's choices}; IndexedDB database PAGE.key, store "cache", records {name, user_id, saved_at, data} (pages with PAGE.idb).
// Logged in means a valid token object; the user comes from GET /my/profile and is checked on every sync; Sync runs every 3 hours and from the account menu; logout clears everything in every tab.
// Without a login: a page that needs one shows the login page (PAGE.intro: {heading, text, features: [[svg paths, title, line], ...]}); one that doesn't (API) shows only the login card, from Log in.
const Page = (() => {
  const STORAGE_KEY = PAGE.key, STORAGE_VERSION = 1, IDB_STORE = "cache", IDB_VERSION = 2, SYNC_EVERY_MS = 3 * 3600 * 1000;
  const EXPIRED = "Your session has expired. Please log in again.";
  const el = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const dash = v => v == null || v === "" ? "-" : esc(v);
  const nowSec = () => Math.floor(Date.now() / 1000);
  const ICON = {
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
    copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    eye: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  };

  /* -- storage -- */
  const read = () => { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); return s && s.v === STORAGE_VERSION ? s : {} } catch { return {} } };
  const save = changes => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...read(), ...changes, v: STORAGE_VERSION })) } catch {} };
  // the whole token object, valid, or logged out
  const loginValid = token => !!token && typeof token.access_token === "string" && token.access_token !== "" && typeof token.refresh_token === "string" && token.refresh_token !== "" && Number.isFinite(token.access_token_expires_at) && Number.isFinite(token.refresh_token_expires_at) && token.refresh_token_expires_at > nowSec();
  // a deleted or deactivated account: Atom answers 403 "account deleted" / "account deactivated" at login, at token refresh and on every token route; the page logs out and says so
  const ACCOUNT_REFUSED = { "account deleted": "Your account was deleted. Please contact your admin.", "account deactivated": "Your account is deactivated. Please contact your admin." };
  const BLOCKED_TITLE = { [ACCOUNT_REFUSED["account deleted"]]: "Account deleted", [ACCOUNT_REFUSED["account deactivated"]]: "Account deactivated" };
  let accountRefused = "";    // set by a refused request: every logout until the next login shows it, never "session expired"
  const userBlock = user => !user ? "Your account could not be loaded." : user.deleted_at ? ACCOUNT_REFUSED["account deleted"] : user.deactivated_at ? ACCOUNT_REFUSED["account deactivated"] : PAGE.role != null && Number(user.role) !== PAGE.role ? `${PAGE.title} access is unavailable.` : "";

  /* -- IndexedDB cache: big or slow reference data; a record saved for another user is ignored -- */
  const idbOpen = () => new Promise((resolve, reject) => {
    const q = indexedDB.open(STORAGE_KEY, IDB_VERSION);
    q.onupgradeneeded = () => { const db = q.result; if (db.objectStoreNames.contains(IDB_STORE)) db.deleteObjectStore(IDB_STORE); db.createObjectStore(IDB_STORE, { keyPath: "name" }) };
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
  const idbRun = async (mode, work) => { const db = await idbOpen(); try { return await new Promise((resolve, reject) => { const q = work(db.transaction(IDB_STORE, mode).objectStore(IDB_STORE)); q.onsuccess = () => resolve(q.result); q.onerror = () => reject(q.error) }) } finally { db.close() } };
  const cacheGet = async name => { if (!PAGE.idb) return null; try { const r = await idbRun("readonly", s => s.get(name)); return r && r.user_id === (read().user?.id ?? null) ? r : null } catch { return null } };
  const cacheSet = async (name, data) => { if (!PAGE.idb || (PAGE.loginRequired && !loginValid(read().token))) return; try { await idbRun("readwrite", s => s.put({ name, user_id: read().user?.id ?? null, saved_at: Date.now(), data })) } catch {} };
  const cacheCount = async () => { if (!PAGE.idb) return 0; try { return await idbRun("readonly", s => s.count()) } catch { return 0 } };
  const cacheClear = () => new Promise(resolve => { if (!PAGE.idb) return resolve(); const q = indexedDB.deleteDatabase(STORAGE_KEY); q.onsuccess = q.onerror = q.onblocked = () => resolve() });

  /* -- toast and the one dialog every part of the page uses -- */
  let toastTimer = null;
  const toastClose = () => { clearTimeout(toastTimer); if (el("toast").matches(":popover-open")) el("toast").hidePopover() };
  const toastWait = () => { clearTimeout(toastTimer); toastTimer = setTimeout(toastClose, 6000) };
  // shown again each time, so it is the newest thing in the top layer (above a dialog opened since)
  const toast = (text, isError = false) => { const t = el("toast"); t.querySelector(".toast-text").textContent = text; t.querySelector(".toast-icon").textContent = isError ? "!" : "✓"; t.classList.toggle("error", !!isError); if (t.matches(":popover-open")) t.hidePopover(); t.showPopover(); toastWait() };
  el("toast").querySelector(".toast-close").addEventListener("click", toastClose);
  el("toast").addEventListener("mouseenter", () => clearTimeout(toastTimer));
  el("toast").addEventListener("mouseleave", () => { if (el("toast").matches(":popover-open")) toastWait() });
  let dialogOn = {}, dialogLocked = false, formResolve = null;
  // dialog({title, sub, body, actions, on: {buttonId: handler}}): a title, an optional subtitle, a body and actions only when there is something to do
  const dialog = ({ title, sub = "", body = "", actions = "", on = {} }) => {
    formResolve?.(false);    // a form still waiting is answered "no" when the dialog shows something else
    formResolve = null;
    el("atomTitle").textContent = title;
    el("atomSub").textContent = sub;
    el("atomSub").hidden = !sub;
    el("atomBody").innerHTML = body + '<div class="error-box" id="atomError" hidden></div>';
    el("atomActions").innerHTML = actions;
    el("atomActions").hidden = !actions;
    dialogOn = on;
    if (!el("atomDialog").open) el("atomDialog").showModal();
  };
  const dialogClose = () => { if (el("atomDialog").open) el("atomDialog").close() };
  const dialogError = text => { const e = el("atomError"); if (e) { e.textContent = text || ""; e.hidden = !text } };
  const dialogLock = on => { dialogLocked = on; for (const b of el("atomDialog").querySelectorAll("button")) b.disabled = on };
  // form({title, sub, body, ok, tone, submit}): Cancel, then the main action; submit() runs on the action or Enter and its error stays in the dialog;
  // resolves true when done, false on Cancel or close. confirm(title, text, ok, danger) is a form without fields
  const form = ({ title, sub = "", body = "", ok = "OK", tone = "primary", submit = null }) => new Promise(resolve => {
    const done = value => { formResolve = null; dialogClose(); resolve(value) };
    const run = async () => {
      if (!submit) return done(true);
      dialogError("");
      dialogLock(true);
      try { await submit(); dialogLock(false); done(true) }
      catch (failure) { dialogLock(false); dialogError(failure.message) }
    };
    dialog({ title, sub, body: `<form class="dlg-form" id="atomForm" novalidate>${body}</form>`, actions: `<button type="button" id="atomCancel">Cancel</button><button type="submit" form="atomForm" class="${tone}" id="atomOk">${esc(ok)}</button>`, on: { atomCancel: () => done(false) } });
    formResolve = resolve;
    el("atomForm").addEventListener("submit", e => { e.preventDefault(); run() });
    (el("atomForm").querySelector("input:not([disabled]),select,textarea") || el("atomOk")).focus();
  });
  const confirm = (title, text, ok = "OK", danger = false) => form({ title, body: `<p class="confirm-text">${esc(text)}</p>`, ok, tone: danger ? "danger" : "primary" });
  const kv = rows => `<table class="kv"><tbody>${rows.map(([label, html]) => `<tr><th scope="row">${esc(label)}</th><td>${html}</td></tr>`).join("")}</tbody></table>`;
  const eyeToggle = (input, button) => {
    const draw = () => { const shown = input.type === "text"; button.innerHTML = shown ? ICON.eyeOff : ICON.eye; button.ariaLabel = shown ? "Hide password" : "Show password" };
    button.addEventListener("click", () => { input.type = input.type === "password" ? "text" : "password"; draw(); input.focus() });
    draw();
  };

  /* -- requests: the token as Bearer; a 401 renews the token once and retries -- */
  let refreshing = null;
  // true: a valid new token is saved; false: the refresh token expired or was refused (log out); null: the server could not be reached (keep the token, try later)
  const tokenRefresh = () => refreshing ||= (async () => {
    const token = read().token;
    if (!loginValid(token)) return false;
    try {
      const response = await fetch("/my/token-refresh", { method: "POST", headers: { Authorization: `Bearer ${token.refresh_token}` } });
      const body = await response.json().catch(() => ({}));
      if (response.ok && body.status === 1) { if (!loginValid(body.message)) return false; save({ token: body.message }); return true }
      if (response.status === 403) accountRefused = ACCOUNT_REFUSED[body.message] || accountRefused;
      return response.status === 401 || response.status === 403 ? false : null;
    } catch { return null }
  })().finally(() => { refreshing = null });
  const request = async (path, options = {}, retry = true) => {
    let token = read().token;
    if (loginValid(token) && token.access_token_expires_at - nowSec() <= 30) { if (await tokenRefresh() === false) { logOut(EXPIRED); throw Object.assign(new Error(EXPIRED), { status: 401 }) } token = read().token }
    const json = typeof options.body === "string";
    const headers = { ...(json ? { "Content-Type": "application/json" } : {}), ...(options.headers || {}), ...(loginValid(token) ? { Authorization: `Bearer ${token.access_token}` } : {}) };
    const response = await fetch(path, { ...options, headers });
    if (response.status === 403 && loginValid(token)) {
      const refused = ACCOUNT_REFUSED[(await response.clone().json().catch(() => ({}))).message];
      if (refused) { accountRefused = refused; logOut(); throw Object.assign(new Error(refused), { status: 403 }) }
    }
    if (response.status === 401 && retry && loginValid(token)) {
      const renewed = await tokenRefresh();
      if (renewed) return request(path, options, false);
      if (renewed === false) logOut(EXPIRED);
    }
    return response;
  };
  // Atom's answer {status: 1, message}: the message, or an Error with the server's text and .status
  const api = async (path, options = {}) => {
    const response = await request(path, options);
    const body = await response.json().catch(() => ({}));
    if (!response.ok || body.status !== 1) throw Object.assign(new Error(typeof body.message === "string" ? body.message : `HTTP ${response.status}`), { status: response.status });
    return body.message;
  };

  /* -- session -- */
  const loggedIn = () => !el("accountWrap").hidden;
  // the user (GET /my/profile) into "user": on login, when missing and on every sync; false when the user may not use the page (logged out)
  const profileLoad = async (force = false) => {
    if (!loginValid(read().token)) return false;
    if (force || !read().user) {
      try { save({ user: await api("/my/profile") }) }
      catch (error) { if (error.status === 401 || error.status === 403) { logOut(EXPIRED); return false } }    // offline: keep the saved user
    }
    const block = userBlock(read().user);
    if (block) { if (BLOCKED_TITLE[block]) accountRefused = block; logOut(block); return false }
    renderAccount();
    return true;
  };
  // sync: new token, the user, the settings (/info), then the page's data (PAGE.refresh); synced_at when it finishes. step(i) names the step for the Sync dialog
  const syncSteps = () => ["Renewing login…", "Loading your profile…", "Loading settings…", ...(PAGE.refresh ? ["Downloading data…"] : [])];
  // GET /info (public) → info = {config_column_int_mapping, export_limit}: labels and settings come from the server, never from the page
  const infoLoad = async (session = sessionId) => {
    const response = await fetch("/info"), body = await response.json().catch(() => ({}));
    if (!response.ok || body.status !== 1) throw new Error("Sync failed. Please try again.");
    if (session !== sessionId) return;    // logged out while it downloaded: nothing is saved
    save({ info: { config_column_int_mapping: body.message.config_column_int_mapping || {}, export_limit: Number(body.message.export_limit) || 0 } });
  };
  // the settings and the page's data, one download at a time (a page with no cache yet calls it too): /info, PAGE.refresh, then synced_at, then PAGE.onSynced
  // sessionId changes at every logout, so a download that finishes after one saves nothing
  let dataSyncing = null, sessionId = 0;
  const syncData = (step = () => {}) => dataSyncing ||= (async () => { const session = sessionId; step(2); await infoLoad(session); if (PAGE.refresh) { step(3); await PAGE.refresh() } if (session !== sessionId) return; save({ synced_at: Date.now() }); PAGE.onSynced?.() })().finally(() => { dataSyncing = null });
  const syncRun = async (step = () => {}) => {
    step(0);
    if (await tokenRefresh() === false) { logOut(EXPIRED); return false }
    step(1);
    if (!await profileLoad(true)) return false;
    await syncData(step);
    return true;
  };
  // 5 minutes or less left on the access token: renew it now (refused → logged out); false when logged out
  const tokenFresh = async () => {
    const token = read().token;
    if (!loginValid(token)) { if (token) logOut(EXPIRED); return false }
    if (token.access_token_expires_at - nowSec() <= 300 && await tokenRefresh() === false) { logOut(EXPIRED); return false }
    return true;
  };
  // on open, every minute and when the tab comes back: a valid, fresh token; then the user, then a sync when synced_at is 3 hours old
  const sessionCheck = async () => {
    if (!read().token || !loggedIn()) return;
    if (!await tokenFresh()) return;
    if (!await profileLoad()) return;
    if (Date.now() - (read().synced_at || 0) > SYNC_EVERY_MS || !read().info) syncRun().catch(() => {});    // no info: synced before /info joined Sync
  };
  // a token object from a login: check it, then the user, then the first sync, then the page
  const signIn = async token => {
    if (!loginValid(token)) throw new Error("The server sent an incomplete login. Please try again.");
    accountRefused = "";
    save({ token, user: null, synced_at: 0 });
    let user;
    try { user = await api("/my/profile") } catch (error) { forgetAll(); throw error }
    const block = userBlock(user);
    if (block) { forgetAll(); throw new Error(block) }
    save({ user });
    showIn();
  };
  const forgetAll = () => { try { localStorage.removeItem(STORAGE_KEY) } catch {} cacheClear() };
  // logout and every forced logout: forget the key and the cache, close dialogs, show the login with a plain sentence
  // a blocked account (refused by Atom, or its profile deactivated or deleted): the login page, then the "Account deactivated" / "Account deleted" dialog over it until OK
  const logOut = (message = "") => { sessionId++; forgetAll(); const refused = accountRefused; showOut(refused ? "" : message); if (refused) blockedShow(refused) };
  const blockedShow = text => { el("blockedTitle").textContent = BLOCKED_TITLE[text] || "Account blocked"; el("blockedText").textContent = text; if (!el("blockedDialog").open) el("blockedDialog").showModal(); el("blockedOk").focus() };
  const initials = name => {
    const words = String(name || "").split("@")[0].split(/[\s._-]+/).filter(Boolean);
    return (words.length > 1 ? words[0][0] + words[1][0] : (words[0] || "?").slice(0, 2)).toUpperCase();
  };
  const renderAccount = () => { const u = read().user || {}; el("avatarText").textContent = initials(u.username || u.email) };
  const showIn = () => {
    el("loginOpenBtn").hidden = true;
    el("accountWrap").hidden = false;
    loginHide();
    renderAccount();
    PAGE.onIn?.(read().user);
    if (!read().synced_at || !read().info) syncData().catch(() => {});    // the first sync after a login: the token is new, so only the page's data
  };
  const showOut = message => {
    menuToggle(false);
    for (const d of document.querySelectorAll("dialog[open]")) d.close();
    el("accountWrap").hidden = true;
    el("loginOpenBtn").hidden = !!PAGE.loginRequired;
    PAGE.onOut?.(message);
    if (PAGE.loginRequired || message) loginOpen(message);
  };

  /* -- login page: role (fixed and hidden when the page has one), username, password -- */
  // while it shows, the rest of the page is inert (no focus, no clicks); dialogs and the toast stay usable above it
  const loginShown = () => !el("loginPage").hidden;
  const loginShow = () => { for (const node of document.body.children) node.inert = !(node === el("loginPage") || node.tagName === "DIALOG" || node.tagName === "SCRIPT" || node.id === "toast"); el("loginPage").hidden = false };
  const loginHide = () => { el("loginPage").hidden = true; for (const node of document.body.children) node.inert = false };
  const loginOpen = (message = "") => {
    const full = !!PAGE.loginRequired, intro = PAGE.intro || {};
    el("loginPage").classList.toggle("card-only", !full);
    el("loginWordmark").hidden = el("loginIntro").hidden = !full;
    el("loginPageName").textContent = `Atom ${PAGE.title}`;
    el("loginBadge").textContent = PAGE.title;
    el("loginHeading").textContent = intro.heading || PAGE.title;
    el("loginText").textContent = intro.text || "";
    el("loginFeatures").innerHTML = (intro.features || []).map(([icon, title, text]) => `<div class="login-feature"><span class="feature-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg></span><div><strong>${esc(title)}</strong><p>${esc(text)}</p></div></div>`).join("");
    el("loginSub").textContent = PAGE.role != null ? `For role ${PAGE.role} accounts` : "For any role";
    el("loginRoleField").hidden = PAGE.role != null;
    if (PAGE.role != null) el("loginRole").value = PAGE.role;
    el("loginClose").hidden = full;
    el("loginPassword").value = "";
    el("loginError").textContent = message;
    el("loginError").hidden = !message;
    loginShow();
    (el("loginUsername").value ? el("loginPassword") : el("loginUsername")).focus();
  };
  const loginSubmit = async event => {
    event.preventDefault();
    const role = el("loginRole").value.trim(), username = el("loginUsername").value.trim(), password = el("loginPassword").value;
    const error = !username || !password ? "Enter your username and password." : role && !/^\d+$/.test(role) ? "Role is a number." : "";
    el("loginError").textContent = error;
    el("loginError").hidden = !error;
    if (error) return;
    el("loginBtn").disabled = true;
    try {
      const response = await fetch("/auth/login-username-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...(role ? { role: Number(role) } : {}), username, password }) });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || body.status !== 1) throw new Error(typeof body.message === "string" ? body.message : `HTTP ${response.status}`);
      await signIn(body.message);
    } catch (failure) {
      const refused = ACCOUNT_REFUSED[failure.message] || (BLOCKED_TITLE[failure.message] ? failure.message : "");
      el("loginError").textContent = refused ? "" : failure.message;
      el("loginError").hidden = !!refused;
      if (refused) blockedShow(refused);
    }
    finally { el("loginBtn").disabled = false }
  };

  /* -- account menu: My profile, Login details, Logout -- */
  const menuToggle = open => { const isOpen = open ?? el("accountMenu").hidden; el("accountMenu").hidden = !isOpen; el("accountBtn").setAttribute("aria-expanded", String(isOpen)) };
  const roleText = role => { if (role == null) return "-"; const label = read().info?.config_column_int_mapping?.users?.role?.[role]; return esc(label ? `${label} (${role})` : String(role)) };    // "Admin (1)": the label from /info; only the number before the first sync
  const usernameCell = u => u.username ? `<span class="cell"><span>${esc(u.username)}</span><button type="button" class="kv-btn" data-copy="${esc(u.username)}" aria-label="Copy username">${ICON.copy}</button></span>` : "-";
  // My profile is the person, Login details what the login sends: each field shows in one of the two only
  const profileOpen = () => { const u = read().user || {}; dialog({ title: "My profile", body: kv([["Name", dash(u.name)], ["Email", dash(u.email)], ["Mobile", dash(u.mobile)]]) }) };
  const detailsOpen = () => {
    const u = read().user || {};
    dialog({ title: "Login details", body: kv([["Username", usernameCell(u)], ["Password", `<span class="cell"><span>••••••••</span><button type="button" class="kv-btn" id="passwordEdit" aria-label="Change password">${ICON.pencil}</button></span>`], ["Role", roleText(u.role)]]), on: { passwordEdit: passwordOpen } });
  };
  // Update password: Atom's rule, 6-120 characters without spaces (PUT /my/user-update)
  const passwordOpen = () => {
    dialog({ title: "Update password",
      body: '<div class="field"><label for="pwNew">New password</label><input id="pwNew" type="password" autocomplete="new-password" maxlength="120"></div><div class="field"><label for="pwConfirm">Confirm new password</label><input id="pwConfirm" type="password" autocomplete="new-password" maxlength="120"></div><p class="field-help">6–120 characters, no spaces.</p>',
      actions: '<button type="button" id="pwCancel">Cancel</button><button type="button" class="primary" id="pwSave">Update password</button>',
      on: { pwCancel: detailsOpen, pwSave: passwordSave } });
    el("pwNew").focus();
  };
  const passwordSave = async () => {
    const value = el("pwNew").value, error = /\s/.test(value) || value.length < 6 || value.length > 120 ? "Use 6–120 characters, no spaces" : value !== el("pwConfirm").value ? "Passwords don't match" : "";
    if (error) return dialogError(error);
    el("pwSave").disabled = true;
    try { await api("/my/user-update", { method: "PUT", body: JSON.stringify({ password: value }) }); dialogClose(); toast("Password updated") }
    catch (failure) { dialogError(failure.message); if (el("pwSave")) el("pwSave").disabled = false }
  };
  const logoutOpen = () => dialog({ title: "Logout?", body: '<p class="confirm-text">Are you sure you want to logout?</p>', actions: '<button type="button" id="logoutCancel">Cancel</button><button type="button" class="primary" id="logoutConfirm">Logout</button>', on: { logoutCancel: dialogClose, logoutConfirm: () => logOut("") } });

  /* -- Settings: one row per setting; the first is Theme (System, Light, Dark), applied at once and saved in this browser (localStorage "theme", kept at logout) -- */
  const THEMES = [
    ["system", "System", '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'],
    ["light", "Light", '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'],
    ["dark", "Dark", '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'],
  ];
  const themeChoice = () => { try { const theme = localStorage.getItem("theme"); return theme === "light" || theme === "dark" ? theme : "system" } catch { return "system" } };
  const settingsDraw = () => { for (const b of el("atomDialog").querySelectorAll("[data-choice]")) b.setAttribute("aria-checked", String(b.dataset.choice === themeChoice())) };
  const themeChoose = value => { try { if (value === "system") localStorage.removeItem("theme"); else localStorage.setItem("theme", value) } catch {} window.atomThemeApply?.(); settingsDraw() };
  const settingsOpen = () => {
    dialog({ title: "Settings", sub: "Saved in this browser",
      body: `<div class="setting-row"><div><strong id="themeLabel">Theme</strong><p>System follows your computer's light or dark mode.</p></div><div class="choices" role="radiogroup" aria-labelledby="themeLabel">${THEMES.map(([value, label, icon]) => `<button type="button" role="radio" data-choice="${value}"><svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>${label}</button>`).join("")}</div></div>`,
      actions: '<button type="button" class="primary" id="settingsDone">Done</button>', on: { settingsDone: dialogClose } });
    settingsDraw();
    el("atomDialog").querySelector('[aria-checked="true"]')?.focus();
  };

  /* -- Sync dialog: what this page keeps and when it last downloaded; Sync now runs the whole sync -- */
  const agoText = ms => { const s = Math.max(0, Math.round((Date.now() - ms) / 1000)); if (s < 60) return "just now"; for (const [size, unit] of [[31536000, "yr"], [2592000, "mo"], [86400, "day"], [3600, "hr"], [60, "min"]]) if (s >= size) { const n = Math.floor(s / size); return `${n} ${unit === "day" && n !== 1 ? "days" : unit} ago` } };
  const usedText = n => n ? `Used, ${n} item${n === 1 ? "" : "s"}` : "Not used";
  const syncOpen = async () => {
    const store = read(), local = Object.keys(store).length, records = await cacheCount();
    dialog({ title: "Sync", sub: `${store.synced_at ? `Last synced ${agoText(store.synced_at)}` : "Never synced"} (auto sync every 3 hours)`,
      body: kv([["Local storage", usedText(local)], ["IndexedDB", usedText(records)]]) + '<div class="sync-progress" id="syncProgress" hidden><div class="sync-fill" id="syncFill"></div></div><p class="sync-status" id="syncStatus" role="status"></p>',
      actions: '<button type="button" id="syncClose">Close</button><button type="button" class="primary" id="syncNow">Sync now</button>',
      on: { syncClose: dialogClose, syncNow } });
  };
  const syncNow = async () => {
    const steps = syncSteps();
    const step = i => { if (!el("syncStatus")) return; el("syncStatus").textContent = `${steps[i]} (${i + 1} of ${steps.length})`; el("syncFill").style.width = `${Math.round(i / steps.length * 100)}%` };
    el("syncStatus").classList.remove("error");
    el("syncProgress").hidden = false;
    dialogLock(true);
    let ok = false;
    try { ok = await syncRun(step) } catch { ok = false }
    dialogLock(false);
    if (!el("atomDialog").open || el("atomTitle").textContent !== "Sync") return;
    await syncOpen();
    el("syncStatus").textContent = ok ? "Everything is up to date." : "Sync failed. Please try again.";
    el("syncStatus").classList.toggle("error", !ok);
  };

  /* -- start: wire the parts, then open logged in (a valid token) or logged out -- */
  const start = () => {
    el("accountBtn").addEventListener("click", e => { e.stopPropagation(); menuToggle() });
    el("accountMenu").addEventListener("click", e => e.stopPropagation());
    document.addEventListener("click", () => menuToggle(false));
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !el("accountMenu").hidden) { menuToggle(false); el("accountBtn").focus() } });
    el("profileBtn").addEventListener("click", () => { menuToggle(false); profileOpen() });
    el("detailsBtn").addEventListener("click", () => { menuToggle(false); detailsOpen() });
    el("logoutBtn").addEventListener("click", () => { menuToggle(false); logoutOpen() });
    el("settingsBtn").addEventListener("click", () => { menuToggle(false); settingsOpen() });
    el("syncBtn").addEventListener("click", () => { menuToggle(false); syncOpen() });
    el("loginOpenBtn").addEventListener("click", () => loginOpen());
    el("loginClose").addEventListener("click", loginHide);
    el("loginForm").addEventListener("submit", loginSubmit);
    document.addEventListener("keydown", e => { if (e.key === "Escape" && loginShown() && !PAGE.loginRequired && !document.querySelector("dialog[open]")) loginHide() });    // only the card (API) closes; a page that needs a login keeps it
    el("blockedOk").addEventListener("click", () => el("blockedDialog").close());
    el("blockedDialog").addEventListener("cancel", e => e.preventDefault());    // only OK closes it
    eyeToggle(el("loginPassword"), el("loginEye"));
    el("atomClose").innerHTML = el("loginClose").innerHTML = ICON.x;
    el("atomClose").addEventListener("click", dialogClose);
    el("atomDialog").addEventListener("cancel", e => { if (dialogLocked) e.preventDefault() });
    // the theme choice moves with the arrow keys, as in any radio group
    el("atomDialog").addEventListener("keydown", e => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!step || !e.target.closest("[data-choice]")) return;
      e.preventDefault();
      const values = THEMES.map(([value]) => value), next = values[(values.indexOf(themeChoice()) + step + values.length) % values.length];
      themeChoose(next);
      el("atomDialog").querySelector(`[data-choice="${next}"]`).focus();
    });    // Escape does nothing while Sync runs
    el("atomDialog").addEventListener("close", () => { formResolve?.(false); formResolve = null; dialogOn = {} });
    el("atomDialog").addEventListener("click", e => {
      const choice = e.target.closest("[data-choice]");
      if (choice) return themeChoose(choice.dataset.choice);
      const copy = e.target.closest("[data-copy]");
      if (copy) return navigator.clipboard.writeText(copy.dataset.copy).then(() => toast("Username copied"), () => toast("Could not copy username", true));
      const button = e.target.closest("button[id]");
      if (button && dialogOn[button.id]) dialogOn[button.id](e);
    });
    // logout in another tab removes the key: this tab finds no valid token and logs out too
    window.addEventListener("storage", e => { if (e.key === STORAGE_KEY && loggedIn() && !loginValid(read().token)) showOut("You logged out in another tab.") });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) sessionCheck() });
    setInterval(sessionCheck, 60000);
    const token = read().token;
    if (loginValid(token)) { showIn(); sessionCheck() }
    else { if (token) forgetAll(); showOut(token ? EXPIRED : "") }
  };

  return { start, esc, dash, toast, dialog, dialogClose, dialogError, dialogLock, form, confirm, kv, eyeToggle, api, request, read, save, user: () => read().user || null, loggedIn, signIn, logOut, loginOpen, loginValid, tokenRefresh, tokenFresh, syncData, cacheGet, cacheSet, syncOpen, initials, agoText, EXPIRED };
})();
/* ==== end atom page: account ==== */

/* ==== helpers ==== */
const $ = (id) => document.getElementById(id);
const readStore = () => Page.read();
const writeStore = changes => Page.save(changes);
const api = (path, options) => Page.api(path, options);
const toast = (text, isError) => Page.toast(text, isError);
let ws = null, myId = null, retryTimer = null, retryCount = 0;

function note(text, isError) {
  const el = document.createElement("div");
  el.className = "note" + (isError ? " error" : "");
  el.textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
}

function bubble(message) {
  const el = document.createElement("div");
  el.className = "msg " + (message.created_by_id === myId ? "mine" : "theirs");
  el.textContent = message.description;
  const time = document.createElement("time");
  time.textContent = new Date(message.created_at).toLocaleString();
  el.appendChild(time);
  return el;
}

function show(message) {
  $("log").appendChild(bubble(message));
  $("log").scrollTop = $("log").scrollHeight;
}

function render() {
  const data = readStore(), signedIn = Page.loggedIn(), connected = !!ws && myId !== null;
  $("chatView").hidden = !signedIn;
  $("messageState").textContent = connected ? "connected as user " + myId + ", messaging user " + $("peer").value : "";
  $("messageState").className = connected ? "on" : "";
  $("connect").textContent = connected ? "Disconnect" : "Connect";
  $("connect").className = connected ? "" : "primary";
  $("peer").disabled = connected;
  $("text").disabled = !connected;
  $("sendBtn").disabled = !connected;
  if (signedIn && data.peer_id && !$("peer").value) $("peer").value = data.peer_id;
}

/* ==== conversation socket ==== */
async function loadHistory(peerId, after) {
  // history comes from the HTTP thread API, newest first, 50 at a time (api() renews the token once on a 401); the socket only pushes new messages.
  // "Older messages" sends the last page's after, so each click reads the 50 before the oldest one shown, never OFFSET
  const log = $("log"), older = $("olderBtn");
  try {
    const page = await api("/my/message-thread?" + new URLSearchParams({user_id: peerId, limit: 50, ...(after ? {after} : {})}));
    if (older) older.remove();
    const height = log.scrollHeight, first = log.firstChild;
    for (const message of page.obj_list.slice().reverse()) log.insertBefore(bubble(message), first);
    if (page.after) {
      const button = document.createElement("button");
      button.type = "button"; button.id = "olderBtn"; button.className = "note"; button.textContent = "Older messages";
      button.onclick = () => { button.disabled = true; loadHistory(peerId, page.after) };
      log.insertBefore(button, log.firstChild);
    }
    log.scrollTop = after ? log.scrollHeight - height : log.scrollHeight;    // an older page keeps the view where it was; the first one opens at the newest message
    if (!after && !page.obj_list.length) note("No earlier messages");
  } catch (e) {
    if (older) older.disabled = false;
    if (e.status !== 401) note("History: " + e.message, true);
  }
}

async function connect() {
  clearTimeout(retryTimer); retryTimer = null;
  if (!Page.loggedIn() || await Page.tokenRefresh() === false) return;    // a fresh token before connecting, so the socket never opens with an expired one
  const peerId = parseInt($("peer").value, 10);
  if (!peerId) return note("Enter the other user's id", true);
  writeStore({peer_id: peerId});
  $("log").innerHTML = "";
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/my/message-socket");
  // the token goes in the first message, never in the URL, where proxies log it
  ws.onopen = () => ws.send(JSON.stringify({token: readStore().token.access_token}));
  ws.onmessage = async (event) => {
    const data = JSON.parse(event.data);
    if (data.type === "connected") {
      myId = data.message.user_id;
      retryCount = 0;
      render();
      await loadHistory(peerId);
    } else if (data.type === "message") {
      const m = data.message;
      if ((m.created_by_id === myId && m.received_by_id === peerId) || (m.created_by_id === peerId && m.received_by_id === myId)) show(m);
    } else if (data.type === "error") {
      note(data.message, true);
    }
  };
  ws.onclose = async (event) => {
    ws = null; myId = null; render();
    if (event.reason === "token expired") {
      // renew once with the refresh token and reconnect; refused → logged out
      const renewed = await Page.tokenRefresh();
      if (renewed) return connect();
      if (renewed === false) return Page.logOut(Page.EXPIRED);
    }
    if (event.code === 1000) return;
    // 1001 going away, 1006 network drop, 1012 server restart, 1013 try again later: retry with backoff (2s, 4s, 8s ... up to 30s); Connect, Disconnect or Logout stops it
    if ([1001, 1006, 1012, 1013].includes(event.code) && Page.loggedIn()) {
      const delay = Math.min(2000 * 2 ** retryCount++, 30000);
      note("Connection lost, retrying in " + delay / 1000 + "s", true);
      retryTimer = setTimeout(connect, delay);
      return;
    }
    note("Connection closed: " + (event.reason || "connection lost") + " (code " + event.code + ")", true);
  };
}

/* ==== open and close ==== */
// logged in (PAGE.onIn): the chat, and the last conversation again
function chatOpen() {
  $("log").innerHTML = "";
  note("Logged in. Enter the other user's id and connect.");
  render();
  if (readStore().peer_id) connect();
}
// logged out (PAGE.onOut, also from another tab): close the conversation and forget it on screen
function chatClose() {
  clearTimeout(retryTimer); retryTimer = null; retryCount = 0;
  if (ws) ws.close(1000);
  ws = null; myId = null;
  $("peer").value = "";
  $("log").innerHTML = "";
  render();
}
// one button: Connect opens the conversation with the typed user id; Disconnect closes it so the id can be changed
$("connect").onclick = () => {
  if (ws) { ws.close(1000); note("Disconnected"); return; }
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; retryCount = 0; }
  connect();
};
$("send").onsubmit = (event) => {
  event.preventDefault();
  const description = $("text").value.trim();
  if (!description || !ws) return;
  ws.send(JSON.stringify({received_by_id: parseInt($("peer").value, 10), description}));
  $("text").value = "";
};
$("text").onkeydown = (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("send").requestSubmit(); }
};
Page.start();
</script>
</body>
</html>
