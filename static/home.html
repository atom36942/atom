<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Apps</title>
<style>
:root{--bg:#0b0d10;--card:#0f1114;--panel:#1a1d23;--field:#14171c;--line:rgba(255,255,255,.08);--text:#e6eef3;--muted:#9aa0a6;--primary:#38a169;--accent:#4299e1;--purple:#9f7aea;--mono:"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.search{position:relative;flex:0 1 320px;min-width:220px}
.search input{width:100%;height:40px;padding:0 34px 0 12px;font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--accent)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font:11px var(--mono)}
.search input:focus+kbd,.search input:not(:placeholder-shown)+kbd{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--panel);padding:10px 14px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--accent);border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover,tbody tr:focus-within{background:rgba(255,255,255,.04)}
.col-n{width:1%;text-align:center}
td.col-n{color:var(--muted)}
.col-app{width:1%}
.col-path{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
td.col-path{color:var(--muted);font:12px var(--mono)}
.col-app a{color:var(--text);font-weight:600;text-decoration:none;outline:none}
.col-app a:focus-visible{text-decoration:underline;text-decoration-color:var(--accent)}
.col-open{width:1%;text-align:center}
.open{display:inline-flex;padding:4px;border-radius:6px;color:var(--muted);transition:color .15s,background .15s}
.open:hover,.open:focus-visible{color:var(--accent);background:rgba(66,153,225,.12);outline:none}
.message{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.message.error{color:#f87171}
@media (max-width:560px){.wrap{padding:24px 14px}.search{flex:1 1 100%}.col-path{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Apps</h1>
      <p class="sub" id="count">Loading apps...</p>
    </div>
    <label class="search"><input type="search" id="search" placeholder="Search apps" autocomplete="off" spellcheck="false" aria-label="Search apps"><kbd>/</kbd></label>
  </header>
  <main class="panel" id="panel" hidden>
    <table>
      <thead><tr><th class="col-n">#</th><th class="col-app">App</th><th class="col-path">Path</th><th class="col-open">Open</th></tr></thead>
      <tbody id="apps" aria-live="polite"></tbody>
    </table>
  </main>
  <p class="message" id="message" hidden></p>
</div>
<script>
const he = v => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const appsEl = document.getElementById("apps"), messageEl = document.getElementById("message"), searchEl = document.getElementById("search");
let pages = [];
const OPEN_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

const showMessage = (text, isError = false) => {
  messageEl.textContent = text;
  messageEl.classList.toggle("error", isError);
  messageEl.hidden = !text;
};
const render = () => {
  const query = searchEl.value.trim().toLowerCase();
  const shown = pages.filter(p => !query || `${p.name} ${p.url} ${p.folder}`.toLowerCase().includes(query));
  appsEl.innerHTML = shown.map((p, i) => `<tr><td class="col-n">${i + 1}</td><td class="col-app"><a href="${he(p.url)}" target="_blank" rel="noopener">${he(p.name)}</a></td><td class="col-path" title="${he(p.url)}">${he(p.url)}</td><td class="col-open"><a class="open" href="${he(p.url)}" target="_blank" rel="noopener" title="Open ${he(p.name)} in a new tab" aria-label="Open ${he(p.name)} in a new tab">${OPEN_ICON}</a></td></tr>`).join("");
  document.getElementById("panel").hidden = !shown.length;
  showMessage(!pages.length ? "No apps yet: add an .html file to static_extend/." : shown.length ? "" : "No app matches your search.");
};

searchEl.addEventListener("input", render);
appsEl.addEventListener("click", e => {    // a click anywhere on a row opens its app in a new tab, like the name and the icon
  const link = e.target.closest("tr")?.querySelector(".col-app a");
  if (link && !e.target.closest("a")) link.click();
});
searchEl.addEventListener("keydown", e => {
  if (e.key === "Enter") appsEl.querySelector(".col-app a")?.click();    // open the first match
  if (e.key === "Escape") { searchEl.value = ""; render(); searchEl.blur() }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus() }
});

(async () => {
  try {
    const response = await fetch("/static-pages");
    const body = await response.json();
    if (!response.ok || body.status !== 1) throw new Error(body.message || response.statusText);
    pages = body.message;
    document.getElementById("count").textContent = `${pages.length} ${pages.length === 1 ? "app" : "apps"}`;
    render();
  } catch (error) {
    document.getElementById("count").textContent = "";
    showMessage(`Could not load the app list: ${error.message}`, true);
  }
})();
</script>
</body>
</html>
