  <div id="profileModal" class="modal-wrap hidden" role="dialog" aria-modal="true" aria-labelledby="profileTitle">

      <div class="modal-body"><table class="profile-table"><tbody><tr><th>ID</th><td id="profileId"></td></tr><tr><th>Role</th><td id="profileRole"></td></tr><tr><th>Username</th><td id="profileUsername"></td></tr><tr><th>Name</th><td id="profileFullName"></td></tr><tr><th>Email</th><td id="profileEmail"></td></tr><tr><th>Mobile</th><td id="profileMobile"></td></tr></tbody></table></div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script>
    const PULSE_ROLE=4,PAGE_SIZE=10,TASK_TITLE_MAX=100,CACHE_TTL_MS=3600000,TOKEN_KEY="pulse_token",PROFILE_KEY="pulse_user",INFO_CACHE_KEY="pulse_info",USER_CACHE_KEY="pulse_users",TAG_CACHE_KEY="pulse_tags",CACHED_AT_KEY="pulse_cached_at",DASHBOARD_CACHE_KEY="pulse_dashboard";
    function storedToken(){try{const token=JSON.parse(localStorage.getItem(TOKEN_KEY)||"null");return token?.access_token?token:null}catch{return null}}
    const state={token:storedToken(),profile:null,users:[],userById:new Map(),tasks:[],comments:[],mapping:{},page:1,hasNext:false,view:"tasks",taskLayout:"table",draggingTaskId:null,updatingStatusIds:new Set(),editing:null,editingComment:null,commentTask:null,search:"",filters:{},confirmResolve:null,taskRequestId:0,commentRequestId:0,dashboardRequestId:0};
    const elementCache=new Map();
    const $=id=>{if(!elementCache.has(id))elementCache.set(id,document.getElementById(id));return elementCache.get(id)};

    function toast(message,error=false){const el=$("toast");el.textContent=message;el.className="toast"+(error?" error":"");clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add("hidden"),1000)}
    function closeConfirm(result=false){$("confirmModal").classList.add("hidden");if(state.confirmResolve){const resolve=state.confirmResolve;state.confirmResolve=null;resolve(result)}}
    function confirmAction(title,message,confirmLabel="Confirm",danger=false,rows=[],subtitle=""){
      if(state.confirmResolve)closeConfirm(false);$("confirmTitle").textContent=title;$("confirmSubtitle").textContent=subtitle;$("confirmSubtitle").classList.toggle("hidden",!subtitle);$("confirmMessage").textContent=message;$("confirmMessage").classList.toggle("hidden",!message);$("confirmTableBody").innerHTML=rows.map(row=>`<tr>${row.map(value=>`<td>${escapeHtml(value)}</td>`).join("")}</tr>`).join("");$("confirmTable").classList.toggle("hidden",!rows.length);$("confirmBody").classList.toggle("hidden",!message&&!rows.length);$("confirmOkBtn").textContent=confirmLabel;$("confirmOkBtn").className=`btn${danger?" danger":""}`;$("confirmModal").classList.remove("hidden");$("confirmOkBtn").focus();return new Promise(resolve=>{state.confirmResolve=resolve});
    }
    function readStorage(storage,key){try{return JSON.parse(storage.getItem(key)||"null")}catch{return null}}
    function writeStorage(storage,key,value){storage.setItem(key,JSON.stringify(value))}
    function storedJson(key){return readStorage(localStorage,key)}
    function storedSessionJson(key){return readStorage(sessionStorage,key)}
    function cacheIsFresh(){const cachedAt=Number(localStorage.getItem(CACHED_AT_KEY));return !!cachedAt&&Date.now()-cachedAt<CACHE_TTL_MS&&[TOKEN_KEY,PROFILE_KEY,USER_CACHE_KEY,INFO_CACHE_KEY,TAG_CACHE_KEY].every(key=>localStorage.getItem(key)!==null)}
    function setBusy(button,busy,label){button.disabled=busy;if(label)button.textContent=busy?"Working…":label}
    function errorMessage(data,status){if(typeof data?.detail==="string")return data.detail;if(typeof data?.message==="string"&&data.status!==1)return data.message;return status===401||status===403?"Your session is not authorized.":"Something went wrong."}
    async function api(path,{method="GET",query,body,auth=true,bearerToken}={}){
      const url=new URL(path,location.origin);Object.entries(query||{}).forEach(([k,v])=>{if(v!==""&&v!=null)url.searchParams.set(k,typeof v==="object"?JSON.stringify(v):v)});
      const headers={};if(auth&&(bearerToken||state.token?.access_token))headers.Authorization=`Bearer ${bearerToken||state.token.access_token}`;if(body!==undefined)headers["Content-Type"]="application/json";
      const response=await fetch(url,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});let data={};try{data=await response.json()}catch{}
      if(!response.ok||data.status!==1)throw new Error(errorMessage(data,response.status));return data.message;
    }
    function options(target,map,first){target.innerHTML=first?`<option value="">${first}</option>`:"";Object.entries(map).forEach(([value,label])=>target.add(new Option(label,value)))}
    function taskMapping(column){return state.mapping?.task?.[column]||{}}
    function storedUser(){return storedJson(PROFILE_KEY)}
    function refreshOptions(target,map,first){const current=target.value;options(target,map,first);if(current&&Object.hasOwn(map,current))target.value=current}
    function applyInfo(info){
      state.mapping=info?.mapping||{};
      refreshOptions($("statusFilter"),taskMapping("status"),"Any status");refreshOptions($("projectFilter"),taskMapping("project"),"Any project");
      refreshOptions($("taskProject"),taskMapping("project"),"Select project");refreshOptions($("taskStatus"),taskMapping("status"));
    }
    async function loadInfo(force=false){const cached=!force&&storedJson(INFO_CACHE_KEY);if(cached){applyInfo(cached);return}const info=await api("/info",{auth:false,query:force?{is_disable_cache:true}:undefined});applyInfo(info);writeStorage(localStorage,INFO_CACHE_KEY,info)}
    function userName(id){const user=state.userById.get(String(id));return user?(user.name||user.username||`User ${id}`):(id?`User ${id}`:"Unassigned")}
    function localDate(value){if(!value)return "-";const date=new Date(value);return Number.isNaN(date.getTime())?"-":date.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
    function timeAgo(value){if(!value)return "-";const timestamp=new Date(value).getTime();if(Number.isNaN(timestamp))return "-";const seconds=Math.max(0,Math.round((Date.now()-timestamp)/1000)),units=[[31536000,"yr"],[2592000,"mo"],[86400,"day"],[3600,"hr"],[60,"min"],[1,"sec"]];for(const [size,label] of units)if(seconds>=size){const amount=Math.floor(seconds/size),unit=label==="day"&&amount!==1?"days":label;return `${amount} ${unit} ago`}return "0 sec ago"}
    function safeFilterText(value){return value.replace(/[%|,]/g," ").replace(/\s+/g," ").trim().slice(0,80)}
    function filterValues(){return{project:$("projectFilter").value,status:$("statusFilter").value,assignee:$("assigneeFilter").value,tag:$("tagFilter").value,search:$("searchFilter").value.trim()}}
    function hasFilterInput(){return Object.values(filterValues()).some(Boolean)}
    function syncFilterActions(){const enabled=hasFilterInput()||Object.values(state.filters).some(Boolean);$("clearFiltersBtn").disabled=!enabled}
    function applyTaskFilters(includeSearch=true){const values=filterValues();if(!includeSearch)values.search=state.filters.search||"";state.filters=values;state.search=values.search;syncFilterActions();state.page=1;loadTasks()}

    function applyProfile(user){state.profile=user;writeStorage(localStorage,PROFILE_KEY,user);const username=user.username||"User";$("avatarText").textContent=username.slice(0,1).toUpperCase();$("profileId").textContent=user.id??"—";$("profileFullName").textContent=user.name||"—";$("profileUsername").textContent=user.username||"—";$("profileRole").textContent=user.role??"—";$("profileEmail").textContent=user.email||"—";$("profileMobile").textContent=user.mobile||"—"}
    async function loadProfile(force=false){const cached=!force&&storedJson(PROFILE_KEY);if(cached){applyProfile(cached);return}applyProfile(await api("/my/profile"))}
    async function refreshPulseData(force=false,refreshToken=false){const shouldRefresh=force||!cacheIsFresh();if(shouldRefresh&&refreshToken){if(!state.token?.refresh_token)throw new Error("Please log in again.");state.token=await api("/my/token-refresh",{method:"POST",bearerToken:state.token.refresh_token});writeStorage(localStorage,TOKEN_KEY,state.token)}await Promise.all([loadProfile(shouldRefresh),loadInfo(shouldRefresh),loadUsers(shouldRefresh),loadTags(shouldRefresh)]);if(shouldRefresh)localStorage.setItem(CACHED_AT_KEY,String(Date.now()))}
    async function startApp(freshLogin=false){
      try{await refreshPulseData(freshLogin,!freshLogin);showApp();await showView("tasks")}
      catch(error){logout(false);toast(error.message,true)}
    }
    function showApp(){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden")}
    function closeAccountMenu(){$("accountMenu").classList.add("hidden");$("accountBtn").setAttribute("aria-expanded","false")}
    function closeProfile(){$("profileModal").classList.add("hidden")}
    function clearPulseStorage(storage){for(let index=storage.length-1;index>=0;index--){const key=storage.key(index);if(key?.startsWith("pulse_"))storage.removeItem(key)}}
    function logout(showMessage=true){state.token=null;state.profile=null;state.view="tasks";clearPulseStorage(localStorage);clearPulseStorage(sessionStorage);$("dashboardView").classList.add("hidden");$("appView").classList.add("hidden");$("loginView").classList.remove("hidden");$("password").value="";if(showMessage)toast("Signed out")}
    function applyUsers(users){
      state.users=users||[];
      state.userById=new Map(state.users.map(user=>[String(user.id),user]));
      const select=$("taskAssignee");select.innerHTML='<option value="">Select user</option>';state.users.forEach(user=>select.add(new Option(user.name||user.username||`User ${user.id}`,user.id)));
      const assigneeFilter=$("assigneeFilter"),selected=assigneeFilter.value;assigneeFilter.innerHTML='<option value="">Any assignee</option>';state.users.forEach(user=>assigneeFilter.add(new Option(user.username||`User ${user.id}`,user.id)));assigneeFilter.value=selected;
    }
    async function loadUsers(force=false){const cached=!force&&storedJson(USER_CACHE_KEY);if(cached){applyUsers(cached);return}const result=await api("/admin/object-read",{query:{table:"users",column:"id,username,name",filter:[`role = ${PULSE_ROLE}`],order:"name asc",limit:1000,page:1}});const users=result.obj_list||[];applyUsers(users);writeStorage(localStorage,USER_CACHE_KEY,users)}
    function applyTags(rows){const selected=$("tagFilter").value;$("tagFilter").innerHTML='<option value="">Any tag</option>';(rows||[]).forEach(row=>{const tag=row.tags??row.item;if(tag!=null&&tag!=="")$("tagFilter").add(new Option(`${tag} (${Number(row.count)||0})`,tag))});$("tagFilter").value=selected}
    async function loadTags(force=false){const cached=!force&&storedJson(TAG_CACHE_KEY);if(cached){applyTags(cached);return}const result=await api("/admin/table-column-groupby",{query:{table:"task",col:"tags",limit:1000,page:1,order:"item asc"}}),rows=result.obj_list||[];applyTags(rows);writeStorage(localStorage,TAG_CACHE_KEY,rows)}
    function chartLabel(column,value){
      if(value==null)return "Unassigned";if(column==="assigned_to_id")return state.userById.get(String(value))?.username||`User ${value}`;return taskMapping(column)[value]||String(value);
    }
    function renderStatusMatrix(target,rows,rowColumn,rowHeading){if(!rows.length){$(target).innerHTML='<div class="chart-empty">No tasks</div>';return}const rowValues=[...new Set(rows.map(row=>String(row[rowColumn])))].sort((a,b)=>Number(a)-Number(b)),mappedStatuses=Object.keys(taskMapping("status")),statuses=mappedStatuses.length?mappedStatuses:[...new Set(rows.map(row=>String(row.status)))].sort((a,b)=>Number(a)-Number(b)),counts=new Map(rows.map(row=>[`${row[rowColumn]}|${row.status}`,Number(row.count)||0])),totals=statuses.map(status=>rows.reduce((total,row)=>total+(String(row.status)===String(status)?Number(row.count)||0:0),0));$(target).innerHTML=`<table class="status-matrix"><thead><tr><th>${escapeHtml(rowHeading)}</th>${statuses.map(status=>`<th>${escapeHtml(chartLabel("status",status))}</th>`).join("")}</tr></thead><tbody>${rowValues.map(rowValue=>`<tr><th>${escapeHtml(chartLabel(rowColumn,rowValue))}</th>${statuses.map(status=>{const count=counts.get(`${rowValue}|${status}`)||0;return `<td><button class="status-matrix-cell" type="button" data-column="${rowColumn}" data-value="${escapeHtml(rowValue)}" data-status="${escapeHtml(status)}"${count?"":" disabled"}>${count}</button></td>`}).join("")}</tr>`).join("")}</tbody><tfoot><tr><th>Total</th>${totals.map(total=>`<td>${total}</td>`).join("")}</tr></tfoot></table>`}
    function renderDashboard(data){renderStatusMatrix("projectStatusChart",data.projectStatus||[],"project","Project");renderStatusMatrix("assigneeStatusChart",data.assigneeStatus||[],"assigned_to_id","Assignee")}
    async function loadDashboard(force=false){
      const requestId=++state.dashboardRequestId,targets=["projectStatusChart","assigneeStatusChart"],cached=storedSessionJson(DASHBOARD_CACHE_KEY);if(cached&&!force)renderDashboard(cached);else targets.forEach(id=>$(id).innerHTML='<div class="chart-empty">Loading…</div>');
      try{const [projectStatus,assigneeStatus]=await Promise.all([["project","status"],["assigned_to_id","status"]].map(col=>api("/admin/table-column-groupby",{query:{table:"task",col,limit:1000,page:1,order:"count desc"}})));if(requestId!==state.dashboardRequestId)return false;const data={projectStatus:projectStatus.obj_list||[],assigneeStatus:assigneeStatus.obj_list||[]};writeStorage(sessionStorage,DASHBOARD_CACHE_KEY,data);renderDashboard(data);return true}catch(error){if(requestId!==state.dashboardRequestId)return false;if(!cached)targets.forEach(id=>$(id).innerHTML=`<div class="chart-empty">${escapeHtml(error.message)}</div>`);toast(error.message,true);return false}
    }
    async function showView(view){
      state.view=view;if(view==="dashboard"){$("dashboardView").classList.remove("hidden");await loadDashboard()}else{$("dashboardView").classList.add("hidden");await loadTasks()}
    }
    function closeDashboard(){$("dashboardView").classList.add("hidden");state.view="tasks"}
    function openTasksForStatusGroup(column,value,status){["projectFilter","statusFilter","assigneeFilter","tagFilter"].forEach(id=>$(id).value="");$("searchFilter").value="";const filterId={project:"projectFilter",assigned_to_id:"assigneeFilter"}[column];if(filterId)$(filterId).value=String(value);$("statusFilter").value=String(status);state.filters=filterValues();state.search="";syncFilterActions();state.page=1;showView("tasks")}
    function currentFilters(){
      const filters=[],values=state.filters,search=safeFilterText(values.search||"");if(search)filters.push(`title ilike %${search}%`);
      if(values.status)filters.push(`status = ${values.status}`);if(values.project)filters.push(`project = ${values.project}`);if(values.assignee)filters.push(`assigned_to_id = ${values.assignee}`);if(values.tag)filters.push(`tags any ${safeFilterText(values.tag)}`);return filters;
    }
    async function loadTasks(){
      const requestId=++state.taskRequestId;
      $("taskList").innerHTML='<div class="empty">Loading tasks…</div>';
      $("prevBtn").disabled=true;$("nextBtn").disabled=true;
      try{const result=await api("/admin/object-read",{query:{table:"task",limit:PAGE_SIZE,page:state.page,order:"id desc",filter:currentFilters(),relation:["assigned_to_id,users,id,fetch|1,username"]}});if(requestId!==state.taskRequestId)return false;state.tasks=result.obj_list||[];state.hasNext=!!result.has_next_page;renderTasks();return true}
      catch(error){if(requestId!==state.taskRequestId)return false;$("prevBtn").disabled=state.page===1;$("nextBtn").disabled=true;$("taskList").innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;toast(error.message,true);return false}
    }
    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char])}
    function assigneeUsername(task){return task.users?.username||userName(task.assigned_to_id)}
    function taskObjectValue(key,value,task){if(value==null||value==="")return "-";if(key==="due_date")return new Date(`${value}T00:00:00`).toLocaleDateString();if(key==="created_at")return timeAgo(value);if(["project","status"].includes(key))return taskMapping(key)[value]||String(value);if(key==="assigned_to_id")return assigneeUsername(task);if(key==="tags"&&Array.isArray(value))return value.length?value.join(", "):"-";return String(value)}
    function taskTableMarkup(){const projects=taskMapping("project"),statuses=taskMapping("status");return `<div class="task-table-wrap"><table class="task-table"><thead><tr><th>ID</th><th>Title</th><th>Project</th><th>Assignee</th><th>Status</th><th>Due date</th></tr></thead><tbody>${state.tasks.map(task=>`<tr class="task-row" data-id="${task.id}"><td><span class="task-id-time" title="${escapeHtml(new Date(task.created_at).toLocaleString())}"><span>${task.id}</span><small>${escapeHtml(timeAgo(task.created_at))}</small></span></td><td class="title-cell" title="${escapeHtml(task.title)}"><span>${escapeHtml(task.title)}</span></td><td title="${escapeHtml(projects[task.project]||"—")}"><span class="truncate-cell">${escapeHtml(projects[task.project]||"—")}</span></td><td title="${escapeHtml(assigneeUsername(task))}"><span class="truncate-cell">${escapeHtml(assigneeUsername(task))}</span></td><td title="${escapeHtml(statuses[task.status]||"—")}"><span class="truncate-cell">${escapeHtml(statuses[task.status]||"—")}</span></td><td>${escapeHtml(localDate(task.due_date))}</td></tr>`).join("")}</tbody></table></div>`}
    function taskKanbanMarkup(){const projects=taskMapping("project"),statuses=taskMapping("status");return `<div class="kanban-board">${Object.entries(statuses).map(([status,label])=>{const tasks=state.tasks.filter(task=>String(task.status)===String(status));return `<section class="kanban-column" data-status="${status}"><header class="kanban-column-head"><span>${escapeHtml(label)}</span><span class="kanban-count">${tasks.length}</span></header><div class="kanban-cards">${tasks.length?tasks.map(task=>{const updating=state.updatingStatusIds.has(String(task.id));return `<article class="kanban-card task-row${updating?" updating":""}" data-id="${task.id}" draggable="${updating?"false":"true"}" tabindex="0" role="button" aria-label="Open task ${task.id}: ${escapeHtml(task.title)}"><div class="kanban-card-meta"><span>${escapeHtml(projects[task.project]||"-")} · ${escapeHtml(assigneeUsername(task))}</span><span>${escapeHtml(localDate(task.due_date))}</span></div><div class="kanban-card-title" title="${escapeHtml(task.title)}">${escapeHtml(task.title)}</div></article>`}).join(""):'<div class="kanban-empty">No tasks</div>'}</div></section>`}).join("")}</div>`}
    function syncTaskLayoutToggle(){const kanban=state.taskLayout==="kanban",button=$("taskViewToggleBtn");button.title=kanban?"Return to table view":"Kanban view";button.setAttribute("aria-label",kanban?"Return to Table view":"Switch to Kanban view");button.setAttribute("aria-pressed",String(kanban));button.classList.toggle("active",kanban)}
    function renderTasks(){
      $("taskCount").textContent=`${state.tasks.length} task${state.tasks.length===1?"":"s"}`;$("filterSummary").textContent=currentFilters().length?"· filtered":"";$("pageLabel").textContent=`Page ${state.page}`;$("prevBtn").disabled=state.page===1;$("nextBtn").disabled=!state.hasNext;syncTaskLayoutToggle();
      if(!state.tasks.length){$("taskList").innerHTML='<div class="empty">No tasks here. Create one and keep the standup short.</div>';return}
      $("taskList").innerHTML=state.taskLayout==="kanban"?taskKanbanMarkup():taskTableMarkup();
    }
    function openTaskModal(task=null){
      state.editing=task;$("taskModalTitle").textContent=task?"Edit task":"Add task";$("saveTaskBtn").textContent=task?"Save changes":"Create task";
      $("taskModalSubtitle").textContent=task?`ID: ${task.id}`:"";$("taskModalSubtitle").classList.toggle("hidden",!task);
      $("taskTitle").value=task?.title||"";$("taskProject").value=task?.project||"";$("taskAssignee").value=task?.assigned_to_id||storedUser()?.id||"";$("taskStatus").value=task?.status||1;$("taskDue").value=task?.due_date||"";$("taskTags").value=Array.isArray(task?.tags)?task.tags.join(", "):"";$("taskLinkUrl").value=task?.link_url||"";$("taskDescription").value=task?.description||"";syncTitleLimit();$("taskModal").classList.remove("hidden");setTimeout(()=>{const title=$("taskTitle");title.focus({preventScroll:true});title.setSelectionRange(0,0);title.scrollLeft=0;requestAnimationFrame(()=>title.scrollLeft=0)},0)
    }
    function closeTaskModal(){$("taskModal").classList.add("hidden");state.editing=null}
    function syncTitleLimit(){const length=$("taskTitle").value.length,exceeded=length>TASK_TITLE_MAX,help=$("taskTitleHelp"),message=`Title cannot exceed ${TASK_TITLE_MAX} characters`;help.textContent=exceeded?message:`${length} / ${TASK_TITLE_MAX}`;help.classList.toggle("limit",exceeded);$("taskTitle").setCustomValidity(exceeded?message:"")}
    function taskPayload(){const tags=$("taskTags").value.split(",").map(v=>v.trim()).filter(Boolean).slice(0,12);return{title:$("taskTitle").value.trim(),description:$("taskDescription").value.trim()||null,link_url:$("taskLinkUrl").value.trim()||null,project:$("taskProject").value?Number($("taskProject").value):null,assigned_to_id:$("taskAssignee").value?Number($("taskAssignee").value):null,status:Number($("taskStatus").value||1),due_date:$("taskDue").value||null,tags}}
    function changedTaskFields(payload,task){return Object.fromEntries(Object.entries(payload).filter(([key,value])=>Array.isArray(value)?JSON.stringify(value)!==JSON.stringify(task[key]||[]):value!==(task[key]??null)))}
    async function saveTask(event){event.preventDefault();const payload=taskPayload(),editing=state.editing;if(!payload.title)return;if(payload.title.length>TASK_TITLE_MAX){syncTitleLimit();toast(`Title cannot exceed ${TASK_TITLE_MAX} characters`,true);return}setBusy($("saveTaskBtn"),true,editing?"Save changes":"Create task");try{let createdIds=[];if(editing){const changes=changedTaskFields(payload,editing);if(!Object.keys(changes).length){closeTaskModal();toast("No changes");return}await api("/admin/object-update",{method:"PUT",query:{table:"task"},body:{id:editing.id,...changes}});Object.assign(editing,changes);if(Object.hasOwn(changes,"assigned_to_id")){const assignee=state.userById.get(String(changes.assigned_to_id));editing.users=assignee?{username:assignee.username}:undefined}if(state.commentTask&&String(state.commentTask.id)===String(editing.id)){state.commentTask=editing;renderTaskDetail(editing)}}else{const result=await api("/my/object-create",{method:"POST",query:{table:"task"},body:payload});createdIds=Array.isArray(result)?result:[];if(createdIds[0]!=null){const assignee=state.userById.get(String(payload.assigned_to_id)),now=new Date().toISOString();state.tasks.unshift({id:createdIds[0],...payload,created_at:now,updated_at:now,created_by_id:state.profile?.id,users:assignee?{username:assignee.username}:undefined});state.tasks=state.tasks.slice(0,PAGE_SIZE)}}closeTaskModal();renderTasks();toast(editing?"Task updated":createdIds[0]!=null?`Task #${createdIds[0]} created`:"Task created")}catch(error){toast(error.message,true)}finally{setBusy($("saveTaskBtn"),false,editing?"Save changes":"Create task")}}
    async function deleteTask(task){
      if(!await confirmAction("Delete task","Are you sure you want to delete this task? This action cannot be undone.","Delete",true,[],`ID: ${task.id}`))return;
      try{const comments=await api("/admin/object-read",{query:{table:"task_comment",filter:[`task_id = ${task.id}`],limit:1000,page:1}});const ids=(comments.obj_list||[]).map(item=>item.id);if(ids.length)await api("/admin/object-delete",{method:"POST",body:{table:"task_comment",ids}});await api("/admin/object-delete",{method:"POST",body:{table:"task",ids:[task.id]}});state.tasks=state.tasks.filter(item=>String(item.id)!==String(task.id));if(state.commentTask&&String(state.commentTask.id)===String(task.id))closeComments();renderTasks();toast("Task deleted")}catch(error){toast(error.message,true)}
    }
    function safeExternalUrl(value){try{const url=new URL(value);return ["http:","https:"].includes(url.protocol)?url.href:""}catch{return ""}}
    function taskLinkMarkup(value){const url=safeExternalUrl(value);return url?`<div class="task-link-actions"><a class="external-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" title="Open task link" aria-label="Open task link in a new tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-9 9"/><path d="M19 13v6H5V5h6"/></svg></a><button class="external-link copy-task-link" type="button" data-link="${escapeHtml(url)}" title="Copy task link" aria-label="Copy task link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div>`:"-"}
    async function copyTaskLink(url){try{await navigator.clipboard.writeText(url);toast("Link copied")}catch{toast("Could not copy link",true)}}
    async function copyComment(comment){try{await navigator.clipboard.writeText(comment.description||"");toast("Comment copied")}catch{toast("Could not copy comment",true)}}
    function renderTaskDetail(task){const fields=[["Created at","created_at"],["Project","project"],["Assigned to","assigned_to_id"],["Status","status"],["Due date","due_date"],["Tags","tags"],["Link","link_url"]];$("taskViewMeta").textContent=`ID: ${task.id}`;$("taskViewMeta").title=`ID: ${task.id}`;$("taskDetail").innerHTML=`<section class="detail-card"><table class="profile-table task-meta-table"><tbody>${fields.map(([label,key])=>`<tr><th>${label}</th><td${key==="created_at"?` title="${escapeHtml(new Date(task.created_at).toLocaleString())}"`:""}>${key==="link_url"?taskLinkMarkup(task[key]):escapeHtml(taskObjectValue(key,task[key],task))}</td></tr>`).join("")}</tbody></table></section><section class="detail-card task-copy-card"><div class="detail-title-text">${escapeHtml(taskObjectValue("title",task.title,task))}</div><div class="detail-description-text">${task.description?commentDescriptionMarkup(task.description):"-"}</div></section>`}
    async function openComments(task){state.commentTask=task;renderTaskDetail(task);$("commentDrawer").classList.remove("hidden");$("commentInput").focus();await loadComments()}
    async function refreshTaskDetail(){if(!state.commentTask)return;const button=$("refreshTaskDetailBtn");button.disabled=true;try{const result=await api("/admin/object-read",{query:{table:"task",filter:[`id = ${state.commentTask.id}`],limit:1,page:1,relation:["assigned_to_id,users,id,fetch|1,username"]}}),task=result.obj_list?.[0];if(!task)throw new Error("Task not found.");state.commentTask=task;const index=state.tasks.findIndex(item=>String(item.id)===String(task.id));if(index>=0)state.tasks[index]=task;renderTaskDetail(task);renderTasks();await loadComments();toast("Task detail refreshed")}catch(error){toast(error.message,true)}finally{button.disabled=false}}
    function closeComments(){$("commentDrawer").classList.add("hidden");state.commentRequestId++;state.commentTask=null;state.comments=[];closeCommentEdit()}
    async function loadComments(){
      if(!state.commentTask)return;const taskId=state.commentTask.id,requestId=++state.commentRequestId;$("commentList").innerHTML='<div class="empty">Loading comments…</div>';try{const result=await api("/admin/object-read",{query:{table:"task_comment",filter:[`task_id = ${taskId}`],order:"id desc",limit:100,page:1}});if(requestId!==state.commentRequestId||String(state.commentTask?.id)!==String(taskId))return;state.comments=result.obj_list||[];$("commentList").innerHTML=state.comments.length?state.comments.map(comment=>`<div class="comment" data-id="${comment.id}"><div class="comment-top"><strong>${escapeHtml(userName(comment.created_by_id))}</strong><div class="comment-top-right"><span title="${escapeHtml(new Date(comment.created_at).toLocaleString())}">${escapeHtml(timeAgo(comment.created_at))}</span><div class="comment-actions"><button class="comment-action copy-comment" type="button" title="Copy comment" aria-label="Copy comment"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button><button class="comment-action edit-comment" type="button" title="Edit comment" aria-label="Edit comment"><svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="m14 7 3 3"/></svg></button><button class="comment-action delete-comment" type="button" title="Delete comment" aria-label="Delete comment"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button></div></div></div>${commentDescriptionMarkup(comment.description)}</div>`).join(""):'<div class="empty">No comments yet.</div>';$("commentList").scrollTop=0}catch(error){if(requestId===state.commentRequestId)$("commentList").innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`}
    }
    function linkifyCommentText(value){const pattern=/https?:\/\/[^\s<>]+/gi;let last=0,html="";for(const match of value.matchAll(pattern)){html+=escapeHtml(value.slice(last,match.index));const raw=match[0],url=safeExternalUrl(raw);html+=url?`<a class="comment-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(raw)}</a>`:escapeHtml(raw);last=match.index+raw.length}return html+escapeHtml(value.slice(last))}
    function commentDescriptionMarkup(value){const text=String(value??"").trim(),fence=text.match(/^```([a-z0-9_-]*)\s*\n([\s\S]*?)\n?```$/i);if(fence){const language=fence[1]||"code";return `<pre class="comment-code"><span class="comment-code-label">${escapeHtml(language)}</span>${escapeHtml(fence[2])}</pre>`}if(/^[\[{]/.test(text)){try{const parsed=JSON.parse(text);if(parsed&&typeof parsed==="object")return `<pre class="comment-code"><span class="comment-code-label">JSON</span>${escapeHtml(JSON.stringify(parsed,null,2))}</pre>`}catch{}}if(/^(select|insert|update|delete|with|create|alter|drop)\b[\s\S]*;?$/i.test(text)&&(/\n/.test(text)||/;\s*$/.test(text)))return `<pre class="comment-code"><span class="comment-code-label">SQL</span>${escapeHtml(text)}</pre>`;return `<p class="comment-content">${linkifyCommentText(text)}</p>`}
    async function addComment(event){event.preventDefault();const description=$("commentInput").value.trim();if(!description||!state.commentTask)return;setBusy($("commentBtn"),true,"Send");try{await api("/my/object-create",{method:"POST",query:{table:"task_comment"},body:{task_id:state.commentTask.id,description}});$("commentInput").value="";await loadComments();toast("Comment added")}catch(error){toast(error.message,true)}finally{setBusy($("commentBtn"),false,"Send")}}
    function openCommentEdit(comment){state.editingComment=comment;$("commentEditTitle").textContent="Edit comment";$("commentEditSubtitle").textContent=`ID: ${comment.id}`;$("commentEditInput").value=comment.description||"";$("commentEditModal").classList.remove("hidden");setTimeout(()=>$("commentEditInput").focus(),0)}
    function closeCommentEdit(){$("commentEditModal").classList.add("hidden");state.editingComment=null}
    async function updateComment(event){event.preventDefault();const comment=state.editingComment,description=$("commentEditInput").value.trim();if(!comment||!description)return;if(description===comment.description){closeCommentEdit();toast("No changes");return}setBusy($("saveCommentEditBtn"),true,"Save changes");try{await api("/admin/object-update",{method:"PUT",query:{table:"task_comment"},body:{id:comment.id,description}});closeCommentEdit();await loadComments();toast("Comment updated")}catch(error){toast(error.message,true)}finally{setBusy($("saveCommentEditBtn"),false,"Save changes")}}
    async function deleteComment(comment){if(!await confirmAction("Delete comment","","Delete",true,[],`ID: ${comment.id}`))return;try{await api("/admin/object-delete",{method:"POST",body:{table:"task_comment",ids:[comment.id]}});await loadComments();toast("Comment deleted")}catch(error){toast(error.message,true)}}

    $("loginForm").addEventListener("submit",async event=>{event.preventDefault();setBusy($("loginBtn"),true,"Login");try{const token=await api("/auth/login-username-password",{method:"POST",auth:false,body:{role:PULSE_ROLE,username:$("username").value.trim(),password:$("password").value}});state.token=token;writeStorage(localStorage,TOKEN_KEY,token);await startApp(true)}catch(error){toast(error.message,true)}finally{setBusy($("loginBtn"),false,"Login")}});
    $("dashboardBtn").addEventListener("click",()=>showView("dashboard"));$("closeDashboardBtn").addEventListener("click",closeDashboard);$("dashboardView").addEventListener("click",event=>{const cell=event.target.closest(".status-matrix-cell");if(cell)openTasksForStatusGroup(cell.dataset.column,cell.dataset.value,cell.dataset.status);else if(event.target===$("dashboardView"))closeDashboard()});
    $("dashboardRefreshBtn").addEventListener("click",async()=>{const button=$("dashboardRefreshBtn");button.disabled=true;try{if(await loadDashboard(true))toast("Dashboard refreshed")}finally{button.disabled=false}});
    $("accountBtn").addEventListener("click",()=>{const isOpen=$("accountMenu").classList.toggle("hidden")===false;$("accountBtn").setAttribute("aria-expanded",String(isOpen))});$("profileBtn").addEventListener("click",()=>{closeAccountMenu();$("profileModal").classList.remove("hidden")});$("closeProfileBtn").addEventListener("click",closeProfile);$("profileModal").addEventListener("click",event=>{if(event.target===$("profileModal"))closeProfile()});
    $("confirmCancelBtn").addEventListener("click",()=>closeConfirm(false));$("confirmOkBtn").addEventListener("click",()=>closeConfirm(true));$("confirmModal").addEventListener("click",event=>{if(event.target===$("confirmModal"))closeConfirm(false)});$("logoutBtn").addEventListener("click",async()=>{closeAccountMenu();if(await confirmAction("Logout",`Logout from Pulse as ${state.profile?.name||state.profile?.username||"this user"}?`,"Logout"))logout()});
    $("refreshBtn").addEventListener("click",async()=>{closeAccountMenu();const cachedAt=Number(localStorage.getItem(CACHED_AT_KEY)),lastRefreshed=cachedAt?`Last refreshed ${timeAgo(cachedAt)}`:"Never refreshed",refreshInterval=`Auto-refresh every ${CACHE_TTL_MS/3600000} hr`;const rows=[TOKEN_KEY,PROFILE_KEY,USER_CACHE_KEY,INFO_CACHE_KEY,TAG_CACHE_KEY,CACHED_AT_KEY].map((key,index)=>[index+1,key,"Local"]);if(!await confirmAction("Refresh data","","Refresh",false,rows,`${lastRefreshed} · ${refreshInterval}`))return;try{await refreshPulseData(true,true);await (state.view==="dashboard"?loadDashboard():loadTasks());toast("Refreshed")}catch(error){toast(error.message,true)}});
    $("newTaskBtn").addEventListener("click",()=>openTaskModal());$("taskTitle").addEventListener("input",syncTitleLimit);$("taskForm").addEventListener("submit",saveTask);document.querySelectorAll(".close-modal").forEach(el=>el.addEventListener("click",closeTaskModal));$("refreshTaskDetailBtn").addEventListener("click",refreshTaskDetail);$("editTaskDetailBtn").addEventListener("click",()=>{if(state.commentTask)openTaskModal(state.commentTask)});$("deleteTaskDetailBtn").addEventListener("click",()=>{if(state.commentTask)deleteTask(state.commentTask)});$("closeComments").addEventListener("click",closeComments);$("commentForm").addEventListener("submit",addComment);$("taskDetail").addEventListener("click",event=>{const button=event.target.closest(".copy-task-link");if(button)copyTaskLink(button.dataset.link)});$("commentEditForm").addEventListener("submit",updateComment);$("closeCommentEditBtn").addEventListener("click",closeCommentEdit);$("cancelCommentEditBtn").addEventListener("click",closeCommentEdit);$("commentEditModal").addEventListener("click",event=>{if(event.target===$("commentEditModal"))closeCommentEdit()});$("commentList").addEventListener("click",event=>{const item=event.target.closest(".comment[data-id]");if(!item)return;const comment=state.comments.find(value=>String(value.id)===item.dataset.id);if(!comment)return;if(event.target.closest(".copy-comment"))copyComment(comment);else if(event.target.closest(".edit-comment"))openCommentEdit(comment);else if(event.target.closest(".delete-comment"))deleteComment(comment)});
    function openTaskFromElement(element){const task=state.tasks.find(item=>String(item.id)===element?.dataset.id);if(task)openComments(task)}
    function clearKanbanDragState(){$("taskList").querySelectorAll(".dragging,.drop-target").forEach(element=>element.classList.remove("dragging","drop-target"));state.draggingTaskId=null}
    async function moveTaskToStatus(taskId,status){const index=state.tasks.findIndex(item=>String(item.id)===String(taskId)),task=state.tasks[index],nextStatus=Number(status);if(!task||Number(task.status)===nextStatus)return;const previousStatus=task.status,key=String(task.id),hideFromFilteredView=!!state.filters.status&&String(state.filters.status)!==String(nextStatus);task.status=nextStatus;state.updatingStatusIds.add(key);if(hideFromFilteredView)state.tasks.splice(index,1);renderTasks();try{await api("/admin/object-update",{method:"PUT",query:{table:"task"},body:{id:task.id,status:nextStatus}});sessionStorage.removeItem(DASHBOARD_CACHE_KEY);toast("Status updated")}catch(error){task.status=previousStatus;if(hideFromFilteredView)state.tasks.splice(index,0,task);toast(error.message,true)}finally{state.updatingStatusIds.delete(key);renderTasks()}}
    $("taskList").addEventListener("click",event=>{const row=event.target.closest(".task-row");if(row)openTaskFromElement(row)});$("taskList").addEventListener("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&event.target.matches(".kanban-card")){event.preventDefault();openTaskFromElement(event.target)}});$("taskViewToggleBtn").addEventListener("click",()=>{state.taskLayout=state.taskLayout==="table"?"kanban":"table";renderTasks()});
    $("taskList").addEventListener("dragstart",event=>{const card=event.target.closest(".kanban-card[draggable=true]");if(!card)return;state.draggingTaskId=card.dataset.id;card.classList.add("dragging");event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",card.dataset.id)});$("taskList").addEventListener("dragover",event=>{const column=event.target.closest(".kanban-column");if(!column||!state.draggingTaskId)return;event.preventDefault();event.dataTransfer.dropEffect="move";$("taskList").querySelectorAll(".drop-target").forEach(item=>item.classList.remove("drop-target"));column.classList.add("drop-target")});$("taskList").addEventListener("drop",event=>{const column=event.target.closest(".kanban-column"),taskId=event.dataTransfer.getData("text/plain")||state.draggingTaskId;if(!column||!taskId)return;event.preventDefault();const status=column.dataset.status;clearKanbanDragState();moveTaskToStatus(taskId,status)});$("taskList").addEventListener("dragend",clearKanbanDragState);
    $("taskRefreshBtn").addEventListener("click",async()=>{const button=$("taskRefreshBtn");button.disabled=true;try{if(await loadTasks())toast("Tasks refreshed")}finally{button.disabled=false}});["projectFilter","statusFilter","assigneeFilter","tagFilter"].forEach(id=>$(id).addEventListener("change",()=>applyTaskFilters(false)));$("filterForm").addEventListener("submit",event=>{event.preventDefault();applyTaskFilters(true)});$("searchFilter").addEventListener("input",syncFilterActions);$("clearFiltersBtn").addEventListener("click",()=>{["projectFilter","statusFilter","assigneeFilter","tagFilter"].forEach(id=>$(id).value="");$("searchFilter").value="";state.filters={};state.search="";syncFilterActions();state.page=1;loadTasks()});$("prevBtn").addEventListener("click",()=>{if(state.page>1){state.page--;loadTasks()}});$("nextBtn").addEventListener("click",()=>{if(state.hasNext){state.page++;loadTasks()}});
    $("taskModal").addEventListener("click",event=>{if(event.target===$("taskModal"))closeTaskModal()});$("commentDrawer").addEventListener("click",event=>{if(event.target===$("commentDrawer"))closeComments()});document.addEventListener("click",event=>{if(!event.target.closest(".account"))closeAccountMenu()});document.addEventListener("keydown",event=>{if(event.key==="Escape"){if(state.confirmResolve)closeConfirm(false);else if(!$("commentEditModal").classList.contains("hidden"))closeCommentEdit();else if(!$("dashboardView").classList.contains("hidden"))closeDashboard();else{closeAccountMenu();closeProfile();closeTaskModal();closeComments()}}else if(event.key.toLowerCase()==="n"&&!/input|textarea|select/i.test(document.activeElement.tagName)&&state.profile)openTaskModal()});
    setInterval(()=>{if(state.profile)refreshPulseData(true,true).then(()=>state.view==="dashboard"?loadDashboard():renderTasks()).catch(()=>{})},CACHE_TTL_MS);if(state.token)startApp();
  </script>
