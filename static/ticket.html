<script>
// Identical in every Atom page (docs/frontend.md, Reference code): the look before the page draws, so it never flashes another one.
// Saved in the page's own localStorage key (<html data-storage-key>, the key it keeps its login in) under "settings": theme = "dark", "light" or "system"
// (the computer's mode, followed as it changes); density = "comfortable" (the default) or "compact". So each page keeps its own; logout removes the whole key (back on the defaults).
// Chosen in Settings (account menu), followed by every tab of the page; the result is <html data-theme data-density>. window.atomSettings: get, set, apply.
(() => {
  const root = document.documentElement, key = root.dataset.storageKey, media = matchMedia("(prefers-color-scheme: dark)");
  const stored = () => { try { const data = JSON.parse(localStorage.getItem(key) || "{}"); return data && typeof data === "object" && !Array.isArray(data) ? data : {} } catch { return {} } };
  // the default when nothing is saved: <html data-default-theme="light"> (an app page) or the first option (dark, Atom's pages); the same for density
  const get = (name, options) => { const value = stored().settings?.[name], fallback = root.dataset["default" + name[0].toUpperCase() + name.slice(1)]; return options.includes(value) ? value : options.includes(fallback) ? fallback : options[0] };
  const apply = () => {
    const theme = get("theme", ["dark", "light", "system"]);
    root.dataset.theme = theme === "system" ? (media.matches ? "dark" : "light") : theme;
    root.dataset.density = get("density", ["comfortable", "compact"]);
  };
  const set = (name, value) => { const data = stored(); try { localStorage.setItem(key, JSON.stringify({ ...data, settings: { ...data.settings, [name]: value } })) } catch {} apply() };
  apply();
  media.addEventListener("change", apply);
  addEventListener("storage", e => { if (e.key === key || e.key === null) apply() });
  window.atomSettings = { get, set, apply };
})();
</script>

.avatar[aria-expanded="true"]{box-shadow:var(--ring)}
.login-btn{background:var(--brand)}
.login-btn:hover:not(:disabled){background:var(--brand-hover)}
.login-page{background:var(--bg)}
.login-badge,.feature-icon{background:var(--brand-fill);color:var(--brand-ink)}
.toast-icon{background:var(--success)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top bar: the logo mark and name, the page's actions, then the avatar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;height:var(--topbar-h);padding:0 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:17px;font-weight:700}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--radius);background:var(--brand);color:#fff;font-size:16px;font-weight:700}
.top-actions{display:flex;align-items:center;gap:8px}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:var(--btn-h);padding:0 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);font-weight:600}
main{padding:24px 24px 48px}
/* the filters in one grey card (Clear filters at its end), the view icons and Refresh in a second card at the right */
.list-toolbar{display:flex;align-items:stretch;gap:12px;margin-bottom:16px}
.filters{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(96px,1fr)) minmax(230px,2.2fr) auto;gap:9px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.filters select{width:100%;min-width:0;background-color:var(--field);border-color:var(--line-strong)}
.filters select.in-use{background-color:var(--brand-fill);border-color:var(--brand-line);color:var(--brand-ink);font-weight:600}
.list-controls{display:flex;flex:none;align-items:center;gap:9px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.view-switch{display:flex;align-items:center;gap:4px;height:var(--control-h);padding:3px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--card)}
.view-switch button{width:28px;height:28px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);display:grid;place-items:center}
.view-switch button[aria-pressed="true"]{background:var(--brand-fill);color:var(--brand-ink)}
.search-box{display:flex;align-items:center;min-width:0;height:var(--control-h);border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--field);overflow:hidden}
.search-box:focus-within{border-color:var(--brand-ink);box-shadow:var(--ring)}
.search-box select{height:100%;width:auto;flex:none;border:0;border-right:1px solid var(--line);border-radius:0;background-color:var(--panel);font-weight:600;font-size:12px}
.search-box select:focus{box-shadow:none}
.search-box input{flex:1;min-width:0;height:100%;border:0;border-radius:0;background:transparent;box-shadow:none}
.search-box input:focus{box-shadow:none}
.search-box button{width:30px;height:100%;padding:0;border:0;border-radius:0;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.search-box .search-go{color:var(--brand-ink)}
.clear-btn:not(:disabled){background:var(--danger-soft);border-color:var(--danger-soft);color:var(--danger)}
@media (max-width:1360px){.list-toolbar{flex-direction:column}.list-controls{align-self:flex-end}}
@media (max-width:1060px){.filters{grid-template-columns:1fr 1fr}.search-box{grid-column:1/-1}}
@media (max-width:520px){.filters{grid-template-columns:1fr}.search-box{grid-column:auto}}
/* the board: one column per status, its first page read for every column in one call, the next pages as a column scrolls */
.board{display:grid;grid-template-columns:repeat(var(--columns,3),minmax(200px,1fr));gap:10px;overflow-x:auto;overscroll-behavior-x:contain}    /* one row at every width: a narrow screen scrolls the board sideways, never the page */
.column{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.column.hidden-column{visibility:hidden}
.column.drop-target{border-color:var(--brand-ink);box-shadow:var(--ring)}
.column-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.column[data-status="1"] .column-head{background:var(--panel);color:var(--muted);border-top:3px solid var(--faint)}
.column[data-status="2"] .column-head{background:var(--info-soft);color:var(--info);border-top:3px solid var(--info)}
.column[data-status="3"] .column-head{background:var(--blocked-soft);color:var(--blocked);border-top:3px solid var(--blocked)}
.column[data-status="4"] .column-head{background:var(--warn-soft);color:var(--warn);border-top:3px solid var(--warn)}
.column[data-status="5"] .column-head{background:var(--success-soft);color:var(--success);border-top:3px solid var(--success)}
.count{min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 8px;border-radius:999px;background:var(--card);font-size:11px;font-weight:600}
.cards{display:grid;align-content:start;gap:7px;height:min(600px,calc(100vh - 250px));min-height:220px;padding:8px;overflow-y:auto;overscroll-behavior:contain}
.card{min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:var(--card-pad);text-align:left;cursor:grab;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.card:hover{transform:translateY(-1px)}}
.card.dragging{opacity:.45}
.card.updating{cursor:wait;opacity:.65}
.card-title{overflow-wrap:anywhere;font-weight:500;line-height:1.35}
.card-meta{display:flex;align-items:center;gap:3px;margin-top:11px;min-width:0}
.card-meta>*{flex:none}
.card-meta .badge{width:20px;height:20px;font-size:9px;margin-right:5px}
.card-meta .meta{height:18px;display:inline-flex;align-items:center;font-size:10.5px;font-weight:500;white-space:nowrap}
.card-meta .meta+.meta{margin-left:8px}
.card-meta .meta.type{color:var(--muted)}
.card-meta .age{margin-left:auto;padding-left:4px;color:var(--faint);font-size:10px;font-weight:500;white-space:nowrap}
.high{color:var(--danger)!important;font-weight:600!important}
.age.old{color:var(--danger);font-weight:600}
.column-state{padding:14px 8px;text-align:center;color:var(--muted);font-size:12px}
.column-state.error{color:var(--danger)}
/* a person as initials (full name on hover), the same badge on cards and comments */
.badge{position:relative;display:grid;flex:none;place-items:center;width:22px;height:22px;border:1px solid var(--line-strong);border-radius:50%;background:var(--panel);color:var(--muted);font-size:10px;font-weight:700;cursor:default}
.badge[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:50%;left:calc(100% + 6px);z-index:5;padding:3px 8px;border-radius:6px;background:var(--text);color:var(--card);font-size:11px;font-weight:500;white-space:nowrap;transform:translateY(-50%);pointer-events:none}
/* the table: newest first, 25 a page after the cursor */
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ticket-table{width:100%;border-collapse:collapse;table-layout:fixed}
.ticket-table th{padding:var(--cell-pad);text-align:left;background:var(--brand-tint);color:var(--text);font-size:12px;font-weight:600;white-space:nowrap}
.ticket-table td{padding:var(--cell-pad);border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticket-table td.title-cell{white-space:normal;overflow-wrap:anywhere}
.ticket-table tbody tr{cursor:pointer}
.ticket-table tbody tr:hover{background:var(--panel)}
.ticket-table tbody tr:last-child td{border-bottom:0}
.c-id{width:70px}.c-contact{width:22%}.c-type{width:90px}.c-priority{width:80px}.c-status{width:110px}.c-created{width:110px}.c-age{width:70px;text-align:center}
.ticket-table td.c-age{text-align:center}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--panel);color:var(--muted)}
.pill.s2{background:var(--info-soft);color:var(--info)}.pill.s3{background:var(--blocked-soft);color:var(--blocked)}.pill.s4{background:var(--warn-soft);color:var(--warn)}.pill.s5{background:var(--success-soft);color:var(--success)}
.list.is-loading{opacity:.55}
.empty{background:var(--card);border:1px dashed var(--line-strong);border-radius:12px;text-align:center;padding:54px 20px;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px}
.pager-btn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.pager-label{font-size:12px;font-weight:600;color:var(--muted)}
@media (max-width:720px){
  main,.topbar{padding-left:16px;padding-right:16px}
  .cards{height:calc(100vh - 220px);min-height:300px}
  .hbtn span{display:none}
  .table-wrap{border:0;background:transparent}
  .ticket-table,.ticket-table tbody{display:block}.ticket-table thead{display:none}
  .ticket-table tbody{display:grid;gap:9px}
  .ticket-table tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .ticket-table td{display:block;width:auto!important;padding:0!important;border:0!important;min-width:0;text-align:left!important}
  .ticket-table td::before{content:attr(data-label);display:block;margin-bottom:2px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .ticket-table td.title-cell{order:-1;grid-column:1/-1}
}
@media (max-width:1000px){.hbtn span{display:none}}
/* the ticket detail: the facts and the description at the left, the comments at the right */
dialog.view{width:min(1080px,calc(100vw - 32px));height:min(780px,calc(100vh - 32px));padding:0;border:1px solid var(--line-strong);border-radius:12px;background:var(--card);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
dialog.view[open]{display:flex;flex-direction:column}
dialog.view::backdrop{background:rgba(16,24,40,.45)}
.view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--brand);color:#fff}
.view-head h3{margin:0;font-size:17px;font-weight:600;color:#fff}
.view-id{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--brand-soft);font-size:12px}
.head-actions{display:flex;gap:6px}
.head-btn{width:30px;height:30px;padding:0;border:1px solid #ffffff59;border-radius:var(--radius);background:transparent;color:#fff;display:grid;place-items:center}
.head-btn:hover:not(:disabled){background:rgba(255,255,255,.14);border-color:#ffffff59}
.view-id .mini{width:22px;height:22px;padding:0;border:0;background:none;color:var(--brand-soft);display:grid;place-items:center}
.view-id .mini:hover:not(:disabled){background:rgba(255,255,255,.14);border:0}
.view-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(380px,1.1fr);gap:10px;padding:10px;background:var(--bg)}
.detail-cards{display:grid;gap:10px;grid-template-rows:auto minmax(0,1fr);min-height:0}
.detail-card{min-width:0;padding:4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.facts{width:100%;border-collapse:collapse;table-layout:fixed}
.facts th{width:96px;padding:5px 0;text-align:left;color:var(--muted);font-size:12px;font-weight:600;vertical-align:middle;border-bottom:1px solid var(--line)}
.facts td{padding:5px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.facts tr:last-child th,.facts tr:last-child td{border-bottom:0}
.facts select{width:100%;height:30px}
.facts select.s2{background-color:var(--info-soft);color:var(--info);font-weight:600}.facts select.s3{background-color:var(--blocked-soft);color:var(--blocked);font-weight:600}.facts select.s4{background-color:var(--warn-soft);color:var(--warn);font-weight:600}.facts select.s5{background-color:var(--success-soft);color:var(--success);font-weight:600}
.facts a{color:var(--brand-ink)}
.description-card{display:flex;flex-direction:column;min-height:0;padding:10px 12px}
.description-card h4{margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;overflow-wrap:anywhere}
.description-text{flex:1;min-height:0;overflow:auto}
.comments-pane{min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.comments-title{padding:10px 12px 6px;font-weight:600}
.comments{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 12px;overflow-y:auto}
.comments-empty{flex:1;display:grid;place-items:center;color:var(--muted)}
.comment{flex:none;padding:8px 10px;border-radius:var(--radius);background:var(--panel)}
.comment-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--muted);font-size:12px}
.comment-time{font-size:11px;color:var(--faint);cursor:default}
.comment-actions{display:flex;gap:2px;margin-left:auto}
.comment-action{width:25px;height:25px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted);display:grid;place-items:center}
.comment-action:hover:not(:disabled){background:var(--card);color:var(--text);border:0}
.comment-action.delete{color:var(--danger)}
.comment-action svg{width:14px;height:14px}
.comment-edit{display:grid;gap:6px}
.comment-edit textarea{width:100%;min-height:70px;font-family:var(--font);font-size:12px}
.comment-edit div{display:flex;justify-content:flex-end;gap:6px}
.comment-form{display:flex;align-items:flex-end;gap:7px;padding:10px 12px;border-top:1px solid var(--line)}
.comment-form textarea{flex:1;min-height:var(--control-h);max-height:160px;height:var(--control-h);padding:8px 10px;line-height:1.4;resize:none;overflow-y:auto;font-family:var(--font);font-size:var(--fs)}
.comments-older{display:block;margin:10px auto 4px}
@media (max-width:760px){.view-grid{grid-template-columns:1fr;grid-template-rows:auto minmax(260px,1fr);overflow-y:auto}}
/* Markdown in comments and the description: drawn by the page, the text escaped first */
.md{font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.md>*+*,.md blockquote>*+*{margin-top:6px}
.md p,.md ul,.md ol,.md blockquote,.md hr,.md .md-heading{margin:0}
.md .md-heading{font-size:1.05em;font-weight:650;line-height:1.35}
.md h1.md-heading{font-size:1.25em}.md h2.md-heading{font-size:1.15em}
.md ul,.md ol{padding-left:20px}
.md li+li,.md li>ul,.md li>ol{margin-top:2px}
.md li.md-task{list-style:none;margin-left:-18px}
.md li.md-task input{width:auto;height:auto;margin:0 6px 0 0;vertical-align:-2px}
.md blockquote{padding:2px 0 2px 10px;border-left:3px solid var(--line-strong);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line)}
.md-code{padding:1px 4px;border:1px solid var(--line);border-radius:4px;background:var(--card);font:.92em var(--mono)}
.md-link{color:var(--brand-ink);text-decoration:underline;text-underline-offset:2px}
.md pre{margin:2px 0 0;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);font:12px/1.5 var(--mono);white-space:pre-wrap;overflow:auto}
.md-table-wrap{max-width:100%;overflow-x:auto}
.md-table{border-collapse:collapse}
.md-table th,.md-table td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.md-table th{background:var(--card);font-weight:600}
dialog.dlg .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog.dlg .form-grid .wide{grid-column:1/-1}
dialog.dlg textarea{width:100%;min-height:90px;font-family:var(--font);font-size:var(--fs);background:var(--field);border:1px solid var(--line);border-radius:var(--radius)}
dialog.dlg.wide{width:min(620px,calc(100vw - 32px))}
.add-card{display:grid;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.add-card+.add-card{margin-top:-4px}
.label-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.label-row .field-help.limit{color:var(--danger);font-weight:700}
.req{color:var(--danger)}
.check{display:flex;align-items:center;gap:8px}
dialog.dlg .check input{width:16px;height:16px}
.export-note{margin:0;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="appView" hidden>
  <header class="topbar">
    <a class="brand" href="/page/ticket" id="homeLink"><span class="mark">T</span><span>Tickets</span></a>

      <button type="button" class="hbtn" id="addBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add ticket</span></button>
      <button type="button" class="hbtn" id="exportBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>Export</span></button>
<!-- ==== atom page: account header ==== -->
<div class="atom-account">
  <button type="button" class="primary" id="loginOpenBtn" hidden>Log in</button>

    <button type="button" class="avatar" id="accountBtn" data-tip="Account" aria-haspopup="true" aria-expanded="false" aria-label="Account menu"><span id="avatarText">?</span></button>
    <div class="account-menu" id="accountMenu" role="menu" hidden>
      <button type="button" class="account-item" id="profileBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>My profile</button>
      <button type="button" class="account-item" id="detailsBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Login details</button>
      <button type="button" class="account-item" id="syncBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17"/></svg>Sync</button>
      <button type="button" class="account-item" id="settingsBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
      <button type="button" class="account-item danger-item" id="logoutBtn" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 4h5v16h-5"/></svg>Logout</button>
    </div>
  </div>
</div>
<!-- ==== end atom page: account header ==== -->
    </div>
  </header>
  <main>
    <div class="list-toolbar">
      <div class="filters">
        <select id="statusFilter" aria-label="Status" data-all="Status"></select>
        <select id="priorityFilter" aria-label="Priority" data-all="Priority"></select>
        <select id="typeFilter" aria-label="Type" data-all="Type"></select>
        <select id="sourceFilter" aria-label="Source"><option value="">Source</option><option value="login">Logged in</option><option value="public">Public</option></select>
        <select id="createdFilter" aria-label="Created"><option value="">Created</option><option value="0">Today</option><option value="1">Yesterday</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="month">This month</option><option value="90">Last 90 days</option></select>
        <form class="search-box" id="searchForm" role="search">
          <select id="searchField" aria-label="Search column"><option value="title">Title</option><option value="name">Name</option><option value="email">Email</option><option value="mobile">Mobile</option><option value="id">ID</option></select>
          <input id="searchText" placeholder="Search title…" aria-label="Search text" autocomplete="off" maxlength="120">
          <button type="button" id="searchClear" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
          <button type="submit" class="search-go" id="searchGo" aria-label="Search" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </form>
        <button type="button" class="clear-btn" id="clearBtn" disabled>Clear filters</button>
      </div>

<script>
/* ==== page settings and the account block ==== */
// Tickets: the support team's desk for what customers send (table ticket, from a project's form: /my/object-create logged in, /public/object-create without a login; Add ticket here sends it as public).
// Any role may log in; the page needs ticket read (120) to open, and reads and changes everything through /permission/object-*: ticket 120 read, 121 update, 122 delete;
// ticket_comment 123 create, 124 read, 125 update and 126 delete anyone's (a comment's author changes their own through /my). Root holds them all.
const PAGE = { key: "ticket", title: "Tickets", role: null, loginRequired: true, idb: false, intro: { heading: "Answer what your customers send", text: "Support requests, feedback and bugs from your apps, on one board for the support team.", features: [['<rect x="4" y="4" width="4" height="14" rx="1"/><rect x="10" y="4" width="4" height="9" rx="1"/><rect x="16" y="4" width="4" height="11" rx="1"/>', "Board", "New to Done: drag a card to move it."], ['<path d="M4 6h16M7 12h10M10 18h4"/>', "Filters", "Status, priority, type, source, date, search."], ['<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>', "Comments", "The team's notes on every ticket."], ['<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>', "Export", "The list as CSV, filtered or all."]] }, onIn: () => pageOpen(), onOut: () => { el("appView").hidden = true; if (el("viewDialog").open) viewDialogClose() } };
/* ==== atom page: account ==== */
// Identical in every Atom page that logs in (docs/frontend.md, Reference code); the page sets PAGE just above this block and calls Page.start() last. A test checks the copies match.
// localStorage[PAGE.key] = {v, token, user, info, synced_at, ...the page's choices}; IndexedDB database PAGE.key, store "cache", records {name, user_id, saved_at, data} (pages with PAGE.idb).
// Logged in means a valid token object; the user comes from GET /my/profile and is checked on every sync; Sync runs every 3 hours and from the account menu; logout clears everything in every tab.
// Without a login: a page that needs one shows the login page (PAGE.intro: {heading, text, features: [[svg paths, title, line], ...]}); a page with PAGE.login opens its own login instead (API: the runner).
const Page = (() => {
  const STORAGE_KEY = PAGE.key, STORAGE_VERSION = 1, IDB_STORE = "cache", IDB_VERSION = 2, SYNC_EVERY_MS = 3 * 3600 * 1000;
  const EXPIRED = "Your session has expired. Please log in again.";
  const el = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const dash = v => v == null || v === "" ? "-" : esc(v);
  const nowSec = () => Math.floor(Date.now() / 1000);
  const ICON = {
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
    copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    eye: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  };

  /* -- storage -- */
  const read = () => { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); return s && s.v === STORAGE_VERSION ? s : {} } catch { return {} } };
  const save = changes => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...read(), settings: JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}")?.settings, ...changes, v: STORAGE_VERSION })) } catch {} };    // settings (the theme block's) are kept, even when chosen before login
  // the whole token object, valid, or logged out
  const loginValid = token => !!token && typeof token.access_token === "string" && token.access_token !== "" && typeof token.refresh_token === "string" && token.refresh_token !== "" && Number.isFinite(token.access_token_expires_at) && Number.isFinite(token.refresh_token_expires_at) && token.refresh_token_expires_at > nowSec();
  // a deleted or deactivated account: Atom answers 403 "account deleted" / "account deactivated" at login, at token refresh and on every token route; the page logs out and says so
  const ACCOUNT_REFUSED = { "account deleted": "Your account was deleted. Please contact your admin.", "account deactivated": "Your account is deactivated. Please contact your admin." };
  const BLOCKED_TITLE = { [ACCOUNT_REFUSED["account deleted"]]: "Account deleted", [ACCOUNT_REFUSED["account deactivated"]]: "Account deactivated" };
  let accountRefused = "";    // set by a refused request: every logout until the next login shows it, never "session expired"
  const userBlock = user => !user ? "Your account could not be loaded." : user.deleted_at ? ACCOUNT_REFUSED["account deleted"] : user.deactivated_at ? ACCOUNT_REFUSED["account deactivated"] : PAGE.role != null && Number(user.role) !== PAGE.role ? `${PAGE.title} access is unavailable.` : "";

  /* -- IndexedDB cache: big or slow reference data; a record saved for another user is ignored -- */
  const idbOpen = () => new Promise((resolve, reject) => {
    const q = indexedDB.open(STORAGE_KEY, IDB_VERSION);
    q.onupgradeneeded = () => { const db = q.result; if (db.objectStoreNames.contains(IDB_STORE)) db.deleteObjectStore(IDB_STORE); db.createObjectStore(IDB_STORE, { keyPath: "name" }) };
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
  const idbRun = async (mode, work) => { const db = await idbOpen(); try { return await new Promise((resolve, reject) => { const q = work(db.transaction(IDB_STORE, mode).objectStore(IDB_STORE)); q.onsuccess = () => resolve(q.result); q.onerror = () => reject(q.error) }) } finally { db.close() } };
  const cacheGet = async name => { if (!PAGE.idb) return null; try { const r = await idbRun("readonly", s => s.get(name)); return r && r.user_id === (read().user?.id ?? null) ? r : null } catch { return null } };
  const cacheSet = async (name, data) => { if (!PAGE.idb || (PAGE.loginRequired && !loginValid(read().token))) return; try { await idbRun("readwrite", s => s.put({ name, user_id: read().user?.id ?? null, saved_at: Date.now(), data })) } catch {} };
  const cacheCount = async () => { if (!PAGE.idb) return 0; try { return await idbRun("readonly", s => s.count()) } catch { return 0 } };
  const cacheClear = () => new Promise(resolve => { if (!PAGE.idb) return resolve(); const q = indexedDB.deleteDatabase(STORAGE_KEY); q.onsuccess = q.onerror = q.onblocked = () => resolve() });

  /* -- toast and the one dialog every part of the page uses -- */
  let toastTimer = null;
  const toastClose = () => { clearTimeout(toastTimer); if (el("toast").matches(":popover-open")) el("toast").hidePopover() };
  const toastWait = () => { clearTimeout(toastTimer); toastTimer = setTimeout(toastClose, 6000) };
  // shown again each time, so it is the newest thing in the top layer (above a dialog opened since)
  const toast = (text, isError = false) => { const t = el("toast"); t.querySelector(".toast-text").textContent = text; t.querySelector(".toast-icon").textContent = isError ? "!" : "✓"; t.classList.toggle("error", !!isError); if (t.matches(":popover-open")) t.hidePopover(); t.showPopover(); toastWait() };
  el("toast").querySelector(".toast-close").addEventListener("click", toastClose);
  el("toast").addEventListener("mouseenter", () => clearTimeout(toastTimer));
  el("toast").addEventListener("mouseleave", () => { if (el("toast").matches(":popover-open")) toastWait() });
  let dialogOn = {}, dialogLocked = false, formResolve = null;
  // dialog({title, sub, body, actions, on: {buttonId: handler}}): a title, an optional subtitle, a body and actions only when there is something to do
  const dialog = ({ title, sub = "", body = "", actions = "", on = {} }) => {
    formResolve?.(false);    // a form still waiting is answered "no" when the dialog shows something else
    formResolve = null;
    el("atomTitle").textContent = title;
    el("atomSub").textContent = sub;
    el("atomSub").hidden = !sub;
    el("atomBody").innerHTML = body + '<div class="error-box" id="atomError" hidden></div>';
    el("atomActions").innerHTML = actions;
    el("atomActions").hidden = !actions;
    dialogOn = on;
    if (!el("atomDialog").open) el("atomDialog").showModal();
  };
  const dialogClose = () => { if (el("atomDialog").open) el("atomDialog").close() };
  const dialogError = text => { const e = el("atomError"); if (e) { e.textContent = text || ""; e.hidden = !text } };
  const dialogLock = on => { dialogLocked = on; for (const b of el("atomDialog").querySelectorAll("button")) b.disabled = on };
  // form({title, sub, body, ok, tone, submit}): Cancel, then the main action; submit() runs on the action or Enter and its error stays in the dialog;
  // resolves true when done, false on Cancel or close. confirm(title, text, ok, danger) is a form without fields
  const form = ({ title, sub = "", body = "", ok = "OK", tone = "primary", submit = null }) => new Promise(resolve => {
    const done = value => { formResolve = null; dialogClose(); resolve(value) };
    const run = async () => {
      if (!submit) return done(true);
      dialogError("");
      dialogLock(true);
      try { await submit(); dialogLock(false); done(true) }
      catch (failure) { dialogLock(false); dialogError(failure.message) }
    };
    dialog({ title, sub, body: `<form class="dlg-form" id="atomForm" novalidate>${body}</form>`, actions: `<button type="button" id="atomCancel">Cancel</button><button type="submit" form="atomForm" class="${tone}" id="atomOk">${esc(ok)}</button>`, on: { atomCancel: () => done(false) } });
    formResolve = resolve;
    el("atomForm").addEventListener("submit", e => { e.preventDefault(); run() });
    (el("atomForm").querySelector("input:not([disabled]),select,textarea") || el("atomOk")).focus();
  });
  const confirm = (title, text, ok = "OK", danger = false) => form({ title, body: `<p class="confirm-text">${esc(text)}</p>`, ok, tone: danger ? "danger" : "primary" });
  // the row list of My profile, Login details, Sync and any record view, as in the apps: icon and label left, value right, one line between rows
  const KV_ICONS = { Name: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', Username: '<circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.5 7.1"/>', Email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>', Mobile: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>', Created: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>', "Job title": '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>', City: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/>', Country: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>', About: '<path d="M4 6h16M4 11h16M4 16h10"/>', Role: '<path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6l-7-3Z"/>', Permissions: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/>', ID: '<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>', Password: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>', "Local storage": '<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13 7.5 5h9L19 13"/><path d="M7 16.5h.01"/>', IndexedDB: '<ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13"/><path d="M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>' };
  const kv = rows => `<div class="kv">${rows.map(([label, html]) => `<div class="kv-row"><span class="kv-label">${KV_ICONS[label] ? `<svg viewBox="0 0 24 24" aria-hidden="true">${KV_ICONS[label]}</svg>` : ""}${esc(label)}</span><span class="kv-value">${html}</span></div>`).join("")}</div>`;
  const eyeToggle = (input, button) => {
    const draw = () => { const shown = input.type === "text"; button.innerHTML = shown ? ICON.eyeOff : ICON.eye; button.ariaLabel = shown ? "Hide password" : "Show password" };
    button.addEventListener("click", () => { input.type = input.type === "password" ? "text" : "password"; draw(); input.focus() });
    draw();
  };

  /* -- requests: the token as Bearer; a 401 renews the token once and retries -- */
  let refreshing = null;
  // true: a valid new token is saved; false: the refresh token expired or was refused (log out); null: the server could not be reached (keep the token, try later)
  const tokenRefresh = () => refreshing ||= (async () => {
    const token = read().token;
    if (!loginValid(token)) return false;
    try {
      const response = await fetch("/my/token-refresh", { method: "POST", headers: { Authorization: `Bearer ${token.refresh_token}` } });
      const body = await response.json().catch(() => ({}));
      if (response.ok && body.status === 1) { if (!loginValid(body.message)) return false; save({ token: body.message }); return true }
      if (response.status === 403) accountRefused = ACCOUNT_REFUSED[body.message] || accountRefused;
      return response.status === 401 || response.status === 403 ? false : null;
    } catch { return null }
  })().finally(() => { refreshing = null });
  const request = async (path, options = {}, retry = true) => {
    let token = read().token;
    if (loginValid(token) && token.access_token_expires_at - nowSec() <= 30) { if (await tokenRefresh() === false) { logOut(EXPIRED); throw Object.assign(new Error(EXPIRED), { status: 401 }) } token = read().token }
    const json = typeof options.body === "string";
    const headers = { ...(json ? { "Content-Type": "application/json" } : {}), ...(options.headers || {}), ...(loginValid(token) ? { Authorization: `Bearer ${token.access_token}` } : {}) };
    const response = await fetch(path, { ...options, headers });
    if (response.status === 403 && loginValid(token)) {
      const refused = ACCOUNT_REFUSED[(await response.clone().json().catch(() => ({}))).message];
      if (refused) { accountRefused = refused; logOut(); throw Object.assign(new Error(refused), { status: 403 }) }
    }
    if (response.status === 401 && retry && loginValid(token)) {
      const renewed = await tokenRefresh();
      if (renewed) return request(path, options, false);
      if (renewed === false) logOut(EXPIRED);
    }
    return response;
  };
  // Atom's answer {status: 1, message}: the message, or an Error with the server's text and .status
  const api = async (path, options = {}) => {
    const response = await request(path, options);
    const body = await response.json().catch(() => ({}));
    if (!response.ok || body.status !== 1) throw Object.assign(new Error(typeof body.message === "string" ? body.message : `HTTP ${response.status}`), { status: response.status });
    return body.message;
  };

  /* -- session -- */
  const loggedIn = () => !el("accountWrap").hidden;
  // the user (GET /my/profile) into "user": on login, when missing and on every sync; false when the user may not use the page (logged out)
  const profileLoad = async (force = false) => {
    if (!loginValid(read().token)) return false;
    if (force || !read().user) {
      try { save({ user: await api("/my/profile") }) }
      catch (error) { if (error.status === 401 || error.status === 403) { logOut(EXPIRED); return false } }    // offline: keep the saved user
    }
