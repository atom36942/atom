const { esc, toast, api, request, read, save } = Page;
const PAGE_SIZE = 25, COMMENT_PAGE_SIZE = 50, OLD_DAYS = 7;
const PERMISSION = { read: 120, update: 121, delete: 122, commentCreate: 123, commentRead: 124, commentUpdate: 125, commentDelete: 126 };
const COLUMNS = "id,title,type,priority,status,name,email,mobile,created_by_id,created_at,closed_at";
const SEARCH_LABEL = { title: "title", name: "name", email: "email", mobile: "mobile", id: "ID" };
const DEFAULTS = { status: { 1: "New", 2: "In Progress", 3: "Blocked", 4: "Waiting", 5: "Done" }, priority: { 1: "Low", 2: "Normal", 3: "High" }, type: { 1: "Support", 2: "Feedback", 3: "Bug" } };
const NOT_ALLOWED = "You are not allowed to do this. Ask an admin for access.";
// labels from /info (config_column_int_mapping.ticket), saved by Sync; Atom's defaults before the first sync
const labels = column => { const map = read().info?.config_column_int_mapping?.ticket?.[column]; return map && Object.keys(map).length ? map : DEFAULTS[column] };
const label = (column, value) => value == null ? "-" : labels(column)[value] ?? String(value);
const holds = id => (Page.user()?.permissions || []).map(Number).includes(id);
const me = () => Page.user()?.id;
const failText = failure => failure.status === 403 ? NOT_ALLOWED : failure.message;
const ago = iso => { const days = Math.floor((Date.now() - new Date(iso)) / 864e5); return days < 1 ? "today" : `${days}d` };
const ageDays = iso => Math.max(0, Math.floor((Date.now() - new Date(iso)) / 864e5));
const dateText = iso => { if (!iso) return "-"; const d = new Date(iso); return Number.isNaN(d.getTime()) ? "-" : `${String(d.getDate()).padStart(2, "0")}-${d.toLocaleString("en-GB", { month: "short" })}-${d.getFullYear()}` };
const dateTimeText = iso => iso ? `${dateText(iso)} ${new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}` : "-";
const timeAgo = iso => { if (!iso) return "-"; const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)); if (s < 60) return "just now"; for (const [size, unit] of [[31536000, "yr"], [2592000, "mo"], [86400, "day"], [3600, "hr"], [60, "min"]]) if (s >= size) { const n = Math.floor(s / size); return `${n} ${unit}${n === 1 || unit === "min" || unit === "hr" ? "" : "s"} ago` } };
const contactName = row => row.name || row.email || row.mobile || (row.created_by_id ? userName(row.created_by_id) : "Unknown");
const contactLine = row => [row.name, row.email, row.mobile].filter(Boolean).join(" · ") || (row.created_by_id ? userName(row.created_by_id) : "-");
const icon = path => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;

/* ==== people: usernames for comment authors and logged-in senders, one /private/user-read call for the ids not known yet ==== */
const users = new Map();
const userName = id => users.get(Number(id)) || `User ${id}`;
const usersLoad = async ids => {
  const missing = [...new Set(ids.filter(id => id != null && !users.has(Number(id))).map(Number))].slice(0, 100);
  if (!missing.length) return;
  try { for (const u of (await api(`/private/user-read?${new URLSearchParams({ filter: JSON.stringify([`id in ${missing.join(",")}`]), limit: "100" })}`)).obj_list || []) users.set(Number(u.id), u.username) }
  catch { /* names stay "User <id>" */ }
};

/* ==== filters: built once as Atom's filter list, the same for the board, the table and the export; each condition on an indexed column ==== */
const state = { layout: read().layout === "table" ? "table" : "kanban", columns: new Map(), boardId: 0, table: { afters: [null], page: 0, rows: [], loading: false }, tableId: 0, rows: new Map(), moving: new Set() };
const filterValues = () => ({ status: el("statusFilter").value, priority: el("priorityFilter").value, type: el("typeFilter").value, source: el("sourceFilter").value, created: el("createdFilter").value, field: el("searchField").value, text: el("searchText").value.trim() });
const createdFrom = choice => { const d = new Date(); d.setHours(0, 0, 0, 0); if (choice === "month") d.setDate(1); else d.setDate(d.getDate() - Number(choice)); return d };
const filterList = (values = filterValues(), withStatus = true) => {
  const list = [];
  if (withStatus && values.status) list.push(`status = ${values.status}`);
  if (values.priority) list.push(`priority = ${values.priority}`);
  if (values.type) list.push(`type = ${values.type}`);
  if (values.source) list.push(values.source === "login" ? "created_by_id is not null" : "created_by_id is null");
  if (values.created) { list.push(`created_at >= ${createdFrom(values.created).toISOString()}`); if (values.created === "1") { const end = createdFrom("0"); list.push(`created_at < ${end.toISOString()}`) } }
  if (values.text) list.push(values.field === "id" ? `id = ${/^\d{1,18}$/.test(values.text) ? values.text : 0}` : { [values.field]: `ilike,%${values.text}%` });
  return list;
};
const filterInUse = () => { const v = filterValues(); return !!(v.status || v.priority || v.type || v.source || v.created || v.text) };
// whether a ticket still passes the filters after a change made here (a search the page can't judge exactly reloads instead)
const matches = row => {
  const v = filterValues();
  if (v.priority && String(row.priority) !== v.priority) return false;
  if (v.type && String(row.type) !== v.type) return false;
  if (state.layout === "table" && v.status && String(row.status) !== v.status) return false;
  return true;
};
const drawFilters = () => {
  for (const [id, column] of [["statusFilter", "status"], ["priorityFilter", "priority"], ["typeFilter", "type"]]) {
    const select = el(id), value = select.value;
    select.innerHTML = `<option value="">${select.dataset.all}</option>` + Object.entries(labels(column)).map(([key, text]) => `<option value="${esc(key)}">${esc(text)}</option>`).join("");
    select.value = value;
  }
  drawFilterState();
};
const drawFilterState = () => {
  for (const id of ["statusFilter", "priorityFilter", "typeFilter", "sourceFilter", "createdFilter"]) el(id).classList.toggle("in-use", !!el(id).value);
  el("clearBtn").disabled = !filterInUse();
  el("searchClear").hidden = el("searchGo").hidden = !el("searchText").value;
  el("searchText").placeholder = `Search ${SEARCH_LABEL[el("searchField").value]}…`;
};
const pageError = text => { el("pageError").textContent = text || ""; el("pageError").hidden = !text };

/* ==== board: the first page of every column in one call (group_column=status), the next pages of a column as it scrolls ==== */
const statuses = () => Object.entries(labels("status"));
const boardResetColumns = () => {
  state.boardId++;
  const only = el("statusFilter").value;
  state.columns = new Map(statuses().filter(([status]) => !only || status === only).map(([status, text]) => [status, { status, label: text, items: [], after: null, hasNext: true, loading: true, error: "" }]));
};
const boardLoad = async () => {
  boardResetColumns();
  drawBoard();
  const id = state.boardId, columns = [...state.columns.values()];
  if (!columns.length) return;
  try {
    const query = new URLSearchParams({ table: "ticket", group_column: "status", group_values: JSON.stringify(columns.map(c => Number(c.status))), filter: JSON.stringify(filterList(undefined, false)), order: "id desc", limit: String(PAGE_SIZE), column: COLUMNS });
    const groups = (await api(`/permission/object-read?${query}`)).groups || {};
    if (id !== state.boardId) return;
    for (const column of columns) { const page = groups[column.status] || { obj_list: [], after: null }; column.items = page.obj_list; column.after = page.after; column.hasNext = !!page.after; column.loading = false }
    await usersLoad(columns.flatMap(c => c.items.map(row => row.created_by_id)));
  } catch (failure) {
    if (id !== state.boardId || failure.status === 401) return;
    for (const column of columns) { column.loading = false; column.error = failText(failure) }
  }
  if (id === state.boardId) drawBoard();
};
const columnMore = async column => {
  if (column.loading || !column.hasNext || state.layout !== "kanban") return;
  const id = state.boardId;
  column.loading = true;
  drawBoard();
  try {
    const query = new URLSearchParams({ table: "ticket", filter: JSON.stringify([...filterList(undefined, false), `status = ${column.status}`]), order: "id desc", limit: String(PAGE_SIZE), column: COLUMNS, after: column.after });
    const page = await api(`/permission/object-read?${query}`);
    if (id !== state.boardId) return;
    const seen = new Set(column.items.map(row => row.id));
    column.items.push(...(page.obj_list || []).filter(row => !seen.has(row.id)));
    column.after = page.after;
    column.hasNext = !!page.after;
    await usersLoad(column.items.map(row => row.created_by_id));
  } catch (failure) { if (id === state.boardId) column.error = failText(failure) }
  if (id === state.boardId) { column.loading = false; drawBoard() }
};
const cardMarkup = row => {
  const who = contactName(row), old = row.status !== 5 && ageDays(row.created_at) >= OLD_DAYS;
  return `<article class="card${state.moving.has(row.id) ? " updating" : ""}" data-id="${row.id}" draggable="${state.moving.has(row.id) ? "false" : "true"}" tabindex="0" role="button" aria-label="Open ticket ${row.id}: ${esc(row.title)}"><div class="card-title">${esc(row.title)}</div><div class="card-meta"><span class="badge" data-tip="${esc(contactLine(row))}">${esc(Page.initials(who))}</span><span class="meta${row.priority === 3 ? " high" : ""}">${esc(label("priority", row.priority))}</span><span class="meta type">${esc(label("type", row.type))}</span><span class="age${old ? " old" : ""}" title="Created ${esc(dateTimeText(row.created_at))}${old ? `, open over ${OLD_DAYS} days` : ""}">${esc(ago(row.created_at))}</span></div></article>`;
};
const drawBoard = () => {
  const scroll = new Map([...document.querySelectorAll(".cards[data-status]")].map(node => [node.dataset.status, node.scrollTop]));
  for (const column of state.columns.values()) for (const row of column.items) state.rows.set(row.id, row);
  el("ticketList").innerHTML = `<div class="board" style="--columns:${statuses().length}">${statuses().map(([status]) => {
    const column = state.columns.get(status);
    if (!column) return '<section class="column hidden-column" aria-hidden="true"></section>';
    const note = column.error ? `<div class="column-state error">${esc(column.error)}</div>` : column.loading ? '<div class="column-state">Loading…</div>' : !column.items.length ? '<div class="column-state">No tickets</div>' : column.hasNext ? '<div class="column-state">Scroll for more</div>' : "";
    return `<section class="column" data-status="${status}"><header class="column-head"><span>${esc(column.label)}</span><span class="count">${column.items.length}${column.hasNext && !column.loading ? "+" : ""}</span></header><div class="cards" data-status="${status}">${column.items.map(cardMarkup).join("")}${note}</div></section>`;
  }).join("")}</div>`;
  requestAnimationFrame(() => document.querySelectorAll(".cards[data-status]").forEach(node => { node.scrollTop = scroll.get(node.dataset.status) || 0 }));
};

/* ==== table: newest first, 25 a page after the cursor; Previous goes back through the cursors already seen ==== */
const tableLoad = async (page = 0) => {
  const id = ++state.tableId, table = state.table;
  table.loading = true;
  el("ticketList").classList.add("is-loading");
  if (!table.rows.length) el("ticketList").innerHTML = '<div class="empty">Loading…</div>';
  try {
    const query = new URLSearchParams({ table: "ticket", filter: JSON.stringify(filterList()), order: "id desc", limit: String(PAGE_SIZE), column: COLUMNS });
    if (table.afters[page]) query.set("after", table.afters[page]);
    const result = await api(`/permission/object-read?${query}`);
    if (id !== state.tableId) return;
    table.page = page;
    table.afters[page + 1] = result.after;
    table.afters.length = page + 2;
    table.rows = result.obj_list || [];
    await usersLoad(table.rows.map(row => row.created_by_id));
  } catch (failure) {
    if (id !== state.tableId || failure.status === 401) return;
    table.rows = [];
    pageError(failText(failure));
  } finally {
    if (id === state.tableId) { table.loading = false; el("ticketList").classList.remove("is-loading"); drawTable() }
  }
};
const drawTable = () => {
  const table = state.table;
  for (const row of table.rows) state.rows.set(row.id, row);
  const cell = (name, labelText, html, extra = "") => `<td class="${name}${extra}" data-label="${labelText}">${html}</td>`;
  el("ticketList").innerHTML = table.rows.length ? `<div class="table-wrap"><table class="ticket-table"><colgroup><col class="c-id"><col><col class="c-contact"><col class="c-type"><col class="c-priority"><col class="c-status"><col class="c-created"><col class="c-age"></colgroup><thead><tr><th>ID</th><th>Title</th><th>Contact</th><th>Type</th><th>Priority</th><th>Status</th><th>Created</th><th class="c-age">Age (days)</th></tr></thead><tbody>${table.rows.map(row => {
    const old = row.status !== 5 && ageDays(row.created_at) >= OLD_DAYS;
    return `<tr data-id="${row.id}" tabindex="0">${cell("c-id", "ID", `<b>${row.id}</b>`)}${cell("title-cell", "Title", esc(row.title))}${cell("c-contact", "Contact", esc(contactLine(row)))}${cell("c-type", "Type", esc(label("type", row.type)))}${cell("c-priority", "Priority", esc(label("priority", row.priority)), row.priority === 3 ? " high" : "")}${cell("c-status", "Status", `<span class="pill s${row.status}">${esc(label("status", row.status))}</span>`)}${cell("c-created", "Created", `<span title="${esc(dateTimeText(row.created_at))}">${esc(dateText(row.created_at))}</span>`)}${cell("c-age", "Age (days)", String(ageDays(row.created_at)), old ? " old age" : "")}</tr>`;
  }).join("")}</tbody></table></div>` : `<div class="empty">${filterInUse() ? "No results" : "No tickets"}</div>`;
  el("pageLabel").textContent = `Page ${table.page + 1}`;
  el("prevBtn").disabled = table.page === 0 || table.loading;
  el("nextBtn").disabled = !table.afters[table.page + 1] || table.loading;
};

/* ==== layout and reload ==== */
const reload = () => {
  pageError("");
  drawFilterState();
  el("pager").hidden = state.layout !== "table";
  el("kanbanBtn").setAttribute("aria-pressed", String(state.layout === "kanban"));
  el("tableBtn").setAttribute("aria-pressed", String(state.layout === "table"));
  state.rows.clear();
  if (state.layout === "kanban") { state.tableId++; boardLoad() }
  else { state.boardId++; state.table = { afters: [null], page: 0, rows: [], loading: false }; tableLoad(0) }
};
const layoutSet = layout => { if (layout === state.layout) return; state.layout = layout; save({ layout }); reload() };

/* ==== a change made here: shown from what the page has, with only the write call ==== */
const rowChanged = (row, before) => {
  state.rows.set(row.id, row);
  if (state.layout === "table") {
    const index = state.table.rows.findIndex(r => r.id === row.id);
    if (index >= 0) { if (matches(row)) state.table.rows[index] = row; else state.table.rows.splice(index, 1) }
    return drawTable();
  }
  for (const column of state.columns.values()) column.items = column.items.filter(r => r.id !== row.id);
  const target = state.columns.get(String(row.status));
  if (target && matches(row) && (!target.hasNext || !target.items.length || row.id > target.items[target.items.length - 1].id)) { target.items.push(row); target.items.sort((a, b) => b.id - a.id) }
  if (before && el("searchText").value.trim()) return reload();    // a search the page can't judge exactly
  drawBoard();
};
const rowRemoved = id => {
  state.rows.delete(id);
  if (state.layout === "table") { state.table.rows = state.table.rows.filter(r => r.id !== id); return drawTable() }
  for (const column of state.columns.values()) column.items = column.items.filter(r => r.id !== id);
  drawBoard();
};
const ticketUpdate = async (row, changes) => {
  await api("/permission/object-update?table=ticket", { method: "PUT", body: JSON.stringify({ id: row.id, ...changes }) });
  const fresh = (await api(`/permission/object-read?${new URLSearchParams({ table: "ticket", filter: JSON.stringify([`id = ${row.id}`]), limit: "1" })}`)).obj_list?.[0];
  return fresh || { ...row, ...changes };
};

/* ==== drag a card to another column: its status changes (ticket update, 121); refused or failed, it goes back ==== */
let dragId = null;
const boardEvents = () => {
  const list = el("ticketList");
  list.addEventListener("dragstart", e => { const card = e.target.closest(".card"); if (!card) return; dragId = Number(card.dataset.id); card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragId)) });
  list.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".dragging,.drop-target").forEach(node => node.classList.remove("dragging", "drop-target")) });
  list.addEventListener("dragover", e => { const column = e.target.closest(".column[data-status]"); if (!column || dragId == null) return; e.preventDefault(); document.querySelectorAll(".drop-target").forEach(node => node !== column && node.classList.remove("drop-target")); column.classList.add("drop-target") });
  list.addEventListener("drop", async e => {
    const column = e.target.closest(".column[data-status]"), row = state.rows.get(dragId);
    document.querySelectorAll(".drop-target").forEach(node => node.classList.remove("drop-target"));
    if (!column || !row) return;
    e.preventDefault();
    const status = Number(column.dataset.status);
    if (status === row.status) return;
    if (!holds(PERMISSION.update)) return toast(NOT_ALLOWED, true);
    state.moving.add(row.id);
    rowChanged({ ...row, status });
    try { rowChanged(await ticketUpdate(row, { status })); toast(`Ticket #${row.id} moved to ${label("status", status)}`) }
    catch (failure) { rowChanged(row); toast(failText(failure), true) }
    finally { state.moving.delete(row.id); drawBoard() }
  });
  list.addEventListener("scroll", e => { const cards = e.target.closest?.(".cards[data-status]"); if (!cards || cards.scrollTop + cards.clientHeight < cards.scrollHeight - 80) return; const column = state.columns.get(cards.dataset.status); if (column) columnMore(column) }, true);
  const openFrom = e => { const node = e.target.closest(".card[data-id],tr[data-id]"); if (node) viewOpen(Number(node.dataset.id)) };
  list.addEventListener("click", openFrom);
  list.addEventListener("keydown", e => { if (e.key === "Enter") openFrom(e) });
};

/* ==== Markdown in comments and the description (no library): the text escaped first, then headings, lists, [ ] boxes, quotes, tables, code, bold, italic, strike, links (http and https) ==== */
const HOLD = /\u0000(\d+)\u0000/g;
const safeUrl = raw => { try { const url = new URL(raw); return ["http:", "https:"].includes(url.protocol) ? url.href : "" } catch { return "" } };
const mdEmphasis = html => html.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<strong>$1</strong>").replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>").replace(/(^|[^\w*])\*(?=[^\s*])([^*]*?[^\s*])\*(?![\w*])/g, "$1<em>$2</em>").replace(/(^|[^\w])_(?=[^\s_])([^_]*?[^\s_])_(?!\w)/g, "$1<em>$2</em>");
const mdInline = value => {
  const held = [], hold = html => `\u0000${held.push(html) - 1}\u0000`, restore = html => html.replace(HOLD, (_, i) => restore(held[i]));
  const link = (text, url) => hold(`<a class="md-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`);
  const text = String(value).replace(/\u0000/g, "").replace(/`([^`\n]+)`/g, (_, code) => hold(`<code class="md-code">${esc(code)}</code>`))
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/gi, (all, text, raw) => { const url = safeUrl(raw); return url ? link(mdEmphasis(esc(text)), url) : all })
    .replace(/https?:\/\/[^\s<>\u0000]+/gi, raw => { const trail = raw.match(/[.,;:!?)]+$/)?.[0] || "", core = raw.slice(0, raw.length - trail.length), url = safeUrl(core); return (url ? link(esc(core), url) : hold(esc(core))) + trail });
  return restore(mdEmphasis(esc(text))).replace(/\n/g, "<br>");
};
const MD = { fence: /^\s*```\s*([\w+#.-]*)\s*$/, heading: /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/, rule: /^\s{0,3}([-*_])(\s*\1){2,}\s*$/, quote: /^\s{0,3}>\s?/, item: /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/, row: /^\s*\|.*\|\s*$/, sep: /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/ };
const mdCells = line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
const mdStarts = (lines, i) => MD.fence.test(lines[i]) || MD.heading.test(lines[i]) || MD.rule.test(lines[i]) || MD.quote.test(lines[i]) || MD.item.test(lines[i]) || (MD.row.test(lines[i]) && MD.sep.test(lines[i + 1] || ""));
const mdList = entries => {
  let i = 0;
  const build = level => {
    const first = entries[i], tag = first.ordered ? "ol" : "ul";
    let html = `<${tag}>`, open = false;
    while (i < entries.length && entries[i].indent >= level) {
      const entry = entries[i];
      if (entry.indent === level && entry.ordered !== first.ordered) break;
      if (entry.indent > level && open) { html += build(entry.indent); continue }
      if (open) html += "</li>";
      const box = entry.text.match(/^\[([ xX])\]\s+([\s\S]*)$/);
      html += box ? `<li class="md-task"><input type="checkbox" disabled${box[1] === " " ? "" : " checked"}>${mdInline(box[2])}` : `<li>${mdInline(entry.text)}`;
      open = true; i++;
    }
    return html + (open ? "</li>" : "") + `</${tag}>`;
  };
  let html = "";
  while (i < entries.length) html += build(entries[i].indent);
  return html;
};
const mdBlocks = value => {
  const lines = String(value).replace(/\r\n?/g, "\n").split("\n");
  let html = "", i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue }
    const fence = line.match(MD.fence);
    if (fence) { const code = []; i++; while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) code.push(lines[i++]); i++; html += `<pre>${esc(code.join("\n"))}</pre>`; continue }
    const heading = line.match(MD.heading);
    if (heading) { html += `<h${heading[1].length} class="md-heading">${mdInline(heading[2])}</h${heading[1].length}>`; i++; continue }
    if (MD.rule.test(line)) { html += "<hr>"; i++; continue }
    if (MD.quote.test(line)) { const quote = []; while (i < lines.length && MD.quote.test(lines[i])) quote.push(lines[i++].replace(MD.quote, "")); html += `<blockquote>${mdBlocks(quote.join("\n"))}</blockquote>`; continue }
    if (MD.row.test(line) && MD.sep.test(lines[i + 1] || "")) {
      const head = mdCells(line), rows = [];
      i += 2;
      while (i < lines.length && MD.row.test(lines[i])) rows.push(mdCells(lines[i++]));
      html += `<div class="md-table-wrap"><table class="md-table"><thead><tr>${head.map(text => `<th>${mdInline(text)}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${head.map((_, k) => `<td>${mdInline(row[k] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (MD.item.test(line)) {
      const entries = [];
      while (i < lines.length) {
        const item = lines[i].match(MD.item);
        if (item) { entries.push({ indent: item[1].replace(/\t/g, "  ").length, ordered: /\d/.test(item[2]), text: item[3] }); i++ }
        else if (lines[i].trim() && /^\s/.test(lines[i]) && entries.length) entries[entries.length - 1].text += `\n${lines[i++].trim()}`;
        else if (!lines[i].trim() && MD.item.test(lines[i + 1] || "")) i++;
        else break;
      }
      html += mdList(entries);
      continue;
    }
    const paragraph = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !mdStarts(lines, i)) paragraph.push(lines[i++]);
    html += `<p>${mdInline(paragraph.join("\n"))}</p>`;
  }
  return html;
};
const markdown = value => { const text = String(value ?? "").trim(); return text ? mdBlocks(text) : '<p class="muted">-</p>' };

/* ==== the ticket detail: the facts (status, priority and type saved on change), the description, the comments ==== */
const view = { row: null, comments: [], after: null, requestId: 0 };
const select = (column, value) => `<select data-column="${column}" class="${column === "status" ? `s${value}` : ""}" aria-label="${column}">${Object.entries(labels(column)).map(([key, text]) => `<option value="${esc(key)}"${String(value) === key ? " selected" : ""}>${esc(text)}</option>`).join("")}</select>`;
const drawView = () => {
  const row = view.row;
  el("viewId").textContent = `ID ${row.id}`;
  el("viewTicketTitle").textContent = row.title;
  el("viewDescription").innerHTML = markdown(row.description);
  const link = (scheme, value) => value ? `<a href="${scheme}:${esc(value.replace(/\s+/g, ""))}">${esc(value)}</a>` : "-";
  const facts = [["Status", select("status", row.status)], ["Priority", select("priority", row.priority)], ["Type", select("type", row.type)], ["Name", esc(row.name || "-")], ["Email", link("mailto", row.email)], ["Mobile", link("tel", row.mobile)], ["Source", row.created_by_id ? `Logged in (${esc(userName(row.created_by_id))})` : "Public"], ["Created at", `<span title="${esc(dateTimeText(row.created_at))}">${esc(timeAgo(row.created_at))}</span>`], ["Updated at", row.updated_at ? `<span title="${esc(dateTimeText(row.updated_at))}">${esc(timeAgo(row.updated_at))}</span>` : "-"], ["Done", row.closed_at ? esc(dateTimeText(row.closed_at)) : "-"]];
  el("facts").innerHTML = facts.map(([name, html]) => `<tr><th scope="row">${name}</th><td>${html}</td></tr>`).join("");
};
const viewOpen = async id => {
  const known = state.rows.get(id), requestId = ++view.requestId;
  view.row = known ? { ...known } : { id, title: "Loading…", status: 1, priority: 2, type: 1 };
  view.comments = []; view.after = null;
  drawView();
  el("commentList").innerHTML = '<div class="comments-empty">Loading…</div>';
  el("commentInput").value = "";
  if (!el("viewDialog").open) el("viewDialog").showModal();
  try {
    const [ticket, comments] = await Promise.all([
      api(`/permission/object-read?${new URLSearchParams({ table: "ticket", filter: JSON.stringify([`id = ${id}`]), limit: "1" })}`),
      commentsRead(id).catch(failure => ({ failure })),
    ]);
    if (requestId !== view.requestId) return;
    const row = ticket.obj_list?.[0];
    if (!row) { viewDialogClose(); return toast(`Ticket #${id} not found`, true) }
    view.row = row;
    await usersLoad([row.created_by_id, ...(comments.obj_list || []).map(c => c.created_by_id)]);
    drawView();
    if (comments.failure) el("commentList").innerHTML = `<div class="comments-empty">${esc(failText(comments.failure))}</div>`;
    else { view.comments = comments.obj_list || []; view.after = comments.after; drawComments() }
  } catch (failure) { if (requestId === view.requestId) { viewDialogClose(); toast(failText(failure), true) } }
};
const viewChoice = async target => {
  const column = target.dataset.column, value = Number(target.value), row = view.row;
  if (value === row[column]) return;
  if (!holds(PERMISSION.update)) { target.value = row[column]; return toast(NOT_ALLOWED, true) }
  target.disabled = true;
  try { view.row = await ticketUpdate(row, { [column]: value }); drawView(); rowChanged(view.row, row); toast("Saved") }
  catch (failure) { target.value = row[column]; toast(failText(failure), true) }
  finally { target.disabled = false }
};
const viewDelete = async () => {
  const row = view.row;
  if (!holds(PERMISSION.delete)) return toast(NOT_ALLOWED, true);
  if (!await Page.confirm(`Delete ticket #${row.id}?`, "Its comments are deleted too. This can't be undone.", "Delete", true)) return;
  try { await api("/permission/object-delete?table=ticket", { method: "POST", body: JSON.stringify({ ids: [row.id] }) }); viewDialogClose(); rowRemoved(row.id); toast(`Ticket #${row.id} deleted`) }
  catch (failure) { toast(failText(failure), true) }
};

/* ==== comments: newest first, 50 a page after the cursor; added with comment create (123); the author edits or deletes their own (/my), others need 125 or 126 ==== */
const commentsRead = (ticketId, after = null) => api(`/permission/object-read?${new URLSearchParams({ table: "ticket_comment", filter: JSON.stringify([`ticket_id = ${ticketId}`]), order: "id desc", limit: String(COMMENT_PAGE_SIZE), ...(after ? { after } : {}) })}`);
const commentMarkup = c => {
  const author = userName(c.created_by_id);
  return `<div class="comment" data-id="${c.id}"><div class="comment-top"><span class="badge" data-tip="${esc(author)}">${esc(Page.initials(author))}</span><span class="comment-time" title="${esc(dateTimeText(c.created_at))}">${esc(timeAgo(c.created_at))}${c.updated_at ? " · edited" : ""}</span><div class="comment-actions"><button type="button" class="comment-action" data-act="copy" aria-label="Copy comment">${icon('<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>')}</button><button type="button" class="comment-action" data-act="edit" aria-label="Edit comment">${icon('<path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="m14 7 3 3"/>')}</button><button type="button" class="comment-action delete" data-act="delete" aria-label="Delete comment">${icon('<path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/>')}</button></div></div><div class="md">${mdBlocks(c.description)}</div></div>`;
};
const drawComments = () => {
  el("commentList").innerHTML = view.comments.length ? view.comments.map(commentMarkup).join("") + (view.after ? '<button type="button" class="comments-older" id="commentsOlder">Show older comments</button>' : "") : '<div class="comments-empty">No comments</div>';
};
const commentsOlder = async () => {
  const requestId = view.requestId;
  try { const page = await commentsRead(view.row.id, view.after); if (requestId !== view.requestId) return; await usersLoad((page.obj_list || []).map(c => c.created_by_id)); view.comments.push(...(page.obj_list || [])); view.after = page.after; drawComments() }
  catch (failure) { toast(failText(failure), true) }
};
const commentAdd = async () => {
  const text = el("commentInput").value.trim();
  if (!text) return;
  if (!holds(PERMISSION.commentCreate)) return toast(NOT_ALLOWED, true);
  el("commentSend").disabled = true;
  try {
    const [id] = await api("/permission/object-create?table=ticket_comment", { method: "POST", body: JSON.stringify({ ticket_id: view.row.id, description: text }) });
    users.set(Number(me()), Page.user()?.username || userName(me()));
    view.comments.unshift({ id, ticket_id: view.row.id, description: text, created_by_id: me(), created_at: new Date().toISOString() });
    el("commentInput").value = "";
    fitCommentInput();
    drawComments();
    el("commentList").scrollTop = 0;
  } catch (failure) { toast(failText(failure), true) }
  finally { el("commentSend").disabled = false }
};
// the author through /my (their own rows), anyone's with the permission
const commentRoute = (c, permission, verb) => holds(permission) ? `/permission/object-${verb}` : String(c.created_by_id) === String(me()) ? `/my/object-${verb}` : "";
const commentAction = async (act, node) => {
  const c = view.comments.find(item => item.id === Number(node.dataset.id));
  if (!c) return;
  if (act === "copy") return navigator.clipboard.writeText(c.description).then(() => toast("Copied"), () => toast("Couldn't copy", true));
  if (act === "edit") {
    if (!commentRoute(c, PERMISSION.commentUpdate, "update")) return toast("Only the comment's author can edit it (or a user granted permission 125)", true);
    node.querySelector(".md").outerHTML = `<form class="comment-edit"><textarea maxlength="5000" aria-label="Edit comment">${esc(c.description)}</textarea><div><button type="button" data-act="cancel">Cancel</button><button type="submit" class="primary">Save</button></div></form>`;
    const area = node.querySelector("textarea");
    area.focus();
    area.setSelectionRange(area.value.length, area.value.length);
    return;
  }
  if (act === "cancel") return drawComments();
  if (act === "delete") {
    const route = commentRoute(c, PERMISSION.commentDelete, "delete");
    if (!route) return toast("Only the comment's author can delete it (or a user granted permission 126)", true);
    if (!await Page.confirm("Delete comment?", "This can't be undone.", "Delete", true)) return;
    try {
      await api(route === "/my/object-delete" ? route : `${route}?table=ticket_comment`, { method: "POST", body: JSON.stringify(route === "/my/object-delete" ? { table: "ticket_comment", ids: [c.id] } : { ids: [c.id] }) });
      view.comments = view.comments.filter(item => item.id !== c.id);
      drawComments();
      toast("Comment deleted");
    } catch (failure) { toast(failText(failure), true) }
  }
};
const commentSave = async form => {
  const node = form.closest(".comment"), c = view.comments.find(item => item.id === Number(node.dataset.id)), text = form.querySelector("textarea").value.trim();
  if (!c || !text) return;
  if (text === c.description) return drawComments();
  const route = commentRoute(c, PERMISSION.commentUpdate, "update");
  try {
    await api(`${route}?table=ticket_comment`, { method: "PUT", body: JSON.stringify({ id: c.id, description: text }) });
    Object.assign(c, { description: text, updated_at: new Date().toISOString() });
    drawComments();
    toast("Saved");
  } catch (failure) { toast(failText(failure), true) }
};
const fitCommentInput = () => { const area = el("commentInput"); area.style.height = "auto"; area.style.height = `${Math.min(160, area.scrollHeight + 2)}px` };

/* ==== add a ticket for a customer (a call or an email): /public/object-create without the agent's token, so it is the customer's ticket (no created_by_id), like the public form ==== */
const options = (column, value) => Object.entries(labels(column)).map(([key, text]) => `<option value="${esc(key)}"${String(value) === key ? " selected" : ""}>${esc(text)}</option>`).join("");
// one form, Pulse's Add task layout (a card for the title and description, a card for the rest): Add ticket (empty), Duplicate (an Add filled from a ticket), Edit ticket (status too; only what changed is sent)
const ticketForm = ({ row = null, edit = false } = {}) => {
  const v = row || { type: 1, priority: 2 }, text = value => esc(value ?? "");
  Page.form({ title: edit ? "Edit ticket" : "Add ticket", sub: edit ? `ID: ${v.id}` : "Saved as the customer's public ticket, not as yours", ok: edit ? "Save changes" : "Create ticket",
    body: `<div class="add-card"><div class="field"><label class="label-row" for="addTitle"><span>Title <span class="req">*</span></span><small class="field-help" id="addTitleCount">0 / 200</small></label><input id="addTitle" maxlength="200" required value="${text(v.title)}"></div><div class="field"><label class="label-row" for="addDescription"><span>Description</span><small class="field-help" id="addDescriptionCount">0 / 10,000</small></label><textarea id="addDescription" maxlength="10000">${text(v.description)}</textarea></div></div>
<div class="add-card form-grid"><div class="field"><label for="addType">Type</label><select id="addType">${options("type", v.type)}</select></div><div class="field"><label for="addPriority">Priority</label><select id="addPriority">${options("priority", v.priority)}</select></div>${edit ? `<div class="field wide"><label for="addStatus">Status</label><select id="addStatus">${options("status", v.status)}</select></div>` : ""}<div class="field wide"><label for="addName">Customer name</label><input id="addName" maxlength="120" autocomplete="off" value="${text(v.name)}"></div><div class="field"><label for="addEmail">Email <span class="req">*</span></label><input id="addEmail" type="email" maxlength="254" autocomplete="off" value="${text(v.email)}"></div><div class="field"><label for="addMobile">Mobile <span class="req">*</span></label><input id="addMobile" type="tel" maxlength="20" autocomplete="off" value="${text(v.mobile)}"></div><p class="field-help wide">* Title, and an email or mobile so the team can reply.</p></div>`,
    submit: async () => {
      const value = id => el(id).value.trim() || null;
      const body = { title: value("addTitle"), description: value("addDescription"), type: Number(el("addType").value), priority: Number(el("addPriority").value), ...(edit ? { status: Number(el("addStatus").value) } : {}), name: value("addName"), email: value("addEmail"), mobile: value("addMobile") };
      if (!body.title) { el("addTitle").focus(); throw new Error("Enter a title") }
      if (!body.email && !body.mobile) { el("addEmail").focus(); throw new Error("Enter the customer's email or mobile, so the team can reply") }
      if (body.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) { el("addEmail").focus(); throw new Error("Email must look like name@example.com") }
      if (body.mobile && !/^\+?[\d\s()-]{6,20}$/.test(body.mobile)) { el("addMobile").focus(); throw new Error("Mobile may hold only digits, spaces, + ( ) -") }
      if (edit) {
        const changes = Object.fromEntries(Object.entries(body).filter(([key, value]) => value !== (v[key] ?? null)));
        if (!Object.keys(changes).length) return;
        const fresh = await ticketUpdate(v, changes);
        if (view.row?.id === v.id) { view.row = fresh; drawView() }
        rowChanged(fresh, v);
        return toast("Ticket updated");
      }
      // plain fetch, not Page.api: Page.api sends the agent's token, which would stamp the agent as created_by_id
      const response = await fetch("/public/object-create?table=ticket", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const answer = await response.json().catch(() => ({}));
      if (!response.ok || answer.status !== 1) throw new Error(response.status === 429 ? "Too many new tickets in a minute. Wait a moment and try again." : typeof answer.message === "string" ? answer.message : `HTTP ${response.status}`);
      const [id] = answer.message;
      toast(`Ticket #${id} created`);
      reload();
      viewOpen(id);
    } });
  el("atomDialog").classList.add("wide");
  for (const [id, max] of [["addTitle", 200], ["addDescription", 10000]]) { const count = () => { const n = el(id).value.length; el(`${id}Count`).textContent = `${n.toLocaleString()} / ${max.toLocaleString()}`; el(`${id}Count`).classList.toggle("limit", n >= max) }; el(id).addEventListener("input", count); count() }
};
const addOpen = () => ticketForm();
const viewEdit = () => holds(PERMISSION.update) ? ticketForm({ row: view.row, edit: true }) : toast(NOT_ALLOWED, true);
const viewDuplicate = () => { const row = view.row; viewDialogClose(); ticketForm({ row: { title: row.title, description: row.description, type: row.type, priority: row.priority, name: row.name, email: row.email, mobile: row.mobile } }) };
// a link that opens only this ticket (?ticket_id=), like Pulse's ?task_id=; closing the ticket takes it off the address
const ticketLink = id => { const url = new URL(location.pathname, location.origin); url.searchParams.set("ticket_id", String(id)); return url.href };
const viewShare = () => navigator.clipboard.writeText(ticketLink(view.row.id)).then(() => toast("Ticket link copied"), () => toast("Couldn't copy the link", true));
const sharedTicketId = () => { const id = new URL(location.href).searchParams.get("ticket_id"); return /^\d+$/.test(id || "") ? Number(id) : null };
const viewDialogClose = () => { el("viewDialog").close(); sharedTicketClear() };
const sharedTicketClear = () => { const url = new URL(location.href); if (url.searchParams.has("ticket_id")) { url.searchParams.delete("ticket_id"); history.replaceState(null, "", url) } };

/* ==== export: the filtered list or every ticket, up to /info export_limit rows, as CSV ==== */
const exportOpen = () => {
  const max = read().info?.export_limit || 100000;
  Page.form({ title: "Export", sub: `CSV · one row per ticket · up to ${max.toLocaleString()} rows`, ok: "Download CSV",
    body: `<label class="check"><input type="checkbox" id="exportFiltered"${filterInUse() ? " checked" : ""}> Use the filters applied on the main page</label><div class="field"><label for="exportRows">Rows</label><input id="exportRows" type="number" min="1" max="${max}" value="${Math.min(5000, max)}"></div><p class="export-note">Newest first.</p>`,
    submit: async () => {
      const rows = Math.min(max, Math.max(1, Number(el("exportRows").value) || 1));
      const query = new URLSearchParams({ table: "ticket", order: "id desc", limit: String(rows), filter: JSON.stringify(el("exportFiltered").checked ? filterList() : []) });
      const response = await request(`/permission/object-read-export?${query}`);
      if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(response.status === 403 ? NOT_ALLOWED : body.message || `HTTP ${response.status}`) }
      const url = URL.createObjectURL(await response.blob()), link = Object.assign(document.createElement("a"), { href: url, download: "ticket.csv" });
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("CSV downloaded");
    } });
};

/* ==== open: ticket read (120) is the way in; without it the user is logged out with a plain sentence ==== */
const allowed = () => { if (holds(PERMISSION.read)) return true; Page.logOut("Tickets access is unavailable."); return false };
let wired = false;
const pageOpen = () => {
  if (!allowed()) return;
  el("appView").hidden = false;
  if (!wired) {
    wired = true;
    boardEvents();
    el("searchForm").addEventListener("submit", e => { e.preventDefault(); reload() });
    el("searchText").addEventListener("input", drawFilterState);
    el("searchField").addEventListener("change", () => { drawFilterState(); if (el("searchText").value.trim()) reload() });
    el("searchClear").addEventListener("click", () => { el("searchText").value = ""; reload(); el("searchText").focus() });
    for (const id of ["statusFilter", "priorityFilter", "typeFilter", "sourceFilter", "createdFilter"]) el(id).addEventListener("change", reload);
    el("clearBtn").addEventListener("click", () => { for (const id of ["statusFilter", "priorityFilter", "typeFilter", "sourceFilter", "createdFilter", "searchText"]) el(id).value = ""; el("searchField").value = "title"; reload() });
    el("refreshBtn").addEventListener("click", reload);
    el("kanbanBtn").addEventListener("click", () => layoutSet("kanban"));
    el("tableBtn").addEventListener("click", () => layoutSet("table"));
    el("prevBtn").addEventListener("click", () => { if (state.table.page > 0) tableLoad(state.table.page - 1) });
    el("nextBtn").addEventListener("click", () => { if (state.table.afters[state.table.page + 1]) tableLoad(state.table.page + 1) });
    el("addBtn").addEventListener("click", addOpen);
    el("exportBtn").addEventListener("click", exportOpen);
    el("homeLink").addEventListener("click", e => { if (e.metaKey || e.ctrlKey) return; e.preventDefault(); el("clearBtn").click() });
    el("viewClose").addEventListener("click", viewDialogClose);
    el("viewReload").addEventListener("click", () => viewOpen(view.row.id));
    el("viewDelete").addEventListener("click", viewDelete);
    el("viewEdit").addEventListener("click", viewEdit);
    el("viewShare").addEventListener("click", viewShare);
    el("viewDuplicate").addEventListener("click", viewDuplicate);
    el("viewDialog").addEventListener("close", sharedTicketClear);
    el("viewCopy").addEventListener("click", () => navigator.clipboard.writeText(String(view.row.id)).then(() => toast("Ticket ID copied"), () => toast("Couldn't copy the ticket ID", true)));
    el("facts").addEventListener("change", e => { if (e.target.matches("select[data-column]")) viewChoice(e.target) });
    el("commentForm").addEventListener("submit", e => { e.preventDefault(); commentAdd() });
    el("commentInput").addEventListener("input", fitCommentInput);
    el("commentInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); commentAdd() } });
    el("commentList").addEventListener("click", e => { if (e.target.closest("#commentsOlder")) return commentsOlder(); const button = e.target.closest("[data-act]"), node = e.target.closest(".comment[data-id]"); if (button && node) commentAction(button.dataset.act, node) });
    el("commentList").addEventListener("submit", e => { e.preventDefault(); commentSave(e.target) });
    el("atomDialog").addEventListener("close", () => el("atomDialog").classList.remove("wide"));
  }
  drawFilters();
  reload();
  if (sharedTicketId() && !el("viewDialog").open) viewOpen(sharedTicketId());
};
PAGE.onSynced = () => { if (Page.loggedIn() && wired && allowed()) { drawFilters(); reload() } };    // labels arrive with /info, so the open view is drawn again; a permission taken away closes the page at the next Sync
Page.start();
</script>
</body>
</html>
