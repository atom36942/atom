<script>
// Identical in every Atom page (docs/frontend.md, Page standard): the look before the page draws, so it never flashes another one.
// Saved in the page's own localStorage key (<html data-storage-key>, the key it keeps its login in) under "settings": theme = "dark", "light" or "system"
// (the computer's mode, followed as it changes); density = "comfortable" (the default) or "compact". So each page keeps its own; logout removes the whole key (back on the defaults).
// Chosen in Settings (account menu), followed by every tab of the page; the result is <html data-theme data-density>. window.atomSettings: get, set, apply.
(() => {
  const root = document.documentElement, key = root.dataset.storageKey, media = matchMedia("(prefers-color-scheme: dark)");
  const stored = () => { try { const data = JSON.parse(localStorage.getItem(key) || "{}"); return data && typeof data === "object" && !Array.isArray(data) ? data : {} } catch { return {} } };
  // the default when nothing is saved: <html data-default-theme="light"> (an app page) or the first option (dark, Atom's pages); the same for density
  const get = (name, options) => { const value = stored().settings?.[name], fallback = root.dataset["default" + name[0].toUpperCase() + name.slice(1)]; return options.includes(value) ? value : options.includes(fallback) ? fallback : options[0] };
  const apply = () => {
    const theme = get("theme", ["dark", "light", "system"]);
    root.dataset.theme = theme === "system" ? (media.matches ? "dark" : "light") : theme;
    root.dataset.density = get("density", ["comfortable", "compact"]);
  };
  const set = (name, value) => { const data = stored(); try { localStorage.setItem(key, JSON.stringify({ ...data, settings: { ...data.settings, [name]: value } })) } catch {} apply() };
  apply();
  media.addEventListener("change", apply);
  addEventListener("storage", e => { if (e.key === key || e.key === null) apply() });
  window.atomSettings = { get, set, apply };
})();
</script>

/* filters: one grey card holding the dropdowns and the search, Clear filters at its end; the list's own controls in a second card */
.filter-row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.filter-card{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.side-card{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.filter-card select{min-width:150px;background-color:var(--field)}
.filter-card select.in-use{background-color:var(--brand-fill);border-color:var(--brand-line)}
.search-box{display:flex;align-items:center;flex:1;min-width:260px;max-width:460px;height:var(--control-h);border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--field);overflow:hidden}
.search-box:focus-within{border-color:var(--brand-ink);box-shadow:var(--ring)}
.search-box select{height:100%;min-width:0;width:auto;border:0;border-right:1px solid var(--line);border-radius:0;background-color:var(--panel);font-weight:600}
.search-box input{flex:1;min-width:0;height:100%;border:0;border-radius:0;background:transparent;box-shadow:none}
.search-box input:focus{box-shadow:none}
.search-box button{width:32px;height:100%;padding:0;border:0;border-radius:0;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.search-box .search-submit{color:var(--brand-ink)}
.clear-btn{margin-left:auto}
.clear-btn:not(:disabled){background:var(--danger-soft);border-color:var(--danger-soft);color:var(--danger)}
/* the list: a white card, its header row in the brand tint, the pager under it */
.card{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-head h2{margin:0;font-size:15px;font-weight:700}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{padding:var(--cell-pad);text-align:left;background:var(--brand-tint);color:var(--text);font-size:12px;font-weight:600;white-space:nowrap}
td{padding:var(--cell-pad);border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel)}
tbody tr:last-child td{border-bottom:none}
.list.is-loading tbody{opacity:.5}
.col-id{width:70px}.col-created{width:110px}.col-type{width:110px}.col-from{width:22%}.col-status{width:120px}
.empty td{padding:24px 16px;color:var(--muted);cursor:default;text-align:center}
.empty:hover{background:none}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--neutral-soft);color:var(--muted)}
.pill.s2{background:var(--info-soft);color:var(--info)}.pill.s3{background:var(--danger-soft);color:var(--danger)}.pill.s4{background:var(--warn-soft);color:var(--warn)}.pill.s5{background:var(--success-soft);color:var(--success)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.pager-btn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.pager-label{font-size:12px;font-weight:600;color:var(--muted)}
.page-error{margin:0}
/* the ticket dialog: wider, the facts in rows, then status and reply */
dialog.dlg.wide{width:min(640px,calc(100vw - 32px))}
.kv td.pre{white-space:pre-wrap}
dialog.dlg textarea{width:100%;min-height:110px;font-family:var(--font);font-size:var(--fs);background:var(--field);border:1px solid var(--line);border-radius:var(--radius)}
.dlg-actions .push{margin-right:auto}
.export-note{margin:0;color:var(--muted);font-size:12px}
.check{display:flex;align-items:center;gap:8px}
dialog.dlg .check input{width:16px;height:16px}
@media (max-width:1000px){.hbtn span{display:none}}
@media (max-width:700px){.side-card{margin-left:auto}.topbar,main{padding-left:16px;padding-right:16px}.col-created,.col-type,.col-from{display:none}.search-box{max-width:none}}
</style>
</head>

<script>
/* ==== page settings and the account block ==== */
// Tickets: the support team's list of the tickets users send (table ticket, created by /my/object-create or /public/object-create).
// Any role may log in; the page reads and changes tickets only through /permission/object-*, so it works for whoever holds ticket read (120), update (121) and delete (122): root holds them all
const PAGE = { key: "ticket", title: "Tickets", role: null, loginRequired: true, idb: false, intro: { heading: "Answer what your users report", text: "Support requests, feedback and bugs sent from your apps, in one list for the support team.", features: [['<path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>', "Every ticket", "Sent by users, logged in or not."], ['<path d="M4 6h16M7 12h10M10 18h4"/>', "Filters", "By type, status, title or email."], ['<path d="M20 6 9 17l-5-5"/>', "Status", "To Do to Done, with a reply."], ['<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>', "Export", "The list as CSV, filtered or all."]] }, onIn: () => pageOpen(), onOut: () => { el("appView").hidden = true } };
/* ==== atom page: account ==== */
// Identical in every Atom page that logs in (docs/frontend.md, Page standard); the page sets PAGE just above this block and calls Page.start() last. A test checks the copies match.
// localStorage[PAGE.key] = {v, token, user, info, synced_at, ...the page's choices}; IndexedDB database PAGE.key, store "cache", records {name, user_id, saved_at, data} (pages with PAGE.idb).
// Logged in means a valid token object; the user comes from GET /my/profile and is checked on every sync; Sync runs every 3 hours and from the account menu; logout clears everything in every tab.
// Without a login: a page that needs one shows the login page (PAGE.intro: {heading, text, features: [[svg paths, title, line], ...]}); a page with PAGE.login opens its own login instead (API: the runner).
const Page = (() => {
  const STORAGE_KEY = PAGE.key, STORAGE_VERSION = 1, IDB_STORE = "cache", IDB_VERSION = 2, SYNC_EVERY_MS = 3 * 3600 * 1000;
  const EXPIRED = "Your session has expired. Please log in again.";
  const el = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const dash = v => v == null || v === "" ? "-" : esc(v);
  const nowSec = () => Math.floor(Date.now() / 1000);
  const ICON = {
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>',
    copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    eye: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  };

  /* -- storage -- */
  const read = () => { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); return s && s.v === STORAGE_VERSION ? s : {} } catch { return {} } };
  const save = changes => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...read(), settings: JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}")?.settings, ...changes, v: STORAGE_VERSION })) } catch {} };    // settings (the theme block's) are kept, even when chosen before login
  // the whole token object, valid, or logged out
  const loginValid = token => !!token && typeof token.access_token === "string" && token.access_token !== "" && typeof token.refresh_token === "string" && token.refresh_token !== "" && Number.isFinite(token.access_token_expires_at) && Number.isFinite(token.refresh_token_expires_at) && token.refresh_token_expires_at > nowSec();
  // a deleted or deactivated account: Atom answers 403 "account deleted" / "account deactivated" at login, at token refresh and on every token route; the page logs out and says so
  const ACCOUNT_REFUSED = { "account deleted": "Your account was deleted. Please contact your admin.", "account deactivated": "Your account is deactivated. Please contact your admin." };
  const BLOCKED_TITLE = { [ACCOUNT_REFUSED["account deleted"]]: "Account deleted", [ACCOUNT_REFUSED["account deactivated"]]: "Account deactivated" };
  let accountRefused = "";    // set by a refused request: every logout until the next login shows it, never "session expired"
  const userBlock = user => !user ? "Your account could not be loaded." : user.deleted_at ? ACCOUNT_REFUSED["account deleted"] : user.deactivated_at ? ACCOUNT_REFUSED["account deactivated"] : PAGE.role != null && Number(user.role) !== PAGE.role ? `${PAGE.title} access is unavailable.` : "";

  /* -- IndexedDB cache: big or slow reference data; a record saved for another user is ignored -- */
  const idbOpen = () => new Promise((resolve, reject) => {
    const q = indexedDB.open(STORAGE_KEY, IDB_VERSION);
    q.onupgradeneeded = () => { const db = q.result; if (db.objectStoreNames.contains(IDB_STORE)) db.deleteObjectStore(IDB_STORE); db.createObjectStore(IDB_STORE, { keyPath: "name" }) };
    q.onsuccess = () => resolve(q.result);
    q.onerror = () => reject(q.error);
  });
  const idbRun = async (mode, work) => { const db = await idbOpen(); try { return await new Promise((resolve, reject) => { const q = work(db.transaction(IDB_STORE, mode).objectStore(IDB_STORE)); q.onsuccess = () => resolve(q.result); q.onerror = () => reject(q.error) }) } finally { db.close() } };
  const cacheGet = async name => { if (!PAGE.idb) return null; try { const r = await idbRun("readonly", s => s.get(name)); return r && r.user_id === (read().user?.id ?? null) ? r : null } catch { return null } };
  const cacheSet = async (name, data) => { if (!PAGE.idb || (PAGE.loginRequired && !loginValid(read().token))) return; try { await idbRun("readwrite", s => s.put({ name, user_id: read().user?.id ?? null, saved_at: Date.now(), data })) } catch {} };
  const cacheCount = async () => { if (!PAGE.idb) return 0; try { return await idbRun("readonly", s => s.count()) } catch { return 0 } };
  const cacheClear = () => new Promise(resolve => { if (!PAGE.idb) return resolve(); const q = indexedDB.deleteDatabase(STORAGE_KEY); q.onsuccess = q.onerror = q.onblocked = () => resolve() });

  /* -- toast and the one dialog every part of the page uses -- */
  let toastTimer = null;
  const toastClose = () => { clearTimeout(toastTimer); if (el("toast").matches(":popover-open")) el("toast").hidePopover() };
  const toastWait = () => { clearTimeout(toastTimer); toastTimer = setTimeout(toastClose, 6000) };
  // shown again each time, so it is the newest thing in the top layer (above a dialog opened since)
  const toast = (text, isError = false) => { const t = el("toast"); t.querySelector(".toast-text").textContent = text; t.querySelector(".toast-icon").textContent = isError ? "!" : "✓"; t.classList.toggle("error", !!isError); if (t.matches(":popover-open")) t.hidePopover(); t.showPopover(); toastWait() };
  el("toast").querySelector(".toast-close").addEventListener("click", toastClose);
  el("toast").addEventListener("mouseenter", () => clearTimeout(toastTimer));
  el("toast").addEventListener("mouseleave", () => { if (el("toast").matches(":popover-open")) toastWait() });
  let dialogOn = {}, dialogLocked = false, formResolve = null;
  // dialog({title, sub, body, actions, on: {buttonId: handler}}): a title, an optional subtitle, a body and actions only when there is something to do
  const dialog = ({ title, sub = "", body = "", actions = "", on = {} }) => {
    formResolve?.(false);    // a form still waiting is answered "no" when the dialog shows something else
    formResolve = null;
    el("atomTitle").textContent = title;
    el("atomSub").textContent = sub;
    el("atomSub").hidden = !sub;
    el("atomBody").innerHTML = body + '<div class="error-box" id="atomError" hidden></div>';
    el("atomActions").innerHTML = actions;
    el("atomActions").hidden = !actions;
    dialogOn = on;
    if (!el("atomDialog").open) el("atomDialog").showModal();
  };
  const dialogClose = () => { if (el("atomDialog").open) el("atomDialog").close() };
  const dialogError = text => { const e = el("atomError"); if (e) { e.textContent = text || ""; e.hidden = !text } };
  const dialogLock = on => { dialogLocked = on; for (const b of el("atomDialog").querySelectorAll("button")) b.disabled = on };
  // form({title, sub, body, ok, tone, submit}): Cancel, then the main action; submit() runs on the action or Enter and its error stays in the dialog;
  // resolves true when done, false on Cancel or close. confirm(title, text, ok, danger) is a form without fields
  const form = ({ title, sub = "", body = "", ok = "OK", tone = "primary", submit = null }) => new Promise(resolve => {
    const done = value => { formResolve = null; dialogClose(); resolve(value) };
    const run = async () => {
      if (!submit) return done(true);
      dialogError("");
      dialogLock(true);
      try { await submit(); dialogLock(false); done(true) }
      catch (failure) { dialogLock(false); dialogError(failure.message) }
    };
    dialog({ title, sub, body: `<form class="dlg-form" id="atomForm" novalidate>${body}</form>`, actions: `<button type="button" id="atomCancel">Cancel</button><button type="submit" form="atomForm" class="${tone}" id="atomOk">${esc(ok)}</button>`, on: { atomCancel: () => done(false) } });
    formResolve = resolve;
    el("atomForm").addEventListener("submit", e => { e.preventDefault(); run() });
    (el("atomForm").querySelector("input:not([disabled]),select,textarea") || el("atomOk")).focus();
  });
  const confirm = (title, text, ok = "OK", danger = false) => form({ title, body: `<p class="confirm-text">${esc(text)}</p>`, ok, tone: danger ? "danger" : "primary" });
  const kv = rows => `<table class="kv"><tbody>${rows.map(([label, html]) => `<tr><th scope="row">${esc(label)}</th><td>${html}</td></tr>`).join("")}</tbody></table>`;
  const eyeToggle = (input, button) => {
    const draw = () => { const shown = input.type === "text"; button.innerHTML = shown ? ICON.eyeOff : ICON.eye; button.ariaLabel = shown ? "Hide password" : "Show password" };
    button.addEventListener("click", () => { input.type = input.type === "password" ? "text" : "password"; draw(); input.focus() });
    draw();
  };

  /* -- requests: the token as Bearer; a 401 renews the token once and retries -- */
  let refreshing = null;

  // Theme: Dark (the default), Light, or System (the computer's mode); Density: Comfortable (the default) or Compact. The theme block applies them.
  const SETTINGS = [

    document.addEventListener("keydown", e => { if (e.key === "Escape" && loginShown() && !PAGE.loginRequired && !document.querySelector("dialog[open]")) loginHide() });    // only the card (API) closes; a page that needs a login keeps it

    el("atomClose").addEventListener("click", dialogClose);

    });
    // logout in another tab removes the key: this tab finds no valid token and logs out too
    window.addEventListener("storage", e => { if (e.key === STORAGE_KEY && loggedIn() && !loginValid(read().token)) showOut("You logged out in another tab.") });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) sessionCheck() });
    setInterval(sessionCheck, 60000);
    const token = read().token;
    if (loginValid(token)) { showIn(); sessionCheck() }
    else { if (token) forgetAll(); showOut(token ? EXPIRED : "") }
  };

  return { start, esc, dash, toast, dialog, dialogClose, dialogError, dialogLock, form, confirm, kv, eyeToggle, api, request, read, save, user: () => read().user || null, loggedIn, signIn, logOut, loginOpen, loginValid, tokenRefresh, tokenFresh, syncData, cacheGet, cacheSet, syncOpen, initials, agoText, EXPIRED };
})();
/* ==== end atom page: account ==== */

/* ==== the ticket list ==== */
const el = id => document.getElementById(id);
const { esc, dash, toast, dialog, dialogClose, dialogError, kv, api, request, read } = Page;
const PAGE_SIZE = 25;
const ICON_SEARCH = { title: "Title", email: "Email", id: "ID" };
// labels from /info (config_column_int_mapping.ticket), saved by Sync; the number alone before the first sync
const labels = column => read().info?.config_column_int_mapping?.ticket?.[column] || {};
const label = (column, value) => value == null ? "-" : labels(column)[value] ?? String(value);
const state = { after: [null], page: 0, next: null, loading: false };
const filters = () => {
  const list = [], type = el("typeFilter").value, status = el("statusFilter").value, text = el("searchText").value.trim(), field = el("searchField").value;
  if (type) list.push(`type = ${type}`);
  if (status) list.push(`status = ${status}`);
  if (text) list.push(field === "id" ? `id = ${/^\d+$/.test(text) ? text : 0}` : { [field]: `ilike,%${text}%` });
  return list;
};
const filterInUse = () => !!(el("typeFilter").value || el("statusFilter").value || el("searchText").value.trim());
const drawFilters = () => {
  for (const [id, column, all] of [["typeFilter", "type", "All types"], ["statusFilter", "status", "All statuses"]]) {
    const select = el(id), value = select.value, options = Object.entries(labels(column));
    select.innerHTML = `<option value="">${all}</option>` + (options.length ? options : column === "type" ? [["1"], ["2"], ["3"]] : [["1"], ["2"], ["3"], ["4"], ["5"]]).map(([key, text]) => `<option value="${esc(key)}">${esc(text ?? key)}</option>`).join("");
    select.value = value;
  }
  drawFilterState();
};
const drawFilterState = () => {
  el("typeFilter").classList.toggle("in-use", !!el("typeFilter").value);
  el("statusFilter").classList.toggle("in-use", !!el("statusFilter").value);
  el("clearBtn").disabled = !filterInUse();
  const hasText = !!el("searchText").value;
  el("searchClear").hidden = el("searchGo").hidden = !hasText;
  el("searchText").placeholder = `Search ${ICON_SEARCH[el("searchField").value]}`;
};
const createdText = iso => { if (!iso) return "-"; const d = new Date(iso); return `<span title="${esc(d.toLocaleString())}">${esc(d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }).replace(/ /g, "-"))}</span>` };
const fromText = row => row.email ? esc(row.email) : row.created_by_id ? `User ${esc(row.created_by_id)}` : "-";
const statusPill = value => `<span class="pill s${esc(value)}">${esc(label("status", value))}</span>`;
let rowsById = new Map();
const drawRows = rows => {
  rowsById = new Map(rows.map(row => [row.id, row]));
  el("rows").innerHTML = rows.length ? rows.map(row => `<tr data-id="${esc(row.id)}" tabindex="0"><td>#${esc(row.id)}</td><td class="col-created">${createdText(row.created_at)}</td><td class="col-type">${esc(label("type", row.type))}</td><td title="${esc(row.title)}">${esc(row.title)}</td><td class="col-from">${fromText(row)}</td><td>${statusPill(row.status)}</td></tr>`).join("") : `<tr class="empty"><td colspan="6">${filterInUse() ? "No results" : "No tickets"}</td></tr>`;
};
const pageError = text => { el("pageError").textContent = text || ""; el("pageError").hidden = !text };
// one page after the cursor (newest first); any filter change starts again at page 1
const load = async (page = 0) => {
  state.loading = true;
  el("list").classList.add("is-loading");
  pageError("");
  try {
    const query = new URLSearchParams({ table: "ticket", limit: String(PAGE_SIZE), order: "id desc", filter: JSON.stringify(filters()) });
    if (state.after[page]) query.set("after", state.after[page]);
    const result = await api(`/permission/object-read?${query}`);
    state.page = page;
    state.after[page + 1] = result.after;
    state.after.length = page + 2;
    drawRows(result.obj_list || []);
  } catch (failure) {
    if (failure.status === 401) return;
    drawRows([]);
    pageError(failure.status === 403 ? "You are not allowed to see tickets. Ask an admin for the ticket read permission." : failure.message);
  } finally {
    state.loading = false;
    el("list").classList.remove("is-loading");
    el("pageLabel").textContent = `Page ${state.page + 1}`;
    el("prevBtn").disabled = state.page === 0;
    el("nextBtn").disabled = !state.after[state.page + 1];
  }
};
const reload = () => { state.after = [null]; drawFilterState(); load(0) };

/* ==== one ticket: its facts, then status and reply (update), or delete ==== */
const ticketOpen = row => {
  const statusOptions = Object.entries(labels("status")).length ? Object.entries(labels("status")) : [1, 2, 3, 4, 5].map(n => [String(n), String(n)]);
  dialog({ title: `Ticket #${row.id}`, sub: `${label("type", row.type)} · ${statusPillText(row.status)}`,
    body: kv([["Title", esc(row.title)], ["Description", `<span class="pre-text">${dash(row.description)}</span>`], ["From", fromText(row)], ["Created", createdText(row.created_at)], ["Updated", createdText(row.updated_at)]]) +
      `<div class="field"><label for="ticketStatus">Status</label><select id="ticketStatus">${statusOptions.map(([key, text]) => `<option value="${esc(key)}"${String(row.status) === key ? " selected" : ""}>${esc(text)}</option>`).join("")}</select></div>` +
      `<div class="field"><label for="ticketReply">Reply</label><textarea id="ticketReply" maxlength="5000" placeholder="What was done, or the answer for the user">${esc(row.reply ?? "")}</textarea></div>`,
    actions: '<button type="button" class="danger push" id="ticketDelete">Delete</button><button type="button" id="ticketCancel">Cancel</button><button type="button" class="primary" id="ticketSave">Save</button>',
    on: { ticketCancel: dialogClose, ticketSave: () => ticketSave(row), ticketDelete: () => ticketDelete(row) } });
  el("atomDialog").classList.add("wide");
  el("atomBody").querySelector(".kv tr:nth-child(2) td").classList.add("pre");
};
const statusPillText = value => label("status", value);
const ticketSave = async row => {
  const status = Number(el("ticketStatus").value), reply = el("ticketReply").value.trim() || null, changes = {};
  if (status !== row.status) changes.status = status;
  if (reply !== (row.reply ?? null)) changes.reply = reply;
  if (!Object.keys(changes).length) { dialogClose(); return toast("No changes") }
  el("ticketSave").disabled = true;
  try {
    await api("/permission/object-update?table=ticket", { method: "PUT", body: JSON.stringify({ id: row.id, ...changes }) });
    dialogClose();
    toast(`Ticket #${row.id} saved`);
    load(state.page);
  } catch (failure) { dialogError(failure.status === 403 ? "You are not allowed to do this. Ask an admin for access." : failure.message); if (el("ticketSave")) el("ticketSave").disabled = false }
};
const ticketDelete = async row => {
  if (!await Page.confirm(`Delete ticket #${row.id}?`, "This can't be undone.", "Delete", true)) return ticketOpen(row);
  try { await api("/permission/object-delete?table=ticket", { method: "POST", body: JSON.stringify({ ids: [row.id] }) }); toast(`Ticket #${row.id} deleted`); load(state.page) }
  catch (failure) { toast(failure.status === 403 ? "You are not allowed to do this. Ask an admin for access." : failure.message, true) }
};

/* ==== export: the filtered list or every ticket, up to /info export_limit rows, as CSV ==== */
const exportOpen = () => {
  const max = read().info?.export_limit || 100000;
  Page.form({ title: "Export", sub: `CSV · one row per ticket · up to ${max.toLocaleString()} rows`,
    body: `<label class="check"><input type="checkbox" id="exportFiltered"${filterInUse() ? " checked" : ""}> Use the filters applied on the main page</label><div class="field"><label for="exportRows">Rows</label><input id="exportRows" type="number" min="1" max="${max}" value="${Math.min(5000, max)}"></div><p class="export-note">Newest first.</p>`,
    ok: "Download CSV",
    submit: async () => {
      const rows = Math.min(max, Math.max(1, Number(el("exportRows").value) || 1));
      const query = new URLSearchParams({ table: "ticket", order: "id desc", limit: String(rows), filter: JSON.stringify(el("exportFiltered").checked ? filters() : []) });
      const response = await request(`/permission/object-read-export?${query}`);
      if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(response.status === 403 ? "You are not allowed to do this. Ask an admin for access." : body.message || `HTTP ${response.status}`) }
      const url = URL.createObjectURL(await response.blob()), link = Object.assign(document.createElement("a"), { href: url, download: "ticket.csv" });
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("CSV downloaded");
    } });
};

/* ==== wiring ==== */
let wired = false;
const pageOpen = () => {
  el("appView").hidden = false;
  if (!wired) {
    wired = true;
    el("searchForm").addEventListener("submit", e => { e.preventDefault(); reload() });
    el("searchText").addEventListener("input", drawFilterState);
    el("searchField").addEventListener("change", () => { drawFilterState(); if (el("searchText").value.trim()) reload() });
    el("searchClear").addEventListener("click", () => { el("searchText").value = ""; reload(); el("searchText").focus() });
    el("typeFilter").addEventListener("change", reload);
    el("statusFilter").addEventListener("change", reload);
    el("clearBtn").addEventListener("click", () => { el("typeFilter").value = el("statusFilter").value = el("searchText").value = ""; reload() });
    el("refreshBtn").addEventListener("click", () => load(state.page));
    el("prevBtn").addEventListener("click", () => { if (state.page > 0) load(state.page - 1) });
    el("nextBtn").addEventListener("click", () => { if (state.after[state.page + 1]) load(state.page + 1) });
    el("exportBtn").addEventListener("click", exportOpen);
    el("homeLink").addEventListener("click", e => { if (e.metaKey || e.ctrlKey) return; e.preventDefault(); el("typeFilter").value = el("statusFilter").value = el("searchText").value = ""; reload() });
    el("rows").addEventListener("click", e => { const row = rowsById.get(Number(e.target.closest("tr[data-id]")?.dataset.id)); if (row) ticketOpen(row) });
    el("rows").addEventListener("keydown", e => { if (e.key !== "Enter") return; const row = rowsById.get(Number(e.target.closest("tr[data-id]")?.dataset.id)); if (row) ticketOpen(row) });
    el("atomDialog").addEventListener("close", () => el("atomDialog").classList.remove("wide"));
  }
  drawFilters();
  reload();
};
PAGE.onSynced = () => { if (Page.loggedIn()) drawFilters() };    // labels arrive with /info
Page.start();
</script>
</body>
</html>
