<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>pgweb</title>
<style>
/* palette lifted from pgweb's own app.css: #79589f chrome, #7eb54e primary,
   #f9f9f9 sidebar, #ffe row hover, #3874d7 selection, #bbb nulls */
:root{
  color-scheme:light;
  --nav:#79589f; --nav-fg:#d6cce2; --nav-on-bg:#fff; --nav-on-fg:#000;
  --side:#f9f9f9; --bg:#fff; --fg:#3a3633; --dim:#aaa; --line:#ddd;
  --th-fg:#333; --th-line:#eae9e9; --th-hover:#fafafa; --th-active:#f3faff;
  --row-odd:#f9f9f9; --row-even:#fff; --row-line:#f2f2f2; --row-hover:#ffe;
  --sel:#3874d7; --sel-fg:#fff; --null:#bbb; --obj-hl:#f1f1f1;
  --green:#7eb54e; --green-h:#64903e; --err:#c0392b;
  --info-fg:#7f7e7f; --info-val:#4f4f4f;
  --row-h:34px; --bar-h:50px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --nav:#79589f; --nav-fg:#d6cce2; --nav-on-bg:#141419; --nav-on-fg:#f2f0ee;   /* == --bg, so the active tab merges into the pane */
  --side:#191920; --bg:#141419; --fg:#d9d5d1; --dim:#7a7a84; --line:#2e2e37;
  --th-fg:#cfcac5; --th-line:#2e2e37; --th-hover:#20202a; --th-active:#1e2a3a;
  --row-odd:#191920; --row-even:#141419; --row-line:#22222b; --row-hover:#2a2a1c;
  --sel:#3874d7; --sel-fg:#fff; --null:#66666f; --obj-hl:#24242e;
  --green:#8fc95f; --green-h:#a5d977; --err:#f2645a;
  --info-fg:#8a8a93; --info-val:#c6c2be;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --nav-on-bg:#141419; --nav-on-fg:#f2f0ee;   /* == --bg, so the active tab merges into the pane */
    --side:#191920; --bg:#141419; --fg:#d9d5d1; --dim:#7a7a84; --line:#2e2e37;
    --th-fg:#cfcac5; --th-line:#2e2e37; --th-hover:#20202a; --th-active:#1e2a3a;
    --row-odd:#191920; --row-even:#141419; --row-line:#22222b; --row-hover:#2a2a1c;
    --null:#66666f; --obj-hl:#24242e; --green:#8fc95f; --green-h:#a5d977; --err:#f2645a;
    --info-fg:#8a8a93; --info-val:#c6c2be;
  }
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);display:flex;
  font:13px/1.42857143 "Helvetica Neue",Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:4px 11px;cursor:pointer;color:var(--fg)}
button:hover{border-color:#444;color:var(--fg)}
button.primary{border-color:var(--green);color:var(--green);background:var(--bg)}
button.primary:hover{border-color:var(--green-h);color:var(--green-h)}
button:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--dim)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:4px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#999}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#c7c7c7;border-radius:6px;border:3px solid var(--bg)}
:root[data-theme=dark] ::-webkit-scrollbar-thumb{background:#3a3a45}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}

/* ---------- connect ---------- */
#connect{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#connect .bar{height:var(--bar-h);background:var(--nav);color:#fff;display:flex;align-items:center;
  padding:0 16px;font-size:15px;font-weight:bold;flex:none}
#connect .mid{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
#connect .box{width:min(580px,92vw)}
#connect h1{font-size:15px;margin:0 0 4px;font-weight:bold}
#connect p{color:#888;margin:0 0 18px;font-size:13px}
#connect .row{display:flex;gap:8px}
#connect input{flex:1}
#cerr{color:var(--err);margin-top:10px;min-height:17px;white-space:pre-wrap;font-size:12px}
#connect .hint{color:var(--dim);margin-top:16px;font-size:12px}

/* ---------- shell ---------- */
#app{display:none;flex:1;min-width:0}
body.ready #app{display:flex}
body.ready #connect{display:none}
#side{width:250px;flex:0 0 250px;background:var(--side);display:flex;flex-direction:column;min-height:0}
#dbline{height:var(--bar-h);flex:none;background:var(--nav);color:#fff;font-weight:bold;font-size:14px;
  display:flex;align-items:center;gap:6px;padding:0 8px}
#dbname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .search{padding:8px}
#side .search input{width:100%;font-size:12px}
#tree{flex:1;overflow:auto;padding-bottom:8px;font-size:12px}
.schema{padding:8px 10px 3px;color:#888;font-weight:bold;font-size:12px}
.kind{padding:5px 10px 2px 20px;color:var(--dim);font-size:11px;text-transform:uppercase}
/* pgweb: 30px rows, #f1f1f1 on hover, active is the same grey plus bold — not a colour fill */
.obj{display:flex;justify-content:space-between;gap:8px;height:30px;line-height:30px;
     padding:0 8px 0 24px;cursor:pointer;white-space:nowrap}
.obj:hover{background:var(--obj-hl)}
.obj.on{background:var(--obj-hl);color:var(--th-fg);font-weight:bold}
.obj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj .ct{color:var(--dim);font-size:11px;flex:none;font-weight:normal}

/* sidebar footer: pgweb's TABLE INFORMATION panel */
#tinfo{flex:none;border-top:1px solid #eee;font-size:12px}
:root[data-theme=dark] #tinfo{border-top-color:var(--line)}
#tinfo .title{text-transform:uppercase;color:var(--dim);line-height:30px;padding:0 10px}
#tinfo .line{line-height:22px;padding:0 10px;color:var(--info-fg);display:flex;justify-content:space-between;gap:8px}
#tinfo .line span{color:var(--info-val)}

#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{height:var(--bar-h);flex:none;display:flex;align-items:stretch;background:var(--nav);padding:0}
.tab{padding:0 14px;line-height:var(--bar-h);font-size:13px;font-weight:500;color:var(--nav-fg);
  cursor:pointer;margin:0 1px;flex:none;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{background:var(--nav-on-bg);color:var(--nav-on-fg);margin:0}
#tabs .sp{flex:1}
#tabs{overflow:hidden}
#tabs button{align-self:center;background:var(--nav);color:#fff;border-color:rgba(255,255,255,.55);
  margin-right:8px;font-size:12px;flex:none;white-space:nowrap}
#tabs button:hover:not(:disabled){background:#fff;color:var(--nav);border-color:#fff}
#tabs button:disabled{opacity:.45;color:#e2d8ee;border-color:rgba(255,255,255,.3)}

#tools{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--th-line);background:var(--bg)}
#tools select,#tools input{padding:3px 7px;font-size:12px}
#fval{width:180px}
#tools .sp{flex:1}
#ftxt{color:#888;font-size:12px}

#pane{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}

/* ---------- virtual grid ---------- */
/* contain must not include size here: #rows is absolutely positioned and shrink-to-fit,
   so size-contained rows would measure as empty and collapse to zero width */
#vp{flex:1;overflow:auto;position:relative;contain:layout paint;font-size:12px}
#inner{position:relative}
#head{position:sticky;top:0;z-index:3;display:flex;background:var(--bg);border-bottom:1px solid var(--th-line)}
.th{flex:none;padding:0 9px;height:31px;line-height:31px;font-weight:bold;color:var(--th-fg);
    position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;user-select:none;cursor:pointer}
.th:hover{background:var(--th-hover)}
.th .grip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize}
.th .grip:hover{background:var(--nav)}
#canvas{position:relative}
#rows{position:absolute;top:0;left:0;width:100%;will-change:transform}
.tr{display:flex;height:var(--row-h);contain:layout paint;border-bottom:1px solid var(--row-line);background:var(--row-even)}
.tr[hidden]{display:none}   /* author display:flex would otherwise beat the UA [hidden] rule */
.tr:nth-child(odd){background:var(--row-odd)}
.tr:hover{background:var(--row-hover)}
.tr.sel{background:var(--sel)}
.tr.sel .td{color:var(--sel-fg)}
.td{flex:none;padding:0 9px;height:33px;line-height:33px;color:var(--fg);
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.td.null{color:var(--null);text-transform:uppercase}
.tr.sel .td.null{color:#dfe7f7}
.td[contenteditable=true]{background:var(--bg);outline:2px solid var(--nav);outline-offset:-2px;
    text-overflow:clip;cursor:text;overflow:visible;z-index:4;position:relative;color:var(--fg)}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim)}
#empty.on{display:flex}

/* ---------- text panes ---------- */
.pre{flex:1;overflow:auto;margin:0;padding:14px 16px;white-space:pre;color:var(--fg);
     font:12px/1.6 Menlo,Monaco,Consolas,"Courier New",monospace}

/* ---------- query ---------- */
#sql{height:200px;flex:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
     padding:12px 14px;resize:vertical;background:var(--bg);tab-size:2;
     font:12px/1.6 Menlo,Monaco,Consolas,"Courier New",monospace}
#qbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--th-line);background:var(--bg)}
#qmsg{color:#888;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qmsg.err{color:var(--err)}

/* ---------- status ---------- */
#status{display:flex;align-items:center;gap:14px;padding:5px 11px;border-top:1px solid var(--th-line);
        background:var(--side);color:#888;font-size:12px}
#status .sp{flex:1}
#status b{color:var(--fg);font-weight:bold}
#status .t{color:var(--green)}

dialog{border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);padding:0;
       box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:min(580px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .hd{padding:12px 15px;border-bottom:1px solid var(--th-line);font-weight:bold;font-size:14px}
dialog .bd{padding:14px 15px;max-height:60vh;overflow:auto;font-size:12px}
dialog .ft{padding:10px 15px;border-top:1px solid var(--th-line);display:flex;gap:8px;justify-content:flex-end}
dialog .f{display:flex;gap:9px;align-items:center;margin-bottom:8px}
dialog .f label{width:140px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
dialog .f input{flex:1}
#cellbox{white-space:pre-wrap;word-break:break-word;margin:0;
         font:12px/1.6 Menlo,Monaco,Consolas,"Courier New",monospace}
</style>
</head>
<body>

<div id="connect">
  <div class="bar">pgweb</div>
  <div class="mid">
    <div class="box">
      <h1>Connect to a Postgres database</h1>
      <p>Paste a connection string to get started.</p>
      <div class="row">
        <input id="dsn" placeholder="postgres://user:password@localhost:5432/dbname" autocomplete="off" spellcheck="false"/>
        <button class="primary" id="cbtn">Connect</button>
      </div>
      <div id="cerr"></div>
      <div class="hint">Runs locally · the url stays on the server, never in the browser</div>
    </div>
  </div>
</div>

<div id="app">
  <aside id="side">
    <div id="dbline"><span id="dbname">—</span></div>
    <div class="search"><input id="q" placeholder="Filter database objects" autocomplete="off" spellcheck="false"/></div>
    <div id="tree"></div>
    <div id="tinfo"><div class="title">Table Information</div><div id="tinfo-lines"></div></div>
  </aside>

  <main id="main">
    <div id="tabs">
      <div class="tab on" data-v="rows">Rows</div>
      <div class="tab" data-v="struct">Structure</div>
      <div class="tab" data-v="idx">Indexes</div>
      <div class="tab" data-v="query">Query</div>
      <div class="sp"></div>
      <button id="addrow" title="insert row">+ Row</button>
      <button id="delrow" title="delete selected row" disabled>− Row</button>
      <button id="reload" title="reload">↻</button>
      <button id="theme" title="toggle theme">◐</button>
      <button id="disc" title="disconnect">Disconnect</button>
    </div>

    <div id="pane">
      <div class="view on" id="v-rows">
        <div id="tools">
          <select id="fcol"></select>
          <select id="fop">
            <option>=</option><option>≠</option><option>&gt;</option><option>&lt;</option>
            <option>≥</option><option>≤</option><option>LIKE</option><option>ILIKE</option>
            <option>IS NULL</option><option>IS NOT NULL</option>
          </select>
          <input id="fval" placeholder="value" autocomplete="off"/>
          <button id="fgo">apply</button>
          <button id="fclr">clear</button>
          <span class="sp"></span>
          <span id="ftxt" style="color:var(--dim)"></span>
        </div>
        <div id="vp"><div id="inner">
          <div id="head"></div>
          <div id="canvas"><div id="rows"></div></div>
        </div></div>
        <div id="empty">no rows</div>
      </div>
      <div class="view" id="v-struct"><pre class="pre" id="p-struct"></pre></div>
      <div class="view" id="v-idx"><pre class="pre" id="p-idx"></pre></div>
      <div class="view" id="v-query">
        <textarea id="sql" spellcheck="false" placeholder="select * from …"></textarea>
        <div id="qbar"><button class="primary" id="run">run ⌘⏎</button><span id="qmsg"></span></div>
      </div>
    </div>

    <div id="status">
      <span id="st-obj">—</span><span id="st-rows"></span><span id="st-size"></span>
      <span class="sp"></span><span id="st-time" class="t"></span>
    </div>
  </main>
</div>

<dialog id="dlg"><form method="dialog">
  <div class="hd" id="dlg-t"></div><div class="bd" id="dlg-b"></div>
  <div class="ft" id="dlg-f"></div>
</form></dialog>

<script>
'use strict';
const ROW_H = 34, CHUNK = 1000, OVER = 6, MAXW = 460, MINW = 64;   /* 33px cell + 1px rule, as pgweb */
// browsers clamp element height near 2^24 px; past that the spacer stops growing and the
// tail of a big table becomes unreachable, so the scrollbar is scaled instead of 1:1
const MAXH = 16000000;
const $ = s => document.getElementById(s);
const vp=$('vp'), inner=$('inner'), headEl=$('head'), canvas=$('canvas'), rowsEl=$('rows');

const S = { db:'', schema:'', table:'', kind:'', pk:null, cols:[], widths:[], total:0,
            chunks:new Map(), pending:new Map(), local:null, where:'', sel:-1, meta:null, tree:{},
            viewPx:0, scale:1 };
let pool=[], lastFirst=-1, ticking=false, ac=null;

/* ---------------- api ---------------- */
async function api(body){
  const t0 = performance.now();
  const r = await fetch('/pgweb', {method:'POST', headers:{'Content-Type':'application/json'},
                                   body:JSON.stringify(body)});
  let j; try{ j = await r.json(); }catch{ throw new Error('bad response from server'); }
  const ms = performance.now() - t0;
  if(!r.ok || j.status !== 1){
    const msg = String(j?.message ?? j?.detail ?? r.statusText ?? 'request failed');
    if(msg.includes('not_connected')){ disconnected(); throw new Error('not_connected'); }
    throw new Error(msg);
  }
  $('st-time').textContent = ms.toFixed(1)+' ms';
  return j.message;
}
const num = n => n>=1e9?(n/1e9).toFixed(1)+'B' : n>=1e6?(n/1e6).toFixed(1)+'M'
               : n>=1e3?(n/1e3).toFixed(1)+'k' : String(n);

/* ---------------- theme ---------------- */
(function theme(){
  const saved = localStorage.getItem('pgweb.theme');
  if(saved) document.documentElement.dataset.theme = saved;
  $('theme').onclick = () => {
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('pgweb.theme', next);
  };
})();

/* ---------------- connect ---------------- */
async function connect(){
  const dsn = $('dsn').value.trim();
  if(!dsn) return;
  $('cbtn').disabled = true; $('cerr').textContent = '';
  try{
    const m = await api({action:'connect', dsn});
    S.db = m.database; S.tree = m.tree;
    $('dbname').textContent = m.database;
    $('dbname').title = m.version || '';
    document.body.classList.add('ready');
    localStorage.setItem('pgweb.dsn', dsn);
    drawTree();
    const last = JSON.parse(localStorage.getItem('pgweb.last')||'null');
    const exists = last && (S.tree[last.schema]||{})[last.kind]?.some(o=>o.name===last.table);
    if(exists) openObject(last.schema, last.table, last.kind);
  }catch(e){ $('cerr').textContent = e.message; }
  finally{ $('cbtn').disabled = false; }
}
function disconnected(){
  document.body.classList.remove('ready');
  S.chunks.clear(); S.local=null; S.table=''; lastFirst=-1;
}
$('cbtn').onclick = connect;
$('dsn').onkeydown = e => { if(e.key==='Enter') connect(); };
$('dsn').value = localStorage.getItem('pgweb.dsn') || '';
$('disc').onclick = async () => { try{ await api({action:'disconnect'}); }catch{} disconnected(); };

/* ---------------- sidebar ---------------- */
function drawTree(){
  const box = $('tree'); box.textContent = '';
  const frag = document.createDocumentFragment();
  for(const [schema, kinds] of Object.entries(S.tree)){
    const h = document.createElement('div'); h.className='schema'; h.textContent=schema; frag.appendChild(h);
    for(const kind of ['table','view','matview']){
      const list = kinds[kind]; if(!list?.length) continue;
      const k = document.createElement('div'); k.className='kind';
      k.textContent = kind==='matview' ? 'materialized views' : kind+'s'; frag.appendChild(k);
      for(const o of list){
        const d = document.createElement('div'); d.className='obj';
        d.dataset.schema=schema; d.dataset.table=o.name; d.dataset.kind=kind;
        const nm=document.createElement('span'); nm.className='nm'; nm.textContent=o.name;
        const ct=document.createElement('span'); ct.className='ct';
        ct.textContent = kind==='table' ? num(o.est_rows) : kind==='view' ? 'view' : 'mat';
        d.append(nm,ct); d.onclick=()=>openObject(schema,o.name,kind); frag.appendChild(d);
      }
    }
  }
  box.appendChild(frag);
}
$('q').oninput = e => {
  const term = e.target.value.toLowerCase();
  for(const o of document.querySelectorAll('.obj')) o.hidden = !o.dataset.table.toLowerCase().includes(term);
};

/* ---------------- open object ---------------- */
async function openObject(schema, table, kind){
  ac?.abort(); ac = null;
  for(const el of document.querySelectorAll('.obj.on')) el.classList.remove('on');
  document.querySelector(`.obj[data-schema="${schema}"][data-table="${table}"]`)?.classList.add('on');
  S.schema=schema; S.table=table; S.kind=kind; S.where=''; S.sel=-1; S.local=null;
  S.chunks.clear(); S.pending.clear(); lastFirst=-1;
  $('fval').value=''; $('ftxt').textContent=''; $('tools').style.display='flex';
  localStorage.setItem('pgweb.last', JSON.stringify({schema,table,kind}));

  const m = await api({action:'rows', schema, table, limit:CHUNK, is_meta:1});
  S.cols = m.cols; S.meta = m.meta; S.pk = m.meta.pk;
  S.total = kind==='table' ? Math.max(m.meta.stats.est_rows, m.rows.length) : m.rows.length;
  S.chunks.set(0, m.rows);
  if(m.rows.length < CHUNK) S.total = m.rows.length;   // small table: exact

  $('p-struct').textContent = m.meta.columns.map(c =>
    `${c.name.padEnd(28)}${c.type}${c.nullable?'':'  not null'}${c.default_value?'  default '+c.default_value:''}`).join('\n');
  $('p-idx').textContent = m.meta.indexes.map(i=>i.def).join('\n\n') || '(no indexes)';
  $('fcol').innerHTML = S.cols.map(c=>`<option>${c}</option>`).join('');
  const st = m.meta.stats;
  $('tinfo-lines').innerHTML =
    `<div class="line">Size<span>${st.total_size||'—'}</span></div>` +
    `<div class="line">Index size<span>${st.index_size||'—'}</span></div>` +
    `<div class="line">${kind==='table'?'Estimated rows':'Rows'}<span>${kind==='table'?num(st.est_rows):m.rows.length}</span></div>` +
    `<div class="line">Columns<span>${m.meta.columns.length}</span></div>`;
  $('st-obj').innerHTML = `<b>${schema}.${table}</b>`;
  $('st-rows').textContent = kind==='table'
    ? `~${num(m.meta.stats.est_rows)} rows` : `${m.rows.length} rows`;
  $('st-size').textContent = m.meta.stats.total_size || '';
  updateButtons();
  buildGrid(); vp.scrollTop=0; render(true);
  show('rows');
}

/* ---------------- grid ---------------- */
function measure(){
  const sample = (S.local || S.chunks.get(0) || []).slice(0, 40);
  S.widths = S.cols.map((c,i) => {
    let n = c.length;
    for(const r of sample){ const v=r[i]; if(v!=null){ const L=String(v).length; if(L>n) n=L; } }
    return Math.max(MINW, Math.min(MAXW, n*7.1 + 20));
  });
  const saved = JSON.parse(localStorage.getItem('pgweb.w.'+S.schema+'.'+S.table)||'null');
  if(saved && saved.length===S.cols.length) S.widths = saved;
}
function geometry(){
  const totalPx = S.total * ROW_H;
  S.viewPx = Math.min(totalPx, MAXH);
  S.scale = S.viewPx > 0 ? totalPx / S.viewPx : 1;   // >1 once the table exceeds the pixel ceiling
}
function buildGrid(){
  measure(); geometry();
  const total = S.widths.reduce((a,b)=>a+b,0);
  inner.style.width = total+'px';
  canvas.style.height = S.viewPx+'px';
  headEl.textContent='';
  S.cols.forEach((c,i)=>{
    const th=document.createElement('div'); th.className='th'; th.style.width=S.widths[i]+'px';
    th.textContent=c; th.title=c;
    const g=document.createElement('div'); g.className='grip'; g.dataset.i=i; th.appendChild(g);
    headEl.appendChild(th);
  });
  const need = Math.ceil(vp.clientHeight/ROW_H) + OVER*2;
  rowsEl.textContent=''; pool=[];
  const frag=document.createDocumentFragment();
  for(let i=0;i<need;i++){
    const tr=document.createElement('div'); tr.className='tr';
    for(let c=0;c<S.cols.length;c++){
      const td=document.createElement('div'); td.className='td'; td.style.width=S.widths[c]+'px';
      td.dataset.c=c; tr.appendChild(td);
    }
    frag.appendChild(tr); pool.push(tr);
  }
  rowsEl.appendChild(frag);
  $('empty').classList.toggle('on', S.total===0);
}
function rowAt(i){
  if(S.local) return S.local[i];
  const ci = Math.floor(i/CHUNK), c = S.chunks.get(ci);
  return c ? c[i - ci*CHUNK] : null;
}
function ensure(ci){
  if(S.local || ci<0 || S.chunks.has(ci) || S.pending.has(ci)) return;
  if(ci*CHUNK >= S.total) return;
  S.pending.set(ci, 1);
  api({action:'rows', schema:S.schema, table:S.table, pk:S.pk, limit:CHUNK,
       offset:ci*CHUNK, where:S.where||undefined})
    .then(m=>{
      S.chunks.set(ci, m.rows); S.pending.delete(ci);
      if(S.chunks.size > 60){
        for(const k of S.chunks.keys()) if(Math.abs(k-ci)>14){ S.chunks.delete(k); break; }
      }
      lastFirst=-1; render(true);
    })
    .catch(()=>S.pending.delete(ci));
}
function render(force){
  const top = vp.scrollTop, scaled = S.scale > 1.0001;
  // unscaled: pixel-exact. scaled: map scroll position onto the row range and pin the
  // block to the viewport, since one pixel now covers several rows.
  let first = scaled ? Math.round(top * S.scale / ROW_H) : Math.floor(top/ROW_H) - OVER;
  first = Math.max(0, Math.min(first, Math.max(0, S.total - pool.length)));
  if(!force && first===lastFirst) return;
  lastFirst = first;
  rowsEl.style.transform = `translateY(${scaled ? top : first*ROW_H}px)`;
  if(!S.local){ const ci=Math.floor(first/CHUNK); ensure(ci); ensure(ci+1); }
  for(let p=0;p<pool.length;p++){
    const idx=first+p, tr=pool[p];
    if(idx >= S.total){ tr.hidden=true; continue; }
    tr.hidden=false; tr.dataset.i=idx;
    tr.classList.toggle('sel', idx===S.sel);
    const row=rowAt(idx), cells=tr.children;
    for(let c=0;c<cells.length;c++){
      const td=cells[c];
      if(!row){ td.textContent=''; td.className='td'; continue; }
      const v=row[c];
      td.textContent = v===null ? 'NULL' : String(v);
      td.className = v===null ? 'td null' : 'td';
    }
  }
}
vp.addEventListener('scroll', ()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{ ticking=false; render(false); });
}, {passive:true});
// the pool is sized to the viewport, so it has to follow it — a window resize, a pane that
// starts collapsed, or a tab first painted in the background all land here
new ResizeObserver(()=>{
  if(!S.cols.length) return;
  const need = Math.ceil(vp.clientHeight/ROW_H) + OVER*2;
  if(need !== pool.length){ buildGrid(); lastFirst=-1; render(true); }
}).observe(vp);

/* column resize */
let drag=null;
headEl.addEventListener('mousedown', e=>{
  const g=e.target.closest('.grip'); if(!g) return;
  drag={i:+g.dataset.i, x:e.clientX, w:S.widths[+g.dataset.i]}; e.preventDefault();
});
addEventListener('mousemove', e=>{
  if(!drag) return;
  const w=Math.max(MINW, drag.w + (e.clientX-drag.x));
  S.widths[drag.i]=w;
  headEl.children[drag.i].style.width=w+'px';
  for(const tr of pool) tr.children[drag.i].style.width=w+'px';
  inner.style.width=S.widths.reduce((a,b)=>a+b,0)+'px';
});
addEventListener('mouseup', ()=>{
  if(!drag) return;
  localStorage.setItem('pgweb.w.'+S.schema+'.'+S.table, JSON.stringify(S.widths));
  drag=null;
});

/* ---------------- selection, view cell, edit ---------------- */
rowsEl.addEventListener('click', e=>{
  const tr=e.target.closest('.tr'); if(!tr||tr.hidden) return;
  S.sel = +tr.dataset.i; updateButtons();
  for(const t of pool) t.classList.toggle('sel', +t.dataset.i===S.sel);
});
rowsEl.addEventListener('dblclick', e=>{
  const td=e.target.closest('.td'); if(!td) return;
  const tr=td.parentElement, row=rowAt(+tr.dataset.i); if(!row) return;
  const val=row[+td.dataset.c];
  const long = val!=null && String(val).length>60;
  if(long || !canEdit()) return showCell(S.cols[+td.dataset.c], val);
  beginEdit(td);
});
function showCell(col, val){
  $('dlg-t').textContent=col;
  $('dlg-b').innerHTML='<pre id="cellbox"></pre>';
  $('cellbox').textContent = val===null ? 'NULL' : String(val);
  $('dlg-f').innerHTML='<button value="cancel">close</button>';
  $('dlg').showModal();
}
const canEdit = () => S.kind==='table' && !!S.pk && !S.local;
function beginEdit(td){
  const tr=td.parentElement, idx=+tr.dataset.i, ci=+td.dataset.c;
  const row=rowAt(idx); if(!row) return;
  const before = row[ci];
  td.contentEditable='plaintext-only'; td.classList.remove('null');
  td.textContent = before===null ? '' : String(before);
  td.focus();
  const r=document.createRange(); r.selectNodeContents(td);
  getSelection().removeAllRanges(); getSelection().addRange(r);
  let done=false;
  const finish = async (commit) => {
    if(done) return; done=true;
    td.contentEditable='false';
    const raw=td.textContent;
    if(!commit || raw === (before===null?'':String(before))){ lastFirst=-1; render(true); return; }
    const next = raw==='' ? null : raw;
    try{
      const m = await api({action:'mutate', mode:'update', schema:S.schema, table:S.table, pk:S.pk,
                           obj:{[S.pk]: row[S.cols.indexOf(S.pk)], [S.cols[ci]]: next}});
      if(m.rows[0]){ const cix=Math.floor(idx/CHUNK), arr=S.chunks.get(cix);
                     if(arr) arr[idx-cix*CHUNK]=m.rows[0]; }
      flash('updated');
    }catch(err){ alertBox('update failed', err.message); }
    lastFirst=-1; render(true);
  };
  td.onkeydown = ev => {
    if(ev.key==='Enter'){ ev.preventDefault(); finish(true); }
    else if(ev.key==='Escape'){ ev.preventDefault(); finish(false); }
  };
  td.onblur = () => finish(true);
}
function updateButtons(){
  $('delrow').disabled = !(canEdit() && S.sel>=0);
  $('addrow').disabled = !canEdit();
}

/* ---------------- insert / delete ---------------- */
$('addrow').onclick = () => {
  if(!canEdit()) return;
  $('dlg-t').textContent = `insert into ${S.table}`;
  $('dlg-b').innerHTML = S.meta.columns.map(c=>
    `<div class="f"><label title="${c.name}">${c.name}</label>
     <input data-col="${c.name}" placeholder="${c.default_value?'default':(c.nullable?'null':c.type)}"></div>`).join('');
  $('dlg-f').innerHTML = '<button value="cancel">cancel</button><button class="primary" id="ins">insert</button>';
  $('dlg').showModal();
  $('ins').onclick = async ev => {
    ev.preventDefault();
    const obj={};
    for(const el of $('dlg-b').querySelectorAll('input')) if(el.value!=='') obj[el.dataset.col]=el.value;
    if(!Object.keys(obj).length) return;
    try{
      await api({action:'mutate', mode:'create', schema:S.schema, table:S.table, pk:S.pk, obj});
      $('dlg').close(); flash('inserted'); reload();
    }catch(err){ alertBox('insert failed', err.message); }
  };
};
$('delrow').onclick = () => {
  if(!canEdit() || S.sel<0) return;
  const row=rowAt(S.sel); if(!row) return;
  const id=row[S.cols.indexOf(S.pk)];
  $('dlg-t').textContent='delete row';
  $('dlg-b').textContent=`delete from ${S.schema}.${S.table} where ${S.pk} = ${id}`;
  $('dlg-f').innerHTML='<button value="cancel">cancel</button><button class="primary" id="del">delete</button>';
  $('dlg').showModal();
  $('del').onclick = async ev => {
    ev.preventDefault();
    try{
      await api({action:'mutate', mode:'delete', schema:S.schema, table:S.table, pk:S.pk, obj:{[S.pk]:id}});
      $('dlg').close(); flash('deleted'); S.sel=-1; reload();
    }catch(err){ alertBox('delete failed', err.message); }
  };
};

/* ---------------- filter ---------------- */
const OPS={'=':'=','≠':'<>','>':'>','<':'<','≥':'>=','≤':'<=','LIKE':'LIKE','ILIKE':'ILIKE',
           'IS NULL':'IS NULL','IS NOT NULL':'IS NOT NULL'};
$('fgo').onclick = async () => {
  const col=$('fcol').value, op=OPS[$('fop').value], val=$('fval').value;
  if(!col) return;
  S.where = op.startsWith('IS') ? `"${col}" ${op}`
          : `"${col}" ${op} '${String(val).replace(/'/g,"''")}'`;
  await applyFilter();
};
$('fclr').onclick = async () => { S.where=''; $('fval').value=''; await applyFilter(); };
async function applyFilter(){
  S.chunks.clear(); S.pending.clear(); S.sel=-1; lastFirst=-1;
  try{
    const [first, cnt] = await Promise.all([
      api({action:'rows', schema:S.schema, table:S.table, pk:S.pk, limit:CHUNK, where:S.where||undefined}),
      S.where ? api({action:'count', schema:S.schema, table:S.table, where:S.where}) : null
    ]);
    S.chunks.set(0, first.rows);
    S.total = S.where ? (first.rows.length<CHUNK ? first.rows.length : Math.max(cnt.count, first.rows.length))
                      : Math.max(S.meta.stats.est_rows, first.rows.length);
    $('ftxt').textContent = S.where ? (first.rows.length<CHUNK ? `${first.rows.length} matched` : `~${num(S.total)} matched`) : '';
    $('st-rows').textContent = S.where ? `~${num(S.total)} rows` : `~${num(S.meta.stats.est_rows)} rows`;
    buildGrid(); vp.scrollTop=0; render(true);
  }catch(err){ alertBox('filter failed', err.message); }
}
$('fval').onkeydown = e => { if(e.key==='Enter') $('fgo').click(); };

/* ---------------- query ---------------- */
async function runQuery(confirmed){
  const sql=$('sql').value.trim(); if(!sql) return;
  $('run').disabled=true; $('qmsg').className=''; $('qmsg').textContent='running…';
  const t0=performance.now();
  try{
    const m = await api({action:'query', sql, is_confirmed: confirmed?1:0});
    S.local=m.rows; S.cols=m.cols; S.total=m.rows.length; S.sel=-1; S.pk=null;
    S.chunks.clear(); lastFirst=-1;
    $('tools').style.display='none';        // column filters belong to a table, not a result set
    $('tinfo-lines').innerHTML='';          // stats belong to a table too
    buildGrid(); vp.scrollTop=0; render(true); show('rows'); updateButtons();
    $('qmsg').textContent = `${m.rows.length} rows`;
    $('st-obj').innerHTML='<b>query</b>'; $('st-rows').textContent=`${m.rows.length} rows`; $('st-size').textContent='';
    $('st-time').textContent = (performance.now()-t0).toFixed(1)+' ms';
  }catch(err){
    if(err.message.includes('unbounded_write')){
      $('qmsg').textContent='';
      $('dlg-t').textContent='unbounded write';
      $('dlg-b').textContent='this statement has no WHERE clause and will affect every row. run it?';
      $('dlg-f').innerHTML='<button value="cancel">cancel</button><button class="primary" id="yes">run anyway</button>';
      $('dlg').showModal();
      $('yes').onclick=ev=>{ ev.preventDefault(); $('dlg').close(); runQuery(true); };
    } else { $('qmsg').className='err'; $('qmsg').textContent=err.message; }
  } finally { $('run').disabled=false; }
}
$('run').onclick = ()=>runQuery(false);
$('sql').addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); runQuery(false); }
  if(e.key==='Tab'){ e.preventDefault(); const s=e.target.selectionStart;
    e.target.setRangeText('  ', s, e.target.selectionEnd, 'end'); }
});

/* ---------------- chrome ---------------- */
function show(v){
  for(const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.v===v);
  for(const x of document.querySelectorAll('.view')) x.classList.toggle('on', x.id==='v-'+v);
  if(v==='rows' && S.cols.length){ lastFirst=-1; render(true); }
}
for(const t of document.querySelectorAll('.tab')) t.onclick = ()=>show(t.dataset.v);
function reload(){ if(S.table) openObject(S.schema, S.table, S.kind); }
$('reload').onclick = reload;
function flash(msg){ const el=$('st-time'); const old=el.textContent; el.textContent=msg;
                     setTimeout(()=>{ if(el.textContent===msg) el.textContent=old; }, 1200); }
function alertBox(title, msg){
  $('dlg-t').textContent=title; $('dlg-b').innerHTML='<pre id="cellbox"></pre>';
  $('cellbox').textContent=msg;
  $('dlg-f').innerHTML='<button value="cancel">close</button>'; $('dlg').showModal();
}
addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$('dlg').open && document.activeElement?.contentEditable!=='true'){
    if(S.sel>=0){ S.sel=-1; updateButtons(); lastFirst=-1; render(true); }
  }
});

/* auto-resume an existing session (cookie survives reload) */
(async function boot(){
  try{
    const m = await api({action:'schema'});
    S.tree=m.tree; document.body.classList.add('ready');
    const info = await api({action:'query', sql:'select current_database() as db'});
    S.db=info.rows[0][0]; $('dbname').textContent=S.db;
    drawTree();
    const last=JSON.parse(localStorage.getItem('pgweb.last')||'null');
    if(last && (S.tree[last.schema]||{})[last.kind]?.some(o=>o.name===last.table))
      openObject(last.schema,last.table,last.kind);
  }catch{ /* no session yet: connect screen stays up */ }
})();
</script>
</body>
