<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>pgweb</title>
<style>
/* palette from pgweb's own app.css: #79589f chrome, #7eb54e primary, #f9f9f9 sidebar,
   #ffe row hover, #3874d7 selection, #bbb nulls */
:root{
  color-scheme:light;
  --nav:#79589f; --nav-fg:#d6cce2; --nav-on-bg:#fff; --nav-on-fg:#000;
  --side:#f9f9f9; --bg:#fff; --fg:#3a3633; --dim:#aaa; --line:#ddd;
  --th-fg:#333; --th-line:#eae9e9; --th-hover:#fafafa;
  --row-odd:#f9f9f9; --row-even:#fff; --row-line:#f2f2f2; --row-hover:#ffe;
  --sel:#3874d7; --sel-fg:#fff; --null:#bbb; --hl:#f1f1f1;
  --green:#7eb54e; --green-h:#64903e; --err:#c0392b;
  --table-list-bg:#fbfbfc;
  --side-on:#cfe0f8; --side-on-fg:#183f78;
  --sql-key:#7a3fb0; --sql-string:#c33b45; --sql-ident:#087f8c; --sql-number:#d45d00;
  --sql-comment:#7b8b78; --sql-param:#1769aa; --sql-type:#9b4d96; --sql-fn:#006d77;
  --apply-bg:#edf7e7; --apply-border:#9fc783; --cancel-bg:#f1eef5; --cancel-border:#c4b8d1;
  --row-h:30px; --bar-h:50px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --nav:#79589f; --nav-fg:#d6cce2; --nav-on-bg:#141419; --nav-on-fg:#f2f0ee;
  --side:#191920; --bg:#141419; --fg:#d9d5d1; --dim:#7a7a84; --line:#2e2e37;
  --th-fg:#cfcac5; --th-line:#2e2e37; --th-hover:#20202a;
  --row-odd:#191920; --row-even:#141419; --row-line:#22222b; --row-hover:#2a2a1c;
  --sel:#3874d7; --sel-fg:#fff; --null:#66666f; --hl:#24242e;
  --green:#8fc95f; --green-h:#a5d977; --err:#f2645a;
  --table-list-bg:#17171e;
  --side-on:#263b5a; --side-on-fg:#eef5ff;
  --sql-key:#c792ea; --sql-string:#f07178; --sql-ident:#89ddff; --sql-number:#f78c6c;
  --sql-comment:#71806f; --sql-param:#82aaff; --sql-type:#ffcb6b; --sql-fn:#80cbc4;
  --apply-bg:#24351f; --apply-border:#577a45; --cancel-bg:#292530; --cancel-border:#574c63;
}
/* light is the default regardless of OS preference — dark is opt-in via the toggle */

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);display:flex;
  font:13px/1.42857143 "Helvetica Neue",Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:4px 11px;
  cursor:pointer;color:var(--fg)}
button:hover:not(:disabled){border-color:#8a8a8a;background:var(--hl)}
button:disabled{opacity:.45;cursor:default}
button.primary{border-color:var(--green);color:var(--green)}
button.primary:hover:not(:disabled){border-color:var(--green-h);color:var(--green-h);background:var(--bg)}
.iconbtn{width:32px;height:29px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:3px;
  padding:4px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#999}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#c7c7c7;border-radius:6px;border:3px solid var(--bg)}
:root[data-theme=dark] ::-webkit-scrollbar-thumb{background:#3a3a45}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}

/* ---------- shell: always present, empty until connected ---------- */
#app{display:flex;flex:1;min-width:0}
#side{width:250px;flex:0 0 250px;background:var(--side);display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line)}
#dbline{height:var(--bar-h);flex:none;background:var(--nav);color:#fff;
  display:flex;justify-content:flex-start;align-items:center;padding:0 12px;min-width:0;
  border-bottom:1px solid rgba(0,0,0,.15)}
#productname{font-size:15px;font-weight:700;letter-spacing:-.15px;line-height:18px}
#runner{height:38px;flex:none;display:flex;align-items:center;padding:0 12px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:12px;font-weight:600;cursor:pointer;background:var(--table-list-bg)}
#runner[hidden]{display:none}
#runner:hover{background:var(--hl)}
#runner.on{background:var(--side-on);color:var(--side-on-fg);border-bottom-color:var(--line);
  box-shadow:inset 4px 0 0 var(--sel);font-weight:700}

#side .search{padding:8px;position:relative;background:var(--bg)}
#side .search input{width:100%;font-size:12px;padding:4px 24px 4px 8px}
#qclr{position:absolute;right:13px;top:12px;width:18px;height:18px;padding:0;line-height:15px;
  text-align:center;border-radius:50%;font-size:14px;color:var(--dim);border-color:transparent;background:transparent}
#qclr:hover:not(:disabled){background:var(--hl);color:var(--fg);border-color:transparent}
#qclr[hidden]{display:none}
#tree{flex:1;overflow:auto;padding-bottom:8px;font-size:12px;background:var(--table-list-bg)}
#tablecount{height:28px;flex:none;display:flex;align-items:center;padding:0 12px;border-top:1px solid var(--line);
  background:var(--side);color:var(--dim);font-size:11px}
#tablecount[hidden]{display:none}
.obj{display:flex;align-items:center;gap:8px;height:29px;padding:0 12px;cursor:pointer;white-space:nowrap;
  border-bottom:1px solid var(--row-line)}
.obj[hidden]{display:none}   /* author display:flex would otherwise beat the UA [hidden] rule */
.obj:hover{background:var(--hl)}
.obj.on{background:var(--side-on);color:var(--side-on-fg);font-weight:700;box-shadow:inset 4px 0 0 var(--sel)}
.obj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.obj .ct{color:var(--dim);font-size:11px;flex:none;font-weight:normal}
.obj.on .ct{color:var(--side-on-fg)}

#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{height:var(--bar-h);flex:none;display:flex;align-items:stretch;background:var(--nav);overflow:visible;position:relative;z-index:10}
.tab{padding:0 14px;line-height:var(--bar-h);font-size:13px;font-weight:500;color:var(--nav-fg);
  cursor:pointer;margin:0;flex:none;white-space:nowrap;border-left:1px solid rgba(255,255,255,.16);
  border-right:1px solid rgba(0,0,0,.12)}
.tab[hidden]{display:none}
.tab:hover{color:#fff}
.tab.on{background:var(--nav-on-bg);color:var(--nav-on-fg);border-color:var(--line)}
#tabs .sp{flex:1}
#tabs > button,#tabs > #optionswrap > button{align-self:center;background:transparent;color:#fff;border-color:rgba(255,255,255,.6);
  margin-right:8px;font-size:12px;flex:none;white-space:nowrap}
#tabs > button:hover:not(:disabled),#tabs > #optionswrap > button:hover:not(:disabled){background:#fff;color:var(--nav);border-color:#fff}
#optionswrap{align-self:stretch;display:flex;align-items:center;gap:2px;flex:none;margin-right:6px}
#optionswrap[hidden]{display:none}
#tabs > #optionswrap > .headicon{width:30px;height:30px;padding:0;margin:0;border:0;border-radius:3px;
  font-size:16px;line-height:28px;text-align:center}
#tabs > #optionswrap > .headicon svg{display:block;width:17px;height:17px;margin:auto;fill:none;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs > #optionswrap > #readonly.off{color:#ffd0cc}

#tools{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);
  background:var(--bg)}
#tools select,#tools input,#tools button{height:32px;padding:4px 9px;font-size:12px}
#fcol{min-width:150px}
#fgo{background:var(--apply-bg);border-color:var(--apply-border);color:var(--green-h);font-weight:600}
#fclr{background:var(--cancel-bg);border-color:var(--cancel-border);font-weight:600}
#fgo:hover:not(:disabled),#fclr:hover:not(:disabled){filter:brightness(.96)}
:root[data-theme=dark] #fgo:hover:not(:disabled),:root[data-theme=dark] #fclr:hover:not(:disabled){filter:brightness(1.16)}
#fval{width:180px}
#tools .sp{flex:1}
#ftxt{color:#888;font-size:12px}

#pane{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}

/* ---------- virtual grid ---------- */
/* contain must not include size here: #rows is absolutely positioned and shrink-to-fit,
   so size-contained rows would measure as empty and collapse to zero width */
#vp{flex:1;overflow:auto;position:relative;contain:layout paint;font-size:12px}
#inner{position:relative}
#head{position:sticky;top:0;z-index:3;display:flex;background:var(--bg);border-bottom:1px solid var(--th-line);border-left:1px solid var(--th-line)}
.th{flex:none;padding:0 9px;height:29px;line-height:29px;font-weight:bold;color:var(--th-fg);
    position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;user-select:none;border-right:1px solid var(--th-line)}
.th:hover{background:var(--th-hover)}
.th .grip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize}
.th .grip:hover{background:var(--nav)}
#canvas{position:relative}
#rows{position:absolute;top:0;left:0;width:100%;will-change:transform}
.tr{display:flex;height:var(--row-h);contain:layout paint;background:var(--row-even);
    border-bottom:1px solid var(--row-line)}
.tr[hidden]{display:none}   /* same [hidden] vs display:flex trap as .obj */
.tr:nth-child(odd){background:var(--row-odd)}
.tr:hover{background:var(--row-hover)}
.td{flex:none;padding:0 9px;height:29px;line-height:29px;color:var(--fg);
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--row-line)}
.td:first-child{border-left:1px solid var(--row-line)}
.td.null{color:var(--null);text-transform:uppercase}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim);
  pointer-events:none}
#v-rows > #empty{top:47px}
#empty.on{display:flex}

/* ---------- detail panes ---------- */
.detail-wrap{flex:1;min-height:0;overflow:auto}
.detail-grid{width:100%;min-width:720px;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px}
.detail-grid th,.detail-grid td{height:30px;padding:0 9px;line-height:29px;text-align:left;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--row-line);border-bottom:1px solid var(--row-line)}
.detail-grid th{position:sticky;top:0;z-index:2;background:var(--bg);color:var(--th-fg);font-weight:700;
  border-right-color:var(--th-line);border-bottom-color:var(--th-line)}
.detail-grid tbody tr:nth-child(odd){background:var(--row-odd)}
.detail-grid tbody tr:hover{background:var(--row-hover)}
.detail-grid td{color:var(--fg);cursor:default}
.detail-grid td.null{color:var(--null);text-transform:uppercase}
.detail-grid .empty-detail{height:90px;line-height:90px;text-align:center;color:var(--dim);font-family:inherit}

/* ---------- query ---------- */
#sqlwrap{height:210px;min-height:90px;flex:none;position:relative;resize:vertical;overflow:hidden;
  border-bottom:1px solid var(--line);background:var(--bg)}
#sql,#sqlhl{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;border-radius:0;
  padding:12px 14px;tab-size:2;white-space:pre;overflow:auto;
  font:12.5px/1.7 Menlo,Monaco,Consolas,"Courier New",monospace}
#sqlhl{pointer-events:none;color:var(--fg);background:transparent;scrollbar-width:none}
#sqlhl::-webkit-scrollbar{display:none}
#sql{resize:none;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--fg)}
#sql::selection{background:rgba(56,116,215,.28)}
#sql::placeholder{color:var(--dim);-webkit-text-fill-color:var(--dim)}
.sql-key{color:var(--sql-key);font-weight:600}.sql-string{color:var(--sql-string)}
.sql-ident{color:var(--sql-ident)}.sql-number{color:var(--sql-number)}.sql-comment{color:var(--sql-comment);font-style:italic}
.sql-param{color:var(--sql-param)}.sql-type{color:var(--sql-type)}.sql-fn{color:var(--sql-fn)}
#qbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--th-line)}
#qmsg{color:#888;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto}
#qmsg.err{color:var(--err)}
#qbar .export{padding:4px 10px}
#streamprogress{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11px;white-space:nowrap}
#streamprogress[hidden]{display:none}
#streambar{width:110px;height:7px;accent-color:var(--green)}
#qres{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}

/* ---------- status ---------- */
#status{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 11px;
        border-top:1px solid var(--th-line);background:var(--side);color:#888;font-size:12px}
#status[hidden]{display:none}
#status .sp{flex:1}
#status b{color:var(--fg);font-weight:bold}
#status .t{color:var(--green)}

dialog{border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);padding:0;
       box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:min(640px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .hd{padding:12px 15px;border-bottom:1px solid var(--th-line);font-weight:bold;font-size:14px;
  display:flex;align-items:center;gap:10px}
dialog .hd .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog .bd{padding:14px 15px;max-height:60vh;overflow:auto;font-size:12px}
dialog .ft{padding:10px 15px;border-top:1px solid var(--th-line);display:flex;gap:8px;justify-content:flex-end}
/* width:100% has no intrinsic size, so the dialog would shrink-wrap to nothing */
#dsn2{display:block;width:min(580px,82vw);min-height:39px;padding:9px 12px;resize:none;
      overflow-x:hidden;overflow-y:hidden;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13px;line-height:1.5;
      font-family:Menlo,Monaco,Consolas,"Courier New",monospace}
#derr{color:var(--err);margin-top:8px;min-height:16px;font-size:12px;white-space:pre-wrap}
#cellbox{white-space:pre-wrap;word-break:break-word;margin:0;
         font:12px/1.6 Menlo,Monaco,Consolas,"Courier New",monospace}
#v-info{overflow:auto;padding:16px}
#dbinfo-table{width:100%;max-width:760px;border-collapse:collapse;border:1px solid var(--th-line);font-size:12px}
#dbinfo-table th,#dbinfo-table td{padding:7px 9px;border:1px solid var(--th-line);text-align:left;vertical-align:top}
#dbinfo-table th{width:145px;color:var(--dim);font-weight:500;white-space:nowrap}
#dbinfo-table td{color:var(--fg);font-family:Menlo,Monaco,Consolas,"Courier New",monospace;word-break:break-word}
#dbinfo-table tr:last-child th,#dbinfo-table tr:last-child td{border-bottom:0}
#dbinfo-table .section th{width:auto;padding-top:13px;color:var(--fg);font-weight:700;background:var(--side)}
#toast{position:fixed;right:18px;bottom:18px;z-index:80;padding:7px 12px;
  border-radius:4px;background:#2f2d31;color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.25);font-size:12px;
  pointer-events:none;white-space:nowrap}
#toast[hidden]{display:none}
</style>
</head>
<body>

<div id="app">
  <aside id="side">
    <div id="dbline">
      <span id="productname">pgweb</span>
    </div>
    <div class="search" id="tablesearch" hidden>
      <input id="q" placeholder="Search tables" autocomplete="off" spellcheck="false"/>
      <button id="qclr" title="Clear" hidden>×</button>
    </div>
    <div id="runner" hidden>Query Runner</div>
    <div id="tree" hidden></div>
    <div id="tablecount" hidden></div>
  </aside>

  <main id="main">
    <div id="tabs">
      <div class="tab" data-v="query" hidden>Query Runner</div>
      <div class="tab" data-v="info" hidden>Database info</div>
      <div class="tab" data-v="rows" hidden>Rows</div>
      <div class="tab" data-v="struct" hidden>Structure</div>
      <div class="tab" data-v="indexes" hidden>Indexes</div>
      <div class="tab" data-v="constraints" hidden>Constraints</div>
      <div class="tab" data-v="triggers" hidden>Triggers</div>
      <div class="tab" data-v="policies" hidden>Policies</div>
      <div class="sp"></div>
      <div id="optionswrap" hidden>
        <button class="headicon" id="dbinfo" title="Database info" aria-label="Database info"></button>
        <button class="headicon on" id="readonly" title="Read only: On" aria-label="Read only: On"></button>
        <button class="headicon" id="reload" title="Refresh schema" aria-label="Refresh schema"></button>
        <button class="headicon" id="theme" title="Use dark theme" aria-label="Use dark theme"></button>
      </div>
      <button id="connbtn">Connect</button>
    </div>

    <div id="pane" hidden>
      <div class="view" id="v-info"><table id="dbinfo-table"><tbody></tbody></table></div>
      <div class="view" id="v-rows">
        <div id="tools">
          <select id="fcol"></select>
          <select id="fop">
            <option>=</option><option>≠</option><option>&gt;</option><option>&lt;</option>
            <option>≥</option><option>≤</option><option>LIKE</option><option>ILIKE</option>
            <option>IS NULL</option><option>IS NOT NULL</option>
          </select>
          <input id="fval" placeholder="Filter value" autocomplete="off"/>
          <button id="fgo" hidden>Apply</button>
          <button id="fclr" hidden>Cancel</button>
          <span class="sp"></span><span id="ftxt"></span>
        </div>
        <div id="vp"><div id="inner">
          <div id="head"></div>
          <div id="canvas"><div id="rows"></div></div>
        </div></div>
        <div id="empty">No rows</div>
      </div>
      <div class="view" id="v-struct"><div class="detail-wrap"><table class="detail-grid" id="g-struct"><thead><tr><th>Column</th><th>Type</th><th>Nullable</th><th>Default</th></tr></thead><tbody></tbody></table></div></div>
      <div class="view" id="v-indexes"><div class="detail-wrap"><table class="detail-grid" id="g-indexes"><thead><tr><th>Name</th><th>Definition</th></tr></thead><tbody></tbody></table></div></div>
      <div class="view" id="v-constraints"><div class="detail-wrap"><table class="detail-grid" id="g-constraints"><thead><tr><th>Name</th><th>Kind</th><th>Definition</th></tr></thead><tbody></tbody></table></div></div>
      <div class="view" id="v-triggers"><div class="detail-wrap"><table class="detail-grid" id="g-triggers"><thead><tr><th>Name</th><th>Function</th><th>Definition</th></tr></thead><tbody></tbody></table></div></div>
      <div class="view" id="v-policies"><div class="detail-wrap"><table class="detail-grid" id="g-policies"><thead><tr><th>Name</th><th>Command</th><th>Roles</th><th>Using</th><th>Check</th></tr></thead><tbody></tbody></table></div></div>
      <div class="view on" id="v-query">
        <div id="sqlwrap">
          <pre id="sqlhl" aria-hidden="true"></pre>
          <textarea id="sql" wrap="off" spellcheck="false" placeholder="select * from test limit 10;"></textarea>
        </div>
        <div id="qbar">
          <button class="primary" id="run">Run</button>
          <button id="stream" title="Download all returned rows as a streaming CSV">Stream</button>
          <button id="explain" title="Show the estimated query plan without executing the query">Explain</button>
          <button id="analyze" title="Execute the query and show actual timing and row counts">Analyze</button>
          <span id="streamprogress" hidden><progress id="streambar"></progress><span id="streammsg"></span></span>
          <span id="qmsg"></span>
          <button class="export" data-format="json" disabled>JSON</button>
          <button class="export" data-format="csv" disabled>CSV</button>
          <button class="export" data-format="xml" disabled>XML</button>
          <button id="resetsql" title="Reset to default SQL" hidden>Reset</button>
        </div>
        <div id="qres"></div>
      </div>
    </div>

    <div id="status" hidden>
      <span id="st-obj"></span><span id="st-rows"></span><span id="st-size"></span>
      <span class="sp"></span><span id="st-time" class="t"></span>
    </div>
  </main>
</div>

<dialog id="dlg"><form method="dialog">
  <div class="hd" id="dlg-t"></div><div class="bd" id="dlg-b"></div>
  <div class="ft" id="dlg-f"></div>
</form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
const ROW_H = 30, CHUNK = 1000, SIDE_BATCH = 200, OVER = 6, MAXW = 440, MINW = 64;   /* 29px cell + 1px rule; matches --row-h */
const DEFAULT_SQL = 'SELECT * FROM test LIMIT 10;';
// browsers clamp element height near 2^24 px; past that the spacer stops growing and the
// tail of a big table becomes unreachable, so the scrollbar is scaled instead of 1:1
const MAXH = 16000000;
const $ = s => document.getElementById(s);
const icon = name => ({
  info:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>',
  lock:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2M12 14v2"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 8a7 7 0 0 1 11.5-1L20 12M4 12l2.4 5a7 7 0 0 0 11.5-1"/></svg>',

// Native dialogs close on Escape but not on backdrop clicks by default.
$('dlg').addEventListener('click', e => {

  const r=$('dlg').getBoundingClientRect();
  if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom) $('dlg').close();
});

/* ---------------- api ---------------- */
async function api(body){
  const t0 = performance.now();
  const r = await fetch('/pgweb', {method:'POST', headers:{'Content-Type':'application/json'},
                                   body:JSON.stringify(body)});
  let j; try{ j = await r.json(); }catch{ throw new Error('bad response from server'); }
  const ms = performance.now() - t0;
  if(!r.ok || j.status !== 1){
    const msg = String(j?.message ?? j?.detail ?? r.statusText ?? 'request failed');
    if(msg.includes('not_connected')){ disconnected(); throw new Error('not_connected'); }
    throw new Error(msg);
  }
  $('st-time').textContent = ms.toFixed(1)+' ms';
  return j.message;
}

// the shell is always on screen; connection state only decides what's in it
function setConnected(on){
  S.connected = on;

  $('optionswrap').hidden = !on;

  if(!on) setExports(false);
  if(!on){
    S.tree={}; S.chunks.clear(); S.pending.clear();

async function doConnect(dsn){
  const m = await api({action:'connect', dsn});
  S.db = m.database; S.tree = m.tree;
  localStorage.setItem('pgweb.dsn', dsn);
  setConnected(true);
  drawTree(); openRunner();
}
function disconnected(){ setConnected(false); }

$('connbtn').onclick = () => S.connected ? askDisconnect() : askConnect();

function askConnect(){
  $('dlg-t').textContent = 'Connect to a database';
  $('dlg-b').innerHTML =
    '<textarea id="dsn2" rows="1" wrap="soft" placeholder="postgresql://localhost:5432/postgres" autocomplete="off" spellcheck="false"></textarea>'
    + '<div id="derr"></div>';
  $('dlg-f').innerHTML = '<button value="cancel">Cancel</button><button class="primary" id="dgo">Connect</button>';
  $('dlg').showModal();
  const inp = $('dsn2');
  const fit = () => { inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight+2,160)+'px'; };
  inp.value = localStorage.getItem('pgweb.dsn') || 'postgresql://localhost:5432/postgres'; fit();
  inp.oninput = fit; inp.focus(); inp.select();
  const go = async ev => {
    ev?.preventDefault();
    const dsn = inp.value.trim(); if(!dsn) return;
    $('dgo').disabled = inp.disabled = true; $('derr').textContent = 'connecting…';

function askDisconnect(){

/* ---------------- sidebar ---------------- */
// All public table names stay in memory; DOM rows are appended in small batches.
function drawTree(){
  S.sideItems=((S.tree.public||{}).table||[]).map(o=>o.name).sort((a,b)=>a.localeCompare(b));
  renderTreeBatch(true);
}
function renderTreeBatch(reset=false){
  const box=$('tree'), term=$('q').value.trim().toLowerCase();
  const matches=term ? S.sideItems.filter(name=>name.toLowerCase().includes(term)) : S.sideItems;
  const total=S.sideItems.length, shown=matches.length;
  $('tablecount').textContent = term
    ? `${shown} of ${total} ${total===1?'table':'tables'}`
    : `${total} ${total===1?'table':'tables'}`;
  if(reset){ box.textContent=''; S.sideShown=0; }
  const next=matches.slice(S.sideShown, S.sideShown+SIDE_BATCH);
  const frag = document.createDocumentFragment();
  for(const name of next){
    const d = document.createElement('div'); d.className='obj'+(S.table===name?' on':'');
    d.dataset.table=name; d.dataset.kind='table';
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=name; nm.title=name;
    d.appendChild(nm);
    d.onclick=()=>openObject(name, 'table');
    frag.appendChild(d);
  }
  S.sideShown+=next.length; box.appendChild(frag);
  if(reset && !matches.length){
    const empty=document.createElement('div'); empty.className='obj'; empty.style.cssText='color:var(--dim);cursor:default';
    empty.textContent=term?'No matching tables':'No tables in public'; box.appendChild(empty);
  }
}
function searchTables(){
  const term = $('q').value.trim().toLowerCase();

}
$('tree').addEventListener('scroll', () => {

$('qclr').onclick = () => { $('q').value=''; searchTables(); $('q').focus(); };

/* ---------------- query runner (the default view) ---------------- */
const SQL_KEYWORDS=new Set(('ALL ANALYSE ANALYZE AND ANY ARRAY AS ASC ASYMMETRIC AUTHORIZATION BEGIN BINARY BOTH BY CASE CASCADE CAST CHECK COLLATE COLLATION COLUMN COMMIT CONCURRENTLY CONFLICT CONSTRAINT CREATE CROSS CURRENT_CATALOG CURRENT_DATE CURRENT_ROLE CURRENT_SCHEMA CURRENT_TIME CURRENT_TIMESTAMP CURRENT_USER DATABASE DECLARE DEFAULT DEFERRABLE DELETE DESC DISTINCT DO DROP ELSE ELSIF END EXCEPT EXISTS EXPLAIN FALSE FETCH FOR FOREIGN FREEZE FROM FULL FUNCTION GRANT GROUP HAVING IF ILIKE IN INDEX INITIALLY INNER INSERT INTERSECT INTO IS ISNULL JOIN LANGUAGE LATERAL LEADING LEFT LIKE LIMIT LOCALTIME LOCALTIMESTAMP LOOP MATERIALIZED NATURAL NOT NOTHING NOTNULL NULL NULLS OFFSET ON ONLY OR ORDER OUTER OVER OVERLAPS PARTITION PLACING POLICY PRIMARY PROCEDURE RAISE RECURSIVE REFERENCES REPLACE RESTRICT RETURNS RETURNING RIGHT ROLLBACK SCHEMA SELECT SESSION_USER SET SIMILAR SOME SYMMETRIC TABLE TABLESAMPLE THEN TO TRAILING TRANSACTION TRIGGER TRUE UNION UNIQUE UPDATE USER USING VALUES VARIADIC VERBOSE VIEW WHEN WHERE WINDOW WITH').split(' '));
const SQL_TYPES=new Set(('BIGINT BIGSERIAL BIT BOOL BOOLEAN BOX BYTEA CHAR CHARACTER CIDR CIRCLE DATE DEC DECIMAL DOUBLE ENUM FLOAT FLOAT4 FLOAT8 INET INT INT2 INT4 INT8 INTEGER INTERVAL JSON JSONB LINE LSEG MACADDR MONEY NUMERIC PATH POINT POLYGON REAL SERIAL SERIAL2 SERIAL4 SERIAL8 SMALLINT SMALLSERIAL TEXT TIME TIMESTAMP TIMESTAMPTZ TIMETZ TSQUERY TSVECTOR UUID VARCHAR VARYING XML').split(' '));
const SQL_FUNCTIONS=new Set(('AVG COUNT MAX MIN SUM ARRAY_AGG JSON_AGG JSONB_AGG STRING_AGG COALESCE NULLIF GREATEST LEAST NOW CURRENT_DATABASE CURRENT_SCHEMA VERSION LOWER UPPER LENGTH SUBSTRING TRIM DATE_TRUNC EXTRACT TO_CHAR TO_DATE TO_TIMESTAMP ROW_NUMBER RANK DENSE_RANK LAG LEAD FIRST_VALUE LAST_VALUE GENERATE_SERIES UNNEST').split(' '));
const sqlEscape=value=>value.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
function updateSqlHighlight(){
  const source=$('sql').value;
  const token=/--[^\n]*|\/\*[\s\S]*?(?:\*\/|$)|\$[A-Za-z_][A-Za-z0-9_]*\$[\s\S]*?(?:\$[A-Za-z_][A-Za-z0-9_]*\$|$)|\$\$[\s\S]*?(?:\$\$|$)|(?:[eEnNbBxX])?'(?:''|\\[\s\S]|[^'])*'|"(?:""|[^"])*"|\$\d+|\b(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?\b|\b[A-Za-z_][A-Za-z0-9_$]*\b/g;
  let html='',last=0,match;
  while((match=token.exec(source))){
    html+=sqlEscape(source.slice(last,match.index));
    const value=match[0], upper=value.toUpperCase(); let cls='';
    if(value.startsWith('--')||value.startsWith('/*')) cls='sql-comment';
    else if(value.startsWith("'")||/^[eEnNbBxX]'/.test(value)||value.startsWith('$$')||/^\$[A-Za-z_]/.test(value)) cls='sql-string';
    else if(value.startsWith('"')) cls='sql-ident';
    else if(/^\$\d+$/.test(value)) cls='sql-param';
    else if(/^(?:\d|\.\d)/.test(value)) cls='sql-number';
    else if(SQL_KEYWORDS.has(upper)) cls='sql-key';
    else if(SQL_TYPES.has(upper)) cls='sql-type';
    else if(SQL_FUNCTIONS.has(upper)||source.slice(token.lastIndex).trimStart().startsWith('(')) cls='sql-fn';
    const safe=sqlEscape(value); html+=cls?`<span class="${cls}">${safe}</span>`:safe; last=token.lastIndex;
  }
  $('sqlhl').innerHTML=html+sqlEscape(source.slice(last))+'\n';
  $('sqlhl').scrollTop=$('sql').scrollTop; $('sqlhl').scrollLeft=$('sql').scrollLeft;
}
function seedQuery(){
  if($('sql').value.trim() || S.queryCleared) return;
  $('sql').value = DEFAULT_SQL;
}
function drawResetSql(){ $('resetsql').hidden=$('sql').value===DEFAULT_SQL && !S.local; }
function openRunner(){
  for(const el of document.querySelectorAll('.obj.on')) el.classList.remove('on');
  $('runner').classList.add('on');
  S.table=''; S.kind='';
  for(const t of document.querySelectorAll('.tab')) t.hidden = t.dataset.v!=='query';
  show('query');
  $('st-obj').textContent=''; $('st-rows').textContent=''; $('st-size').textContent='';
  seedQuery();
  updateSqlHighlight();
  drawResetSql();
  $('sql').focus();
}
$('runner').onclick = openRunner;

/* ---------------- open a table ---------------- */
function fillDetailGrid(id, rows, emptyText='No data'){
  const table=$(id), body=table.tBodies[0]; body.textContent='';
  if(!rows.length){
    const tr=body.insertRow(), td=tr.insertCell(); td.colSpan=table.tHead.rows[0].cells.length;
    td.className='empty-detail'; td.textContent=emptyText; return;
  }
  for(const values of rows){
    const tr=body.insertRow();
    for(const value of values){
      const td=tr.insertCell(); td.textContent=value==null?'NULL':String(value);
      if(value==null) td.classList.add('null');
    }
  }
}
async function openObject(table, kind){
  $('runner').classList.remove('on');
  for(const el of document.querySelectorAll('.obj.on')) el.classList.remove('on');
  document.querySelector(`.obj[data-table="${table}"]`)?.classList.add('on');
  S.table=table; S.kind=kind; S.where=''; S.local=null; S.loaded={};
  setExports(false);
  S.chunks.clear(); S.pending.clear(); lastFirst=-1;
  $('fval').value=''; $('ftxt').textContent='';
  mountGrid($('v-rows'));
  localStorage.setItem('pgweb.last', JSON.stringify({table,kind}));
  for(const t of document.querySelectorAll('.tab')) t.hidden = t.dataset.v==='query'||t.dataset.v==='info';

  const m = await api({action:'rows', table, limit:CHUNK, is_meta:1});
  S.meta=m.meta; S.cols=m.meta.columns.map(c=>c.name); S.pk=m.meta.pk;
  S.total = m.rows.length;
  S.chunks.set(0, m.rows);

  fillDetailGrid('g-struct',m.meta.columns.map(c=>[c.name,c.type,c.nullable?'Yes':'No',c.default_value]));
  for(const p of DETAILS) $('g-'+p).tBodies[0].textContent='';
  $('fcol').textContent='';
  for(const column of m.meta.columns){
    const option=document.createElement('option'); option.value=column.name; option.textContent=column.name;
    $('fcol').appendChild(option);
  }
  S.filterApplied={col:$('fcol').value,op:'=',val:''}; drawFilterOps(false); drawFilterActions();
  $('st-obj').innerHTML = `<b>${table}</b>`;
  $('st-rows').textContent = `${m.rows.length} rows loaded`;
  $('st-size').textContent = m.meta.stats.total_size || '';
  $('ftxt').textContent = `${m.rows.length} ${m.rows.length===1?'row':'rows'} fetched`;
  buildGrid(); vp.scrollTop=0; render(true);
  show('rows');
}

/* per-table detail: one request, only when its tab is first opened */
async function loadDetail(part){
  if(S.loaded[part] || !S.table) return;
  S.loaded[part] = true;
  fillDetailGrid('g-'+part,[], 'Loading…');
  try{
    const m = await api({action:'detail', table:S.table, part});
    const rows=part==='indexes' ? m.rows.map(r=>[r.name,r.def])
      : part==='constraints' ? m.rows.map(r=>[r.name,r.kind,r.def])
      : part==='triggers' ? m.rows.map(r=>[r.name,(r.function||'')+'()',r.def])
      : m.rows.map(r=>[r.name,r.kind,r.roles||'public',r.using_expr,r.check_expr]);
    fillDetailGrid('g-'+part,rows,`No ${part}`);
  }catch(err){ S.loaded[part]=false; fillDetailGrid('g-'+part,[], 'Error: '+err.message); }
}

/* ---------------- grid ---------------- */
function measure(){
  const sample = (S.local || S.chunks.get(0) || []).slice(0, 40);
  S.widths = S.cols.map((c,i) => {
    let n = c.length;
    for(const r of sample){ const v=r[i]; if(v!=null){ const L=String(v).length; if(L>n) n=L; } }
    return Math.max(MINW, Math.min(MAXW, Math.ceil(n*7.25) + 26));   /* 12px mono ≈ 7.22px/char + 18px padding */
  });
  const saved = JSON.parse(localStorage.getItem('pgweb.w.'+S.table)||'null');
  if(saved && saved.length===S.cols.length) S.widths = saved;
}
function geometry(){
  const totalPx = S.total * ROW_H;
  S.viewPx = Math.min(totalPx, MAXH);
  S.scale = S.viewPx > 0 ? totalPx / S.viewPx : 1;   // >1 once the table exceeds the pixel ceiling
}
function buildGrid(){
  measure(); geometry();
  inner.style.width = S.widths.reduce((a,b)=>a+b,0)+'px';
  canvas.style.height = S.viewPx+'px';
  headEl.textContent='';
  S.cols.forEach((c,i)=>{
    const th=document.createElement('div'); th.className='th'; th.style.width=S.widths[i]+'px';
    th.textContent=c; th.title=c;
    const g=document.createElement('div'); g.className='grip'; g.dataset.i=i; th.appendChild(g);
    headEl.appendChild(th);
  });
  const need = Math.ceil(vp.clientHeight/ROW_H) + OVER*2;
  rowsEl.textContent=''; pool=[];
  const frag=document.createDocumentFragment();
  for(let i=0;i<need;i++){
    const tr=document.createElement('div'); tr.className='tr';
    for(let c=0;c<S.cols.length;c++){
      const td=document.createElement('div'); td.className='td'; td.style.width=S.widths[c]+'px';
      td.dataset.c=c; tr.appendChild(td);
    }
    frag.appendChild(tr); pool.push(tr);
  }
  rowsEl.appendChild(frag);
  $('empty').textContent = 'No rows';
  $('empty').classList.toggle('on', S.total===0);
}
function rowAt(i){
  if(S.local) return S.local[i];
  const ci = Math.floor(i/CHUNK), c = S.chunks.get(ci);
  return c ? c[i - ci*CHUNK] : null;
}
function ensure(ci){
  if(S.local || ci<0 || S.chunks.has(ci) || S.pending.has(ci)) return;
  if(ci*CHUNK >= S.total) return;
  S.pending.set(ci, 1);
  api({action:'rows', table:S.table, pk:S.pk, limit:CHUNK,
       offset:ci*CHUNK, where:S.where||undefined})
    .then(m=>{
      S.chunks.set(ci, m.rows); S.pending.delete(ci);
      if(S.chunks.size > 60){
        for(const k of S.chunks.keys()) if(Math.abs(k-ci)>14){ S.chunks.delete(k); break; }
      }
      lastFirst=-1; render(true);
    })
    .catch(()=>S.pending.delete(ci));
}
function render(force){
  const top = vp.scrollTop, scaled = S.scale > 1.0001;
  // unscaled: pixel-exact. scaled: map scroll position onto the row range and pin the
  // block to the viewport, since one pixel now covers several rows.
  let first = scaled ? Math.round(top * S.scale / ROW_H) : Math.floor(top/ROW_H) - OVER;
  first = Math.max(0, Math.min(first, Math.max(0, S.total - pool.length)));
  if(!force && first===lastFirst) return;
  lastFirst = first;
  rowsEl.style.transform = `translateY(${scaled ? top : first*ROW_H}px)`;
  if(!S.local){ const ci=Math.floor(first/CHUNK); ensure(ci); ensure(ci+1); }
  for(let p=0;p<pool.length;p++){
    const idx=first+p, tr=pool[p];
    if(idx >= S.total){ tr.hidden=true; continue; }
    tr.hidden=false; tr.dataset.i=idx;
    const row=rowAt(idx), cells=tr.children;
    for(let c=0;c<cells.length;c++){
      const td=cells[c];
      if(!row){ td.textContent=''; td.className='td'; continue; }
      const v=row[c];
      td.textContent = v===null ? 'NULL' : String(v);
      td.className = v===null ? 'td null' : 'td';
    }
  }
}
vp.addEventListener('scroll', ()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{ ticking=false; render(false); });
}, {passive:true});
// the pool is sized to the viewport, so it has to follow it — a window resize, a pane that
// starts collapsed, or a tab first painted in the background all land here
new ResizeObserver(()=>{
  if(!S.cols.length) return;
  const need = Math.ceil(vp.clientHeight/ROW_H) + OVER*2;
  if(need !== pool.length){ buildGrid(); lastFirst=-1; render(true); }
}).observe(vp);

/* column resize */
let drag=null;
headEl.addEventListener('mousedown', e=>{
  const g=e.target.closest('.grip'); if(!g) return;
  drag={i:+g.dataset.i, x:e.clientX, w:S.widths[+g.dataset.i]}; e.preventDefault();
});
addEventListener('mousemove', e=>{
  if(!drag) return;
  const w=Math.max(MINW, drag.w + (e.clientX-drag.x));
  S.widths[drag.i]=w;
  headEl.children[drag.i].style.width=w+'px';
  for(const tr of pool) tr.children[drag.i].style.width=w+'px';
  inner.style.width=S.widths.reduce((a,b)=>a+b,0)+'px';
});
addEventListener('mouseup', ()=>{
  if(!drag) return;
  if(S.table) localStorage.setItem('pgweb.w.'+S.table, JSON.stringify(S.widths));
  drag=null;
});

/* shared read-only cell inspector — all writes go through the query runner */
function openCellValue(column,rawValue){
  $('dlg-t').textContent='';
  const title=document.createElement('span'); title.className='title'; title.textContent=column;
  const copy=document.createElement('button'); copy.type='button'; copy.className='iconbtn'; copy.id='copycell';
  copy.title=copy.ariaLabel='Copy cell value'; copy.innerHTML=icon('copy');
  $('dlg-t').append(title,copy);
  $('dlg-b').innerHTML='<pre id="cellbox"></pre>';
  const value=rawValue===null ? 'NULL' : String(rawValue);
  $('cellbox').textContent = value;
  $('dlg-f').innerHTML='<button value="cancel">Close</button>';
  $('copycell').onclick=async()=>{
    try{ await navigator.clipboard.writeText(value); toast('Cell value copied'); }
    catch{ toast('Could not copy cell value'); }
  };
  $('dlg').showModal();
}
rowsEl.addEventListener('dblclick', e=>{
  const td=e.target.closest('.td'); if(!td) return;
  const row=rowAt(+td.parentElement.dataset.i); if(!row) return;
  const c=+td.dataset.c; openCellValue(S.cols[c],row[c]);
});
for(const table of document.querySelectorAll('.detail-grid')) table.tBodies[0].addEventListener('dblclick',e=>{
  const td=e.target.closest('td'); if(!td || td.classList.contains('empty-detail')) return;
  const column=table.tHead.rows[0].cells[td.cellIndex]?.textContent||'Value';
  openCellValue(column,td.classList.contains('null')?null:td.textContent);
});

/* ---------------- filter ---------------- */
const OPS={'=':'=','≠':'<>','>':'>','<':'<','≥':'>=','≤':'<=','LIKE':'LIKE','ILIKE':'ILIKE',
           'IS NULL':'IS NULL','IS NOT NULL':'IS NOT NULL'};
function filterOperators(){
  const type=(S.meta?.columns.find(c=>c.name===$('fcol').value)?.type||'').toLowerCase();
  if(/char|text|citext/.test(type)) return ['=','≠','LIKE','ILIKE','IS NULL','IS NOT NULL'];
  if(/int|numeric|decimal|real|double|serial|date|time|timestamp|interval|money/.test(type))
    return ['=','≠','>','<','≥','≤','IS NULL','IS NOT NULL'];
  return ['=','≠','IS NULL','IS NOT NULL'];
}
function drawFilterOps(keep=true){
  const previous=keep ? $('fop').value : S.filterApplied.op;
  const choices=filterOperators();
  $('fop').innerHTML=choices.map(op=>`<option>${op}</option>`).join('');
  $('fop').value=choices.includes(previous) ? previous : choices[0];
  const noValue=$('fop').value.startsWith('IS ');
  $('fval').disabled=noValue; $('fval').placeholder=noValue?'No value required':'Filter value';
}
function filterChanged(){
  return $('fcol').value!==S.filterApplied.col || $('fop').value!==S.filterApplied.op ||
    $('fval').value!==S.filterApplied.val;
}
function drawFilterActions(){
  $('fgo').hidden=$('fclr').hidden=!(filterChanged() || S.where);
}
$('fcol').onchange=()=>{ drawFilterOps(); drawFilterActions(); };
$('fop').onchange=()=>{ drawFilterOps(); drawFilterActions(); };
$('fval').oninput=drawFilterActions;
$('fgo').onclick = async () => {
  const col=$('fcol').value, op=OPS[$('fop').value], val=$('fval').value;
  if(!col) return;
  const previous=S.where;
  S.where = !val && !op.startsWith('IS') ? '' : op.startsWith('IS') ? `"${col}" ${op}`
          : `"${col}" ${op} '${String(val).replace(/'/g,"''")}'`;
  if(await applyFilter()){
    S.filterApplied={col,op:$('fop').value,val}; drawFilterActions();
  }else S.where=previous;
};
$('fclr').onclick = async () => {
  if(filterChanged()){
    $('fcol').value=S.filterApplied.col; drawFilterOps(false);
    $('fop').value=S.filterApplied.op; drawFilterOps();
    $('fval').value=S.filterApplied.val; drawFilterActions();
    return;
  }
  if(S.where){
    S.where=''; $('fval').value='';
    if(await applyFilter()) S.filterApplied={col:$('fcol').value,op:$('fop').value,val:''};
    drawFilterActions();
  }
};
async function applyFilter(){
  S.chunks.clear(); S.pending.clear(); lastFirst=-1;
  try{
    const first = await api({action:'rows', table:S.table, pk:S.pk,
                             limit:CHUNK, where:S.where||undefined});
    S.chunks.set(0, first.rows);
    S.total = first.rows.length;
    $('ftxt').textContent = `${first.rows.length} ${first.rows.length===1?'row':'rows'} fetched`;
    buildGrid(); vp.scrollTop=0; render(true);
    return true;
  }catch(err){ alertBox('Filter failed', err.message); return false; }
}
$('fval').onkeydown = e => { if(e.key==='Enter') $('fgo').click(); };

/* ---------------- query ---------------- */
function mountGrid(host){
  if(vp.parentElement!==host) host.append(vp, $('empty'));
}
function setExports(on){
  for(const b of document.querySelectorAll('#qbar .export')) b.disabled=!on;
}
function exportResult(format){
  if(!S.local) return;
  const objects=S.local.map(row=>Object.fromEntries(S.cols.map((col,i)=>[col,row[i]])));
  let text, type;
  if(format==='json'){
    text=JSON.stringify(objects,null,2); type='application/json';
  }else if(format==='csv'){
    const cell=value=>'"'+String(value??'').replace(/"/g,'""')+'"';
    text=[S.cols.map(cell),...S.local.map(row=>row.map(cell))].map(row=>row.join(',')).join('\r\n');
    type='text/csv';
  }else{
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
    text='<?xml version="1.0" encoding="UTF-8"?>\n<rows>\n'+objects.map(row=>'  <row>\n'+
      Object.entries(row).map(([name,value])=>`    <column name="${esc(name)}"${value===null?' null="true"':''}>${value===null?'':esc(value)}</column>`).join('\n')+
      '\n  </row>').join('\n')+'\n</rows>\n';
    type='application/xml';
  }
  const url=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='query-result.'+format; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),0);
}
for(const b of document.querySelectorAll('#qbar .export')) b.onclick=()=>exportResult(b.dataset.format);
const streamSize=bytes=>bytes<1024 ? `${bytes} B` : bytes<1048576 ? `${(bytes/1024).toFixed(1)} KB` : `${(bytes/1048576).toFixed(1)} MB`;
async function streamQuery(confirmed=false){
  const sql=$('sql').value.trim(); if(!sql) return;
  const normalized=sql.toLowerCase().replace(/\s+/g,' ').trim();
  if(!S.readOnly && !confirmed && (normalized.startsWith('truncate') || normalized.startsWith('drop ') ||
     ((normalized.startsWith('update ') || normalized.startsWith('delete ')) && !normalized.includes(' where ')))){
    $('dlg-t').textContent='Stream unbounded query';
    $('dlg-b').textContent='This query can affect every row. Execute it and stream returned rows?';
    $('dlg-f').innerHTML='<button value="cancel">Cancel</button><button class="primary" id="streamyes">Execute and stream</button>';
    $('dlg').showModal();
    $('streamyes').onclick=e=>{ e.preventDefault(); $('dlg').close(); streamQuery(true); };
    return;
  }
  let writable=null, chunks=[];
  if('showSaveFilePicker' in window){
    try{
      const handle=await window.showSaveFilePicker({suggestedName:'query-result-all.csv',types:[{description:'CSV file',accept:{'text/csv':['.csv']}}]});
      writable=await handle.createWritable();
    }catch(err){ if(err.name==='AbortError') return; alertBox('Stream failed',err.message); return; }
  }
  $('stream').disabled=true; $('streamprogress').hidden=false; $('streambar').removeAttribute('value');
  $('streammsg').textContent='Starting…';
  let bytes=0;
  try{
    const response=await fetch('/pgweb',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'stream',sql,is_confirmed:confirmed?1:0,is_read_only:S.readOnly?1:0})});
    if(!response.ok){
      let message=response.statusText||'stream failed';
      try{ const body=await response.json(); message=String(body?.message??body?.detail??message); }catch{}
      throw new Error(message);
    }
    const reader=response.body.getReader();
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      bytes+=value.byteLength; $('streammsg').textContent=streamSize(bytes);
      if(writable) await writable.write(value); else chunks.push(value);
    }
    if(writable) await writable.close();
    else{
      const url=URL.createObjectURL(new Blob(chunks,{type:'text/csv;charset=utf-8'}));
      const a=document.createElement('a'); a.href=url; a.download='query-result-all.csv'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),0); chunks=[];
    }
    $('streambar').value=1; $('streammsg').textContent=`${streamSize(bytes)} downloaded`;
    toast('CSV download complete');
  }catch(err){
    if(writable) try{ await writable.abort(); }catch{}
    $('streammsg').textContent='Download failed'; alertBox('Stream failed',err.message);
  }finally{
    $('stream').disabled=!S.connected;
    setTimeout(()=>$('streamprogress').hidden=true,1200);
  }
}
$('stream').onclick=()=>streamQuery(false);
async function runQuery(confirmed){
  const sql=$('sql').value.trim(); if(!sql) return;
  $('run').disabled=true; $('qmsg').className=''; $('qmsg').textContent='running…';
  const t0=performance.now();
  try{
    const m = await api({action:'query', sql, is_confirmed: confirmed?1:0,
                         is_read_only:S.readOnly?1:0});
    S.local=m.rows; S.cols=m.cols; S.total=m.rows.length; S.pk=null;
    S.chunks.clear(); lastFirst=-1;
    $('tools').style.display='none';       // column filters belong to a table, not a result set
    mountGrid($('qres'));
    buildGrid(); vp.scrollTop=0; render(true);
    for(const t of document.querySelectorAll('.tab')) t.hidden = t.dataset.v!=='query';
    show('query');
    const elapsed=(performance.now()-t0).toFixed(1);
    const count=m.rows.length.toLocaleString();
    $('qmsg').textContent = `${m.truncated ? count+'+ rows · showing first '+count : count+' rows'} · ${elapsed} ms`;
    setExports(true); drawResetSql();
  }catch(err){
    if(err.message.includes('unbounded_write')){
      $('qmsg').textContent='';
      $('dlg-t').textContent='Unbounded write';
      $('dlg-b').textContent='This statement has no WHERE clause and will affect every row. Run it?';
      $('dlg-f').innerHTML='<button value="cancel">Cancel</button><button class="primary" id="yes">Run anyway</button>';
      $('dlg').showModal();
      $('yes').onclick=ev=>{ ev.preventDefault(); $('dlg').close(); runQuery(true); };
    } else {
      $('qmsg').className='err';
      $('qmsg').textContent = S.readOnly && /read.only|read-only/i.test(err.message)
        ? 'Blocked by read-only mode' : err.message;
    }
  } finally { $('run').disabled = !S.connected; }
}
$('run').onclick = ()=>runQuery(false);
$('resetsql').onclick = ()=>{
  $('sql').value=DEFAULT_SQL; S.queryCleared=false;
  S.local=null; S.cols=[]; S.total=0; S.chunks.clear(); lastFirst=-1; pool=[];
  headEl.textContent=''; rowsEl.textContent=''; inner.style.width=''; canvas.style.height='0'; vp.scrollTop=0; vp.scrollLeft=0;
  $('empty').classList.remove('on'); $('qmsg').textContent=''; $('qmsg').className='';
  setExports(false); drawResetSql(); updateSqlHighlight(); $('sql').focus();
};
async function explainQuery(analyze=false){
  const sql = $('sql').value.trim(); if(!sql) return;
  $('explain').disabled=$('analyze').disabled=true;
  $('qmsg').className=''; $('qmsg').textContent=analyze?'analyzing…':'planning…';
  const t0=performance.now();
  try{
    const m = await api({action:'query', sql:(analyze?'EXPLAIN ANALYZE ':'EXPLAIN ')+sql, is_read_only:S.readOnly?1:0});
    S.local=m.rows; S.cols=m.cols; S.total=m.rows.length; S.pk=null; S.chunks.clear(); lastFirst=-1;
    $('tools').style.display='none';
    mountGrid($('qres'));
    buildGrid(); vp.scrollTop=0; render(true);
    for(const t of document.querySelectorAll('.tab')) t.hidden = t.dataset.v!=='query';
    show('query');
    $('qmsg').textContent = `${m.rows.length} lines · ${(performance.now()-t0).toFixed(1)} ms`;
    setExports(true); drawResetSql();
  }catch(err){
    $('qmsg').className='err';
    $('qmsg').textContent = S.readOnly && /read.only|read-only/i.test(err.message) ? 'Blocked by read-only mode' : err.message;
  }finally{
    $('explain').disabled=$('analyze').disabled=!S.connected;
  }
}
$('explain').onclick = ()=>explainQuery(false);
$('analyze').onclick = () => {
  if(!$('sql').value.trim()) return;
  $('dlg-t').textContent='Analyze query';
  $('dlg-b').textContent='EXPLAIN ANALYZE executes the SQL before showing actual timing and row counts. For write statements, database changes will occur. Continue?';
  $('dlg-f').innerHTML='<button value="cancel">Cancel</button><button class="primary" id="analyzeyes">Analyze query</button>';
  $('dlg').showModal();
  $('analyzeyes').onclick=e=>{ e.preventDefault(); $('dlg').close(); explainQuery(true); };
};
$('sql').addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); runQuery(false); }
  if(e.key==='Tab'){ e.preventDefault(); const s=e.target.selectionStart;
    e.target.setRangeText('  ', s, e.target.selectionEnd, 'end'); updateSqlHighlight(); }
});
$('sql').addEventListener('input', ()=>{
  S.queryCleared=!$('sql').value.trim(); drawResetSql(); updateSqlHighlight();
});
$('sql').addEventListener('scroll',()=>{
  $('sqlhl').scrollTop=$('sql').scrollTop; $('sqlhl').scrollLeft=$('sql').scrollLeft;
},{passive:true});
addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter' && document.activeElement!==$('sql')){
    e.preventDefault(); openRunner();
  }
});

/* ---------------- chrome ---------------- */
function show(v){
  for(const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.v===v);
  for(const x of document.querySelectorAll('.view')) x.classList.toggle('on', x.id==='v-'+v);
  $('status').hidden = true;
  if(v==='rows'){
    $('tools').style.display = S.local ? 'none' : 'flex';
    if(S.cols.length){ lastFirst=-1; render(true); }
  }
  if(DETAILS.includes(v)) loadDetail(v);
}
for(const t of document.querySelectorAll('.tab')) t.onclick = ()=>show(t.dataset.v);
// re-reads the object list too, so DDL run in the query runner shows up without a page reload
$('reload').onclick = async () => {
  try{
    const m = await api({action:'schema'});
    S.tree = m.tree; drawTree();
    if(S.table && (S.tree.public||{})[S.kind]?.some(o=>o.name===S.table)) await openObject(S.table, S.kind);
    else if(S.table) openRunner();      // the table went away
    toast('Schema refreshed');
  }catch(e){ alertBox('Refresh failed', e.message); }
};
$('dbinfo').onclick = async () => {
  $('dbinfo').disabled=true;
  $('runner').classList.remove('on');
  for(const el of document.querySelectorAll('.obj.on')) el.classList.remove('on');
  S.table=''; S.kind='';
  $('st-obj').textContent=''; $('st-rows').textContent=''; $('st-size').textContent='';
  for(const t of document.querySelectorAll('.tab')) t.hidden = t.dataset.v!=='info';
  show('info');
  const body=$('dbinfo-table').tBodies[0];
  body.innerHTML='<tr><td>Loading database info…</td></tr>';
  try{
    const m=await api({action:'info'});
    const labels={connection_url:'Connection URL',database:'Database',schema_scope:'Schema scope',user_name:'User',version:'PostgreSQL version',
      database_size:'Database size',encoding:'Encoding',collation:'Collation',time_zone:'Time zone',tables:'Tables',
      views:'Views',materialized_views:'Materialized views',indexes:'Indexes',sequences:'Sequences',
      functions:'Functions',procedures:'Procedures',triggers:'Triggers'};
    body.textContent='';
    for(const [key,label] of Object.entries(labels)){
      if(key==='tables'){
        const section=document.createElement('tr'), heading=document.createElement('th');
        section.className='section'; heading.colSpan=2;
        heading.textContent='Public schema objects (excluding extensions and internal objects)';
        section.appendChild(heading); body.appendChild(section);
      }
      const tr=document.createElement('tr'), th=document.createElement('th'), td=document.createElement('td');
      th.textContent=label; td.textContent=m[key] ?? '—'; tr.append(th,td); body.appendChild(tr);
    }
  }catch(e){ body.innerHTML='<tr><td></td></tr>'; body.rows[0].cells[0].textContent='Error: '+e.message; }
  finally{ $('dbinfo').disabled=false; }
};
function alertBox(title, msg){
  $('dlg-t').textContent=title; $('dlg-b').innerHTML='<pre id="cellbox"></pre>';
  $('cellbox').textContent=msg;
  $('dlg-f').innerHTML='<button value="cancel">Close</button>'; $('dlg').showModal();
}

/* the server holds one connection, so a reload just picks it back up */
(async function boot(){
  try{
    const m = await api({action:'schema'});          // one call: tree + database name
    S.tree=m.tree; S.db=m.database;
    setConnected(true); drawTree(); openRunner();
  }catch{ setConnected(false); }                     // shell stays, just empty
})();
</script>
