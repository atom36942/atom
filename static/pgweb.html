<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>pgweb</title>
<style>
/* palette from pgweb's own app.css: #79589f chrome, #7eb54e primary, #f9f9f9 sidebar,
   #ffe row hover, #3874d7 selection, #bbb nulls */
:root{
  color-scheme:light;
  --nav:#79589f; --nav-fg:#d6cce2; --nav-on-bg:#fff; --nav-on-fg:#000;
  --side:#f9f9f9; --bg:#fff; --fg:#3a3633; --dim:#aaa; --line:#ddd;
  --th-fg:#333; --th-line:#eae9e9; --th-hover:#fafafa;
  --row-odd:#f9f9f9; --row-even:#fff; --row-line:#f2f2f2; --row-hover:#ffe;
  --sel:#3874d7; --sel-fg:#fff; --null:#bbb; --hl:#f1f1f1;
  --green:#7eb54e; --green-h:#64903e; --err:#c0392b;
  --row-h:30px; --bar-h:50px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --nav:#79589f; --nav-fg:#d6cce2; --nav-on-bg:#141419; --nav-on-fg:#f2f0ee;
  --side:#191920; --bg:#141419; --fg:#d9d5d1; --dim:#7a7a84; --line:#2e2e37;
  --th-fg:#cfcac5; --th-line:#2e2e37; --th-hover:#20202a;
  --row-odd:#191920; --row-even:#141419; --row-line:#22222b; --row-hover:#2a2a1c;
  --sel:#3874d7; --sel-fg:#fff; --null:#66666f; --hl:#24242e;
  --green:#8fc95f; --green-h:#a5d977; --err:#f2645a;
}
/* light is the default regardless of OS preference — dark is opt-in via the toggle */

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);display:flex;
  font:13px/1.42857143 "Helvetica Neue",Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:4px 11px;
  cursor:pointer;color:var(--fg)}
button:hover:not(:disabled){border-color:#8a8a8a;background:var(--hl)}
button:disabled{opacity:.45;cursor:default}
button.primary{border-color:var(--green);color:var(--green)}
button.primary:hover:not(:disabled){border-color:var(--green-h);color:var(--green-h);background:var(--bg)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:3px;
  padding:4px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#999}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#c7c7c7;border-radius:6px;border:3px solid var(--bg)}
:root[data-theme=dark] ::-webkit-scrollbar-thumb{background:#3a3a45}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}

/* ---------- shell: always present, empty until connected ---------- */
#app{display:flex;flex:1;min-width:0}
#side{width:250px;flex:0 0 250px;background:var(--side);display:flex;flex-direction:column;min-height:0}
#dbline{height:var(--bar-h);flex:none;background:var(--nav);color:#fff;
  display:flex;justify-content:flex-start;align-items:center;padding:0 12px;min-width:0}
#productname{font-size:15px;font-weight:700;letter-spacing:-.15px;line-height:18px}
#runner{height:32px;flex:none;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);
  font-size:12px;font-weight:600;cursor:pointer}
#runner[hidden]{display:none}
#runner:hover{background:var(--hl)}
#runner.on{background:var(--sel);color:#fff;border-bottom-color:var(--sel)}

#side .search{padding:8px;position:relative}
#side .search input{width:100%;font-size:12px;padding:4px 24px 4px 8px}
#qclr{position:absolute;right:13px;top:12px;width:18px;height:18px;padding:0;line-height:15px;
  text-align:center;border-radius:50%;font-size:14px;color:var(--dim);border-color:transparent;background:transparent}
#qclr:hover:not(:disabled){background:var(--hl);color:var(--fg);border-color:transparent}
#qclr[hidden]{display:none}
#tree{flex:1;overflow:auto;padding-bottom:8px;font-size:12px}
.obj{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;cursor:pointer;white-space:nowrap}
.obj[hidden]{display:none}   /* author display:flex would otherwise beat the UA [hidden] rule */
.obj:hover{background:var(--hl)}
.obj.on{background:var(--sel);color:#fff;font-weight:bold}
.obj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.obj .ct{color:var(--dim);font-size:11px;flex:none;font-weight:normal}
.obj.on .ct{color:#cfe0fb}

#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{height:var(--bar-h);flex:none;display:flex;align-items:stretch;background:var(--nav);overflow:visible;position:relative;z-index:10}
.tab{padding:0 14px;line-height:var(--bar-h);font-size:13px;font-weight:500;color:var(--nav-fg);
  cursor:pointer;margin:0 1px;flex:none;white-space:nowrap}
.tab[hidden]{display:none}
.tab:hover{color:#fff}
.tab.on{background:var(--nav-on-bg);color:var(--nav-on-fg);margin:0}
#tabs .sp{flex:1}
#tabs > button,#tabs > #optionswrap > button{align-self:center;background:transparent;color:#fff;border-color:rgba(255,255,255,.6);
  margin-right:8px;font-size:12px;flex:none;white-space:nowrap}
#tabs > button:hover:not(:disabled),#tabs > #optionswrap > button:hover:not(:disabled){background:#fff;color:var(--nav);border-color:#fff}
#optionswrap{align-self:stretch;display:flex;align-items:center;position:relative;flex:none}
#optionswrap[hidden]{display:none}
#optionsmenu{position:absolute;right:8px;top:42px;width:164px;padding:5px;background:var(--bg);border:1px solid var(--line);
  border-radius:4px;box-shadow:0 5px 18px rgba(0,0,0,.22);display:flex;flex-direction:column;z-index:30}
#optionsmenu[hidden]{display:none}
#optionsmenu button{width:100%;padding:7px 9px;margin:0;border:0;background:transparent;color:var(--fg);
  text-align:left;font-size:12px;white-space:nowrap}
#optionsmenu button:hover:not(:disabled){background:var(--hl);border-color:transparent}
#optionsmenu #readonly.on{color:var(--green)}
#optionsmenu #readonly.off{color:var(--err)}

#tools{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--th-line)}
#tools select,#tools input{padding:3px 7px;font-size:12px}
#fval{width:180px}
#tools .sp{flex:1}
#ftxt{color:#888;font-size:12px}

#pane{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}

/* ---------- virtual grid ---------- */
/* contain must not include size here: #rows is absolutely positioned and shrink-to-fit,
   so size-contained rows would measure as empty and collapse to zero width */
#vp{flex:1;overflow:auto;position:relative;contain:layout paint;font-size:12px}
#inner{position:relative}
#head{position:sticky;top:0;z-index:3;display:flex;background:var(--bg);border-bottom:1px solid var(--th-line);border-left:1px solid var(--th-line)}
.th{flex:none;padding:0 9px;height:29px;line-height:29px;font-weight:bold;color:var(--th-fg);
    position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;user-select:none;border-right:1px solid var(--th-line)}
.th:hover{background:var(--th-hover)}
.th .grip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize}
.th .grip:hover{background:var(--nav)}
#canvas{position:relative}
#rows{position:absolute;top:0;left:0;width:100%;will-change:transform}
.tr{display:flex;height:var(--row-h);contain:layout paint;background:var(--row-even);
    border-bottom:1px solid var(--row-line)}
.tr[hidden]{display:none}   /* same [hidden] vs display:flex trap as .obj */
.tr:nth-child(odd){background:var(--row-odd)}
.tr:hover{background:var(--row-hover)}
.td{flex:none;padding:0 9px;height:29px;line-height:29px;color:var(--fg);
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--row-line)}
.td:first-child{border-left:1px solid var(--row-line)}
.td.null{color:var(--null);text-transform:uppercase}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim)}
#empty.on{display:flex}

/* ---------- detail panes ---------- */
.pre{flex:1;overflow:auto;margin:10px;padding:14px 16px;border:1px solid var(--th-line);white-space:pre;color:var(--fg);
     font:12px/1.7 Menlo,Monaco,Consolas,"Courier New",monospace}
.pre .muted{color:var(--dim)}

/* ---------- query ---------- */
#sql{height:210px;flex:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
     padding:12px 14px;resize:vertical;background:var(--bg);tab-size:2;
     font:12.5px/1.7 Menlo,Monaco,Consolas,"Courier New",monospace}
#qbar{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--th-line)}
#explainwrap{position:relative}
#explainmenu{position:absolute;left:0;top:34px;z-index:20;width:150px;padding:5px;background:var(--bg);
  border:1px solid var(--line);border-radius:4px;box-shadow:0 5px 18px rgba(0,0,0,.22);display:flex;flex-direction:column}
#explainmenu[hidden]{display:none}
#explainmenu button{width:100%;padding:7px 9px;border:0;background:transparent;text-align:left;white-space:nowrap}
#explainmenu button:hover:not(:disabled){background:var(--hl);border-color:transparent}
#qmsg{color:#888;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qmsg.err{color:var(--err)}
#qres{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}

/* ---------- status ---------- */
#status{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 11px;
        border-top:1px solid var(--th-line);background:var(--side);color:#888;font-size:12px}
#status[hidden]{display:none}
#status .sp{flex:1}
#status b{color:var(--fg);font-weight:bold}
#status .t{color:var(--green)}

dialog{border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);padding:0;
       box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:min(640px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .hd{padding:12px 15px;border-bottom:1px solid var(--th-line);font-weight:bold;font-size:14px}
dialog .bd{padding:14px 15px;max-height:60vh;overflow:auto;font-size:12px}
dialog .ft{padding:10px 15px;border-top:1px solid var(--th-line);display:flex;gap:8px;justify-content:flex-end}
/* width:100% has no intrinsic size, so the dialog would shrink-wrap to nothing */
#dsn2{display:block;width:min(580px,82vw);min-height:39px;padding:9px 12px;resize:none;
      overflow-x:hidden;overflow-y:hidden;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13px;line-height:1.5;
      font-family:Menlo,Monaco,Consolas,"Courier New",monospace}
#derr{color:var(--err);margin-top:8px;min-height:16px;font-size:12px;white-space:pre-wrap}
#cellbox{white-space:pre-wrap;word-break:break-word;margin:0;
         font:12px/1.6 Menlo,Monaco,Consolas,"Courier New",monospace}
#v-info{overflow:auto;padding:16px}
#dbinfo-table{width:100%;max-width:760px;border-collapse:collapse;border:1px solid var(--th-line);font-size:12px}
#dbinfo-table th,#dbinfo-table td{padding:7px 9px;border:1px solid var(--th-line);text-align:left;vertical-align:top}
#dbinfo-table th{width:145px;color:var(--dim);font-weight:500;white-space:nowrap}
#dbinfo-table td{color:var(--fg);font-family:Menlo,Monaco,Consolas,"Courier New",monospace;word-break:break-word}
#dbinfo-table tr:last-child th,#dbinfo-table tr:last-child td{border-bottom:0}
#dbinfo-table .section th{width:auto;padding-top:13px;color:var(--fg);font-weight:700;background:var(--side)}
#toast{position:fixed;right:18px;bottom:18px;z-index:80;padding:7px 12px;
  border-radius:4px;background:#2f2d31;color:#fff;box-shadow:0 3px 14px rgba(0,0,0,.25);font-size:12px;
  pointer-events:none;white-space:nowrap}
#toast[hidden]{display:none}
</style>
</head>
<body>

<div id="app">
  <aside id="side">
    <div id="dbline">
      <span id="productname">pgweb</span>
    </div>
    <div id="runner" hidden>Query runner</div>
    <div class="search" id="tablesearch" hidden>
      <input id="q" placeholder="Search tables" autocomplete="off" spellcheck="false"/>
      <button id="qclr" title="Clear" hidden>×</button>
    </div>
    <div id="tree" hidden></div>
  </aside>

  <main id="main">
    <div id="tabs">
      <div class="tab" data-v="query" hidden>Query</div>
      <div class="tab" data-v="info" hidden>Database info</div>
      <div class="tab" data-v="rows" hidden>Rows</div>
      <div class="tab" data-v="struct" hidden>Structure</div>
      <div class="tab" data-v="indexes" hidden>Indexes</div>
      <div class="tab" data-v="constraints" hidden>Constraints</div>
      <div class="tab" data-v="triggers" hidden>Triggers</div>
      <div class="tab" data-v="policies" hidden>Policies</div>
      <div class="sp"></div>
      <div id="optionswrap" hidden>
        <button id="options" aria-expanded="false">Options ▾</button>
        <div id="optionsmenu" hidden>
          <button id="dbinfo">Database info</button>
          <button id="readonly" class="on" title="Queries run inside a PostgreSQL read-only transaction">Read only: On</button>
          <button id="reload" title="Re-read the public schema and current table">Refresh schema</button>
          <button id="theme" title="Use dark theme" aria-label="Use dark theme">Dark theme</button>
        </div>
      </div>
      <button id="connbtn">Connect</button>
    </div>

    <div id="pane" hidden>
      <div class="view" id="v-info"><table id="dbinfo-table"><tbody></tbody></table></div>
      <div class="view" id="v-rows">
        <div id="tools">
          <select id="fcol"></select>
          <select id="fop">
            <option>=</option><option>≠</option><option>&gt;</option><option>&lt;</option>
            <option>≥</option><option>≤</option><option>LIKE</option><option>ILIKE</option>
            <option>IS NULL</option><option>IS NOT NULL</option>
          </select>
          <input id="fval" placeholder="Filter value" autocomplete="off"/>
          <button id="fgo">Apply</button>
          <button id="fclr">Clear</button>
          <span class="sp"></span><span id="ftxt"></span>
        </div>
        <div id="vp"><div id="inner">
          <div id="head"></div>
          <div id="canvas"><div id="rows"></div></div>
        </div></div>
        <div id="empty">No rows</div>
      </div>
      <div class="view" id="v-struct"><pre class="pre" id="p-struct"></pre></div>
      <div class="view" id="v-indexes"><pre class="pre" id="p-indexes"></pre></div>
      <div class="view" id="v-constraints"><pre class="pre" id="p-constraints"></pre></div>
      <div class="view" id="v-triggers"><pre class="pre" id="p-triggers"></pre></div>
      <div class="view" id="v-policies"><pre class="pre" id="p-policies"></pre></div>
      <div class="view on" id="v-query">
        <textarea id="sql" spellcheck="false" placeholder="select * from test limit 10;"></textarea>
        <div id="qbar">
          <button class="primary" id="run">Run  ⌘⏎</button>
          <div id="explainwrap">
            <button id="explain" title="Explain or analyze the query" aria-expanded="false">Explain ▾</button>
            <div id="explainmenu" hidden>
              <button id="explainplan">Explain Query</button>
              <button id="analyze">Analyze Query</button>
            </div>
          </div>
          <span id="qmsg"></span>
        </div>
      </div>
    </div>

    <div id="status" hidden>
      <span id="st-obj"></span><span id="st-rows"></span><span id="st-size"></span>
      <span class="sp"></span><span id="st-time" class="t"></span>
    </div>
  </main>
</div>

<dialog id="dlg"><form method="dialog">
  <div class="hd" id="dlg-t"></div><div class="bd" id="dlg-b"></div>
  <div class="ft" id="dlg-f"></div>
</form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
const ROW_H = 30, CHUNK = 1000, SIDE_BATCH = 200, OVER = 6, MAXW = 440, MINW = 64;   /* 29px cell + 1px rule; matches --row-h */
// browsers clamp element height near 2^24 px; past that the spacer stops growing and the
// tail of a big table becomes unreachable, so the scrollbar is scaled instead of 1:1
const MAXH = 16000000;
const $ = s => document.getElementById(s);
const vp=$('vp'), inner=$('inner'), headEl=$('head'), canvas=$('canvas'), rowsEl=$('rows');
const DETAILS = ['indexes','constraints','triggers','policies'];

const S = { db:'', table:'', kind:'', pk:null, cols:[], widths:[], total:0,
            chunks:new Map(), pending:new Map(), local:null, where:'', meta:null, tree:{},
            viewPx:0, scale:1, loaded:{}, connected:false,
            readOnly:localStorage.getItem('pgweb.readOnly') === '1', sideItems:[], sideShown:0 };
let pool=[], lastFirst=-1, ticking=false;
let toastTimer;

function toast(message){
  clearTimeout(toastTimer); $('toast').textContent=message; $('toast').hidden=false;
  toastTimer=setTimeout(()=>$('toast').hidden=true, 2200);
}

// Native dialogs close on Escape but not on backdrop clicks by default.
$('dlg').addEventListener('click', e => {
  if(e.target !== $('dlg')) return;
  const r=$('dlg').getBoundingClientRect();
  if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom) $('dlg').close();
});

/* ---------------- api ---------------- */
async function api(body){
  const t0 = performance.now();
  const r = await fetch('/pgweb', {method:'POST', headers:{'Content-Type':'application/json'},
                                   body:JSON.stringify(body)});
  let j; try{ j = await r.json(); }catch{ throw new Error('bad response from server'); }
  const ms = performance.now() - t0;
  if(!r.ok || j.status !== 1){
    const msg = String(j?.message ?? j?.detail ?? r.statusText ?? 'request failed');
    if(msg.includes('not_connected')){ disconnected(); throw new Error('not_connected'); }
    throw new Error(msg);
  }
  $('st-time').textContent = ms.toFixed(1)+' ms';
  return j.message;
}
/* ---------------- theme ---------------- */
(function theme(){
  document.documentElement.dataset.theme = localStorage.getItem('pgweb.theme') || 'light';
  const draw = () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    $('theme').textContent = dark ? 'Light theme' : 'Dark theme';
    $('theme').title = $('theme').ariaLabel = dark ? 'Use light theme' : 'Use dark theme';
  };
  draw();
  $('theme').onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('pgweb.theme', next);
    draw();
    toast(next === 'dark' ? 'Dark theme enabled' : 'Light theme enabled');
  };
})();

/* ---------------- query safety ---------------- */
function drawReadOnly(){
  const b=$('readonly');
  b.textContent = `Read only: ${S.readOnly ? 'On' : 'Off'}`;
  b.className = S.readOnly ? 'on' : 'off';
  b.title = S.readOnly
    ? 'Queries run inside a PostgreSQL read-only transaction'
    : 'Write queries are allowed';
}
$('readonly').onclick = () => {
  const next=!S.readOnly;
  $('dlg-t').textContent = next ? 'Enable read-only mode' : 'Allow database writes';
  $('dlg-b').textContent = next
    ? 'Queries will run inside a PostgreSQL read-only transaction. INSERT, UPDATE, DELETE, and DDL will be blocked.'
    : 'Full CRUD and DDL will be allowed in the query runner. Continue?';
  $('dlg-f').innerHTML = `<button value="cancel">Cancel</button><button class="primary" id="modeyes">${next?'Enable read only':'Allow writes'}</button>`;
  $('dlg').showModal();
  $('modeyes').onclick = e => {
    e.preventDefault(); S.readOnly=next;
    localStorage.setItem('pgweb.readOnly', S.readOnly ? '1' : '0');
    drawReadOnly(); $('dlg').close();
    toast(S.readOnly ? 'Read-only mode enabled' : 'Writes enabled');
  };
};
drawReadOnly();

/* ---------------- options menu ---------------- */
$('options').onclick = e => {
  e.stopPropagation();
  const open=$('optionsmenu').hidden;
  $('optionsmenu').hidden=!open;
  $('options').ariaExpanded=String(open);
};
$('optionsmenu').onclick = e => {
  if(e.target.closest('button')){
    $('optionsmenu').hidden=true;
    $('options').ariaExpanded='false';
  }
};
document.addEventListener('click', e => {
  if(!$('optionswrap').contains(e.target)){
    $('optionsmenu').hidden=true;
    $('options').ariaExpanded='false';
  }
  if(!$('explainwrap').contains(e.target)){
    $('explainmenu').hidden=true;
    $('explain').ariaExpanded='false';
  }
});

/* ---------------- connect ---------------- */
// the shell is always on screen; connection state only decides what's in it
function setConnected(on){
  S.connected = on;
  $('connbtn').textContent = on ? 'Disconnect' : 'Connect';
  $('connbtn').title = on ? 'Disconnect from this database' : 'Connect to a database';
  $('optionswrap').hidden = !on;
  $('optionsmenu').hidden = true;
  $('options').ariaExpanded = 'false';
  $('pane').hidden = !on;
  $('status').hidden = !on;
  $('runner').hidden = !on;
  $('tablesearch').hidden = !on;
  $('tree').hidden = !on;
  $('reload').disabled = !on;
  $('run').disabled = $('explain').disabled = $('explainplan').disabled = $('analyze').disabled = $('sql').disabled = !on;
  if(!on){
    S.tree={}; S.chunks.clear(); S.pending.clear();
    S.local=null; S.table=''; S.kind=''; S.cols=[]; S.total=0; lastFirst=-1;
    $('tree').textContent=''; $('q').value=''; $('qclr').hidden=true;
    $('tools').style.display='none';
    for(const t of document.querySelectorAll('.tab')) t.hidden = true;
    show('query');
    headEl.textContent=''; rowsEl.textContent=''; pool=[];
    $('empty').textContent='Not connected'; $('empty').classList.add('on');
    for(const id of ['st-obj','st-rows','st-size','st-time']) $(id).textContent='';
  }else{
    $('empty').classList.remove('on'); $('empty').textContent='No rows';
  }
}
async function doConnect(dsn){
  const m = await api({action:'connect', dsn});
  S.db = m.database; S.tree = m.tree;
  localStorage.setItem('pgweb.dsn', dsn);
  setConnected(true);
  drawTree(); openRunner();
}
function disconnected(){ setConnected(false); }

$('connbtn').onclick = () => S.connected ? askDisconnect() : askConnect();

function askConnect(){
  $('dlg-t').textContent = 'Connect to a database';
  $('dlg-b').innerHTML =
    '<textarea id="dsn2" rows="1" wrap="soft" placeholder="postgresql://localhost:5432/postgres" autocomplete="off" spellcheck="false"></textarea>'
    + '<div id="derr"></div>';
  $('dlg-f').innerHTML = '<button value="cancel">Cancel</button><button class="primary" id="dgo">Connect</button>';
  $('dlg').showModal();
  const inp = $('dsn2');
  const fit = () => { inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight+2,160)+'px'; };
  inp.value = localStorage.getItem('pgweb.dsn') || 'postgresql://localhost:5432/postgres'; fit();
  inp.oninput = fit; inp.focus(); inp.select();
  const go = async ev => {
    ev?.preventDefault();
    const dsn = inp.value.trim(); if(!dsn) return;
    $('dgo').disabled = inp.disabled = true; $('derr').textContent = 'connecting…';
    try{ await doConnect(dsn); $('dlg').close(); }
    catch(e){ $('derr').textContent = e.message; }
    finally{ $('dgo').disabled = inp.disabled = false; }
  };
  $('dgo').onclick = go;
  inp.onkeydown = e => { if(e.key==='Enter') go(e); };
}

function askDisconnect(){
  $('dlg-t').textContent = 'Disconnect';
  $('dlg-b').textContent = `Disconnect from ${S.db}? Any unsaved query text stays in the editor.`;
  $('dlg-f').innerHTML = '<button value="cancel">Cancel</button><button class="primary" id="dyes">Disconnect</button>';
  $('dlg').showModal();
  $('dyes').onclick = async ev => {
    ev.preventDefault(); $('dlg').close();
    try{ await api({action:'disconnect'}); }catch{}
    setConnected(false);
  };
}

/* ---------------- sidebar ---------------- */
// All public table names stay in memory; DOM rows are appended in small batches.
function drawTree(){
  S.sideItems=((S.tree.public||{}).table||[]).map(o=>o.name).sort((a,b)=>a.localeCompare(b));
  renderTreeBatch(true);
}
function renderTreeBatch(reset=false){
  const box=$('tree'), term=$('q').value.trim().toLowerCase();
  const matches=term ? S.sideItems.filter(name=>name.toLowerCase().includes(term)) : S.sideItems;
  if(reset){ box.textContent=''; S.sideShown=0; }
  const next=matches.slice(S.sideShown, S.sideShown+SIDE_BATCH);
  const frag = document.createDocumentFragment();
  for(const name of next){
    const d = document.createElement('div'); d.className='obj'+(S.table===name?' on':'');
    d.dataset.table=name; d.dataset.kind='table';
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=name; nm.title=name;
    d.appendChild(nm);
    d.onclick=()=>openObject(name, 'table');
    frag.appendChild(d);
  }
  S.sideShown+=next.length; box.appendChild(frag);
  if(reset && !matches.length){
    const empty=document.createElement('div'); empty.className='obj'; empty.style.cssText='color:var(--dim);cursor:default';
    empty.textContent=term?'No matching tables':'No tables in public'; box.appendChild(empty);
  }
}
function searchTables(){
  const term = $('q').value.trim().toLowerCase();
  $('qclr').hidden = !term;
  renderTreeBatch(true);
}
$('tree').addEventListener('scroll', () => {
  const box=$('tree');
  if(box.scrollTop+box.clientHeight >= box.scrollHeight-60) renderTreeBatch();
}, {passive:true});
$('q').oninput = searchTables;
$('q').onkeydown = e => { if(e.key==='Escape'){ $('q').value=''; searchTables(); } };
$('qclr').onclick = () => { $('q').value=''; searchTables(); $('q').focus(); };

/* ---------------- query runner (the default view) ---------------- */
function openRunner(){
  for(const el of document.querySelectorAll('.obj.on')) el.classList.remove('on');
  $('runner').classList.add('on');
  S.table=''; S.kind='';
  for(const t of document.querySelectorAll('.tab')) t.hidden = t.dataset.v!=='query';
  show('query');
  $('st-obj').textContent=''; $('st-rows').textContent=''; $('st-size').textContent='';
  $('sql').focus();
}
$('runner').onclick = openRunner;

/* ---------------- open a table ---------------- */
async function openObject(table, kind){
  $('runner').classList.remove('on');
  for(const el of document.querySelectorAll('.obj.on')) el.classList.remove('on');
  document.querySelector(`.obj[data-table="${table}"]`)?.classList.add('on');
  S.table=table; S.kind=kind; S.where=''; S.local=null; S.loaded={};
  S.chunks.clear(); S.pending.clear(); lastFirst=-1;
  $('fval').value=''; $('ftxt').textContent='';
  localStorage.setItem('pgweb.last', JSON.stringify({table,kind}));
  for(const t of document.querySelectorAll('.tab')) t.hidden = t.dataset.v==='query'||t.dataset.v==='info';

  const m = await api({action:'rows', table, limit:CHUNK, is_meta:1});
  S.cols=m.cols; S.meta=m.meta; S.pk=m.meta.pk;
  S.total = m.rows.length;
  S.chunks.set(0, m.rows);

  $('p-struct').textContent = m.meta.columns.map(c =>
    `${c.name.padEnd(30)}${c.type}${c.nullable?'':'  NOT NULL'}${c.default_value?'  DEFAULT '+c.default_value:''}`).join('\n');
  for(const p of DETAILS) $('p-'+p).textContent = '';
  $('fcol').innerHTML = S.cols.map(c=>`<option>${c}</option>`).join('');
  $('st-obj').innerHTML = `<b>${table}</b>`;
  $('st-rows').textContent = `${m.rows.length} rows loaded`;
  $('st-size').textContent = m.meta.stats.total_size || '';
  buildGrid(); vp.scrollTop=0; render(true);
  show('rows');
}

/* per-table detail: one request, only when its tab is first opened */
async function loadDetail(part){
  if(S.loaded[part] || !S.table) return;
  S.loaded[part] = true;
  const el = $('p-'+part);
  el.textContent = 'loading…';
  try{
    const m = await api({action:'detail', table:S.table, part});
    if(!m.rows.length){ el.textContent = `(no ${part})`; return; }
    if(part==='indexes')      el.textContent = m.rows.map(r=>r.def).join('\n\n');
    // pg_get_constraintdef already starts with the kind, so don't print it twice
    else if(part==='constraints') el.textContent = m.rows.map(r=>`${r.name}\n  ${r.def}`).join('\n\n');
    else if(part==='triggers')    el.textContent = m.rows.map(r=>`${r.name}  →  ${r.function}()\n  ${r.def}`).join('\n\n');
    else                          el.textContent = m.rows.map(r=>`${r.name}  [${r.kind}]  roles: ${r.roles||'public'}\n  USING ${r.using_expr||'—'}\n  CHECK ${r.check_expr||'—'}`).join('\n\n');
  }catch(err){ S.loaded[part]=false; el.textContent = 'error: '+err.message; }
}

/* ---------------- grid ---------------- */
function measure(){
  const sample = (S.local || S.chunks.get(0) || []).slice(0, 40);
  S.widths = S.cols.map((c,i) => {
    let n = c.length;
    for(const r of sample){ const v=r[i]; if(v!=null){ const L=String(v).length; if(L>n) n=L; } }
    return Math.max(MINW, Math.min(MAXW, Math.ceil(n*7.25) + 26));   /* 12px mono ≈ 7.22px/char + 18px padding */
  });
  const saved = JSON.parse(localStorage.getItem('pgweb.w.'+S.table)||'null');
  if(saved && saved.length===S.cols.length) S.widths = saved;
}
function geometry(){
  const totalPx = S.total * ROW_H;
  S.viewPx = Math.min(totalPx, MAXH);
  S.scale = S.viewPx > 0 ? totalPx / S.viewPx : 1;   // >1 once the table exceeds the pixel ceiling
}
function buildGrid(){
  measure(); geometry();
  inner.style.width = S.widths.reduce((a,b)=>a+b,0)+'px';
  canvas.style.height = S.viewPx+'px';
  headEl.textContent='';
  S.cols.forEach((c,i)=>{
    const th=document.createElement('div'); th.className='th'; th.style.width=S.widths[i]+'px';
    th.textContent=c; th.title=c;
    const g=document.createElement('div'); g.className='grip'; g.dataset.i=i; th.appendChild(g);
    headEl.appendChild(th);
  });
  const need = Math.ceil(vp.clientHeight/ROW_H) + OVER*2;
  rowsEl.textContent=''; pool=[];
  const frag=document.createDocumentFragment();
  for(let i=0;i<need;i++){
    const tr=document.createElement('div'); tr.className='tr';
    for(let c=0;c<S.cols.length;c++){
      const td=document.createElement('div'); td.className='td'; td.style.width=S.widths[c]+'px';
      td.dataset.c=c; tr.appendChild(td);
    }
    frag.appendChild(tr); pool.push(tr);
  }
  rowsEl.appendChild(frag);
  $('empty').textContent = 'No rows';
  $('empty').classList.toggle('on', S.total===0);
}
function rowAt(i){
  if(S.local) return S.local[i];
  const ci = Math.floor(i/CHUNK), c = S.chunks.get(ci);
  return c ? c[i - ci*CHUNK] : null;
}
function ensure(ci){
  if(S.local || ci<0 || S.chunks.has(ci) || S.pending.has(ci)) return;
  if(ci*CHUNK >= S.total) return;
  S.pending.set(ci, 1);
  api({action:'rows', table:S.table, pk:S.pk, limit:CHUNK,
       offset:ci*CHUNK, where:S.where||undefined})
    .then(m=>{
      S.chunks.set(ci, m.rows); S.pending.delete(ci);
      if(S.chunks.size > 60){
        for(const k of S.chunks.keys()) if(Math.abs(k-ci)>14){ S.chunks.delete(k); break; }
      }
      lastFirst=-1; render(true);
    })
    .catch(()=>S.pending.delete(ci));
}
function render(force){
  const top = vp.scrollTop, scaled = S.scale > 1.0001;
  // unscaled: pixel-exact. scaled: map scroll position onto the row range and pin the
  // block to the viewport, since one pixel now covers several rows.
  let first = scaled ? Math.round(top * S.scale / ROW_H) : Math.floor(top/ROW_H) - OVER;
  first = Math.max(0, Math.min(first, Math.max(0, S.total - pool.length)));
  if(!force && first===lastFirst) return;
  lastFirst = first;
  rowsEl.style.transform = `translateY(${scaled ? top : first*ROW_H}px)`;
  if(!S.local){ const ci=Math.floor(first/CHUNK); ensure(ci); ensure(ci+1); }
  for(let p=0;p<pool.length;p++){
    const idx=first+p, tr=pool[p];
    if(idx >= S.total){ tr.hidden=true; continue; }
    tr.hidden=false; tr.dataset.i=idx;
    const row=rowAt(idx), cells=tr.children;
    for(let c=0;c<cells.length;c++){
      const td=cells[c];
      if(!row){ td.textContent=''; td.className='td'; continue; }
      const v=row[c];
      td.textContent = v===null ? 'NULL' : String(v);
      td.className = v===null ? 'td null' : 'td';
    }
  }
}
vp.addEventListener('scroll', ()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{ ticking=false; render(false); });
}, {passive:true});
// the pool is sized to the viewport, so it has to follow it — a window resize, a pane that
// starts collapsed, or a tab first painted in the background all land here
new ResizeObserver(()=>{
  if(!S.cols.length) return;
  const need = Math.ceil(vp.clientHeight/ROW_H) + OVER*2;
  if(need !== pool.length){ buildGrid(); lastFirst=-1; render(true); }
}).observe(vp);

/* column resize */
let drag=null;
headEl.addEventListener('mousedown', e=>{
  const g=e.target.closest('.grip'); if(!g) return;
  drag={i:+g.dataset.i, x:e.clientX, w:S.widths[+g.dataset.i]}; e.preventDefault();
});
addEventListener('mousemove', e=>{
  if(!drag) return;
  const w=Math.max(MINW, drag.w + (e.clientX-drag.x));
  S.widths[drag.i]=w;
  headEl.children[drag.i].style.width=w+'px';
  for(const tr of pool) tr.children[drag.i].style.width=w+'px';
  inner.style.width=S.widths.reduce((a,b)=>a+b,0)+'px';
});
addEventListener('mouseup', ()=>{
  if(!drag) return;
  if(S.table) localStorage.setItem('pgweb.w.'+S.table, JSON.stringify(S.widths));
  drag=null;
});

/* read-only cell inspector — all writes go through the query runner */
rowsEl.addEventListener('dblclick', e=>{
  const td=e.target.closest('.td'); if(!td) return;
  const row=rowAt(+td.parentElement.dataset.i); if(!row) return;
  const c=+td.dataset.c;
  $('dlg-t').textContent=S.cols[c];
  $('dlg-b').innerHTML='<pre id="cellbox"></pre>';
  $('cellbox').textContent = row[c]===null ? 'NULL' : String(row[c]);
  $('dlg-f').innerHTML='<button value="cancel">Close</button>';
  $('dlg').showModal();
});

/* ---------------- filter ---------------- */
const OPS={'=':'=','≠':'<>','>':'>','<':'<','≥':'>=','≤':'<=','LIKE':'LIKE','ILIKE':'ILIKE',
           'IS NULL':'IS NULL','IS NOT NULL':'IS NOT NULL'};
$('fgo').onclick = async () => {
  const col=$('fcol').value, op=OPS[$('fop').value], val=$('fval').value;
  if(!col) return;
  S.where = op.startsWith('IS') ? `"${col}" ${op}`
          : `"${col}" ${op} '${String(val).replace(/'/g,"''")}'`;
  await applyFilter();
};
$('fclr').onclick = async () => { S.where=''; $('fval').value=''; await applyFilter(); };
async function applyFilter(){
  S.chunks.clear(); S.pending.clear(); lastFirst=-1;
  try{
    const first = await api({action:'rows', table:S.table, pk:S.pk,
                             limit:CHUNK, where:S.where||undefined});
    S.chunks.set(0, first.rows);
    S.total = first.rows.length;
    $('ftxt').textContent = S.where ? `${first.rows.length} rows loaded` : '';
    buildGrid(); vp.scrollTop=0; render(true);
  }catch(err){ alertBox('Filter failed', err.message); }
}
$('fval').onkeydown = e => { if(e.key==='Enter') $('fgo').click(); };

/* ---------------- query ---------------- */
async function runQuery(confirmed){
  const sql=$('sql').value.trim(); if(!sql) return;
  $('run').disabled=true; $('qmsg').className=''; $('qmsg').textContent='running…';
  const t0=performance.now();
  try{
    const m = await api({action:'query', sql, is_confirmed: confirmed?1:0,
                         is_read_only:S.readOnly?1:0});
    S.local=m.rows; S.cols=m.cols; S.total=m.rows.length; S.pk=null;
    S.chunks.clear(); lastFirst=-1;
    $('tools').style.display='none';       // column filters belong to a table, not a result set
    buildGrid(); vp.scrollTop=0; render(true);
    for(const t of document.querySelectorAll('.tab')) t.hidden = !(t.dataset.v==='query'||t.dataset.v==='rows');
    show('rows');
    $('qmsg').textContent = m.truncated ? `${m.rows.length}+ rows · limited` : `${m.rows.length} rows`;
    $('st-obj').innerHTML='<b>query</b>';
    $('st-rows').textContent=m.truncated ? `${m.rows.length}+ rows` : `${m.rows.length} rows`;
    $('st-size').textContent='';
    $('st-time').textContent = (performance.now()-t0).toFixed(1)+' ms';
  }catch(err){
    if(err.message.includes('unbounded_write')){
      $('qmsg').textContent='';
      $('dlg-t').textContent='Unbounded write';
      $('dlg-b').textContent='This statement has no WHERE clause and will affect every row. Run it?';
      $('dlg-f').innerHTML='<button value="cancel">Cancel</button><button class="primary" id="yes">Run anyway</button>';
      $('dlg').showModal();
      $('yes').onclick=ev=>{ ev.preventDefault(); $('dlg').close(); runQuery(true); };
    } else {
      $('qmsg').className='err';
      $('qmsg').textContent = S.readOnly && /read.only|read-only/i.test(err.message)
        ? 'Blocked by read-only mode' : err.message;
    }
  } finally { $('run').disabled = !S.connected; }
}
$('run').onclick = ()=>runQuery(false);
$('explain').onclick = e => {
  e.stopPropagation();
  const open=$('explainmenu').hidden;
  $('explainmenu').hidden=!open; $('explain').ariaExpanded=String(open);
};
async function explainQuery(analyze=false){
  const sql = $('sql').value.trim(); if(!sql) return;
  $('explainmenu').hidden=true; $('explain').ariaExpanded='false';
  $('explain').disabled=$('explainplan').disabled=$('analyze').disabled=true;
  $('qmsg').className=''; $('qmsg').textContent=analyze?'analyzing…':'planning…';
  try{
    const m = await api({action:'query', sql:(analyze?'EXPLAIN ANALYZE ':'EXPLAIN ')+sql, is_read_only:S.readOnly?1:0});
    S.local=m.rows; S.cols=m.cols; S.total=m.rows.length; S.pk=null; S.chunks.clear(); lastFirst=-1;
    $('tools').style.display='none';
    buildGrid(); vp.scrollTop=0; render(true);
    for(const t of document.querySelectorAll('.tab')) t.hidden = !(t.dataset.v==='query'||t.dataset.v==='rows');
    show('rows');
    $('qmsg').textContent = `${analyze?'analysis':'plan'} · ${m.rows.length} lines`;
    $('st-obj').innerHTML=`<b>${analyze?'analyze':'explain'}</b>`; $('st-rows').textContent=''; $('st-size').textContent='';
  }catch(err){
    $('qmsg').className='err';
    $('qmsg').textContent = S.readOnly && /read.only|read-only/i.test(err.message) ? 'Blocked by read-only mode' : err.message;
  }finally{
    $('explain').disabled=$('explainplan').disabled=$('analyze').disabled=!S.connected;
  }
}
$('explainplan').onclick = ()=>explainQuery(false);
$('analyze').onclick = () => {
  if(!$('sql').value.trim()) return;
  $('explainmenu').hidden=true; $('explain').ariaExpanded='false';
  $('dlg-t').textContent='Analyze query';
  $('dlg-b').textContent='EXPLAIN ANALYZE executes the SQL before showing actual timing and row counts. For write statements, database changes will occur. Continue?';
  $('dlg-f').innerHTML='<button value="cancel">Cancel</button><button class="primary" id="analyzeyes">Analyze query</button>';
  $('dlg').showModal();
  $('analyzeyes').onclick=e=>{ e.preventDefault(); $('dlg').close(); explainQuery(true); };
};
$('sql').addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); runQuery(false); }
  if(e.key==='Tab'){ e.preventDefault(); const s=e.target.selectionStart;
    e.target.setRangeText('  ', s, e.target.selectionEnd, 'end'); }
});
addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter' && document.activeElement!==$('sql')){
    e.preventDefault(); openRunner();
  }
});

/* ---------------- chrome ---------------- */
function show(v){
  for(const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.v===v);
  for(const x of document.querySelectorAll('.view')) x.classList.toggle('on', x.id==='v-'+v);
  if(v==='rows'){
    $('tools').style.display = S.local ? 'none' : 'flex';
    if(S.cols.length){ lastFirst=-1; render(true); }
  }
  if(DETAILS.includes(v)) loadDetail(v);
}
for(const t of document.querySelectorAll('.tab')) t.onclick = ()=>show(t.dataset.v);
// re-reads the object list too, so DDL run in the query runner shows up without a page reload
$('reload').onclick = async () => {
  try{
    const m = await api({action:'schema'});
    S.tree = m.tree; drawTree();
    if(S.table && (S.tree.public||{})[S.kind]?.some(o=>o.name===S.table)) await openObject(S.table, S.kind);
    else if(S.table) openRunner();      // the table went away
    toast('Schema refreshed');
  }catch(e){ alertBox('Refresh failed', e.message); }
};
$('dbinfo').onclick = async () => {
  $('dbinfo').disabled=true;
  $('runner').classList.remove('on');
  for(const el of document.querySelectorAll('.obj.on')) el.classList.remove('on');
  S.table=''; S.kind='';
  $('st-obj').textContent=''; $('st-rows').textContent=''; $('st-size').textContent='';
  for(const t of document.querySelectorAll('.tab')) t.hidden = t.dataset.v!=='info';
  show('info');
  const body=$('dbinfo-table').tBodies[0];
  body.innerHTML='<tr><td>Loading database info…</td></tr>';
  try{
    const m=await api({action:'info'});
    const labels={connection_url:'Connection URL',database:'Database',schema_scope:'Schema scope',user_name:'User',version:'PostgreSQL version',
      database_size:'Database size',encoding:'Encoding',collation:'Collation',time_zone:'Time zone',tables:'Tables',
      views:'Views',materialized_views:'Materialized views',indexes:'Indexes',sequences:'Sequences',
      functions:'Functions',procedures:'Procedures',triggers:'Triggers'};
    body.textContent='';
    for(const [key,label] of Object.entries(labels)){
      if(key==='tables'){
        const section=document.createElement('tr'), heading=document.createElement('th');
        section.className='section'; heading.colSpan=2;
        heading.textContent='Public schema objects (excluding extensions and internal objects)';
        section.appendChild(heading); body.appendChild(section);
      }
      const tr=document.createElement('tr'), th=document.createElement('th'), td=document.createElement('td');
      th.textContent=label; td.textContent=m[key] ?? '—'; tr.append(th,td); body.appendChild(tr);
    }
  }catch(e){ body.innerHTML='<tr><td></td></tr>'; body.rows[0].cells[0].textContent='Error: '+e.message; }
  finally{ $('dbinfo').disabled=false; }
};
function alertBox(title, msg){
  $('dlg-t').textContent=title; $('dlg-b').innerHTML='<pre id="cellbox"></pre>';
  $('cellbox').textContent=msg;
  $('dlg-f').innerHTML='<button value="cancel">Close</button>'; $('dlg').showModal();
}

/* the server holds one connection, so a reload just picks it back up */
(async function boot(){
  try{
    const m = await api({action:'schema'});          // one call: tree + database name
    S.tree=m.tree; S.db=m.database;
    setConnected(true); drawTree(); openRunner();
  }catch{ setConnected(false); }                     // shell stays, just empty
})();
</script>
