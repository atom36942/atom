<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Resume Upload</title>
    <!-- Use Mozilla's PDF.js to parse PDFs directly in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; background-color: #121212; color: #ffffff; }
        .box { border: 1px solid #444; padding: 1.5rem; border-radius: 8px; margin-top: 1rem; background-color: #1e1e1e; }
        button { padding: 0.5rem 1rem; margin-top: 1rem; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 1rem; font-weight: bold; }
        pre { background: #000; padding: 1rem; border-radius: 5px; overflow-x: auto; color: #0f0; margin-top: 1rem; }
    </style>
</head>
<body>

    <div class="feature-block" id="usecase-resume-parser">
        <div class="box">
            <h2>Use Case 1: Local PDF Text Extraction</h2>
            <input type="file" id="resumeInput" accept="application/pdf" />
            <br />
            <button id="resumeUploadBtn">Submit</button>
            <div id="resumeStatus"></div>
            <pre id="resumeApiResponse" style="display: none;"></pre>
        </div>
    </div>

    <script>
        // Initialize PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // ----------------------------------------------------
        // Feature 1: Resume Parser Logic
        // ----------------------------------------------------
        document.getElementById('resumeUploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('resumeInput');
            const statusDiv = document.getElementById('resumeStatus');

            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Please select a PDF file first.";
                statusDiv.style.color = "red";
                return;
            }

            const file = fileInput.files[0];
            statusDiv.innerText = "Parsing PDF directly in the browser...";
            statusDiv.style.color = "#00bcd4";

            try {
                // 1. Read the file as an ArrayBuffer
                const arrayBuffer = await file.arrayBuffer();
                
                // 2. Load PDF using pdf.js
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let extractedText = "";

                // 3. Iterate over all pages to extract text
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    // Join items with a space to form sentences
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    extractedText += pageText + "\n";
                }

                if (!extractedText.trim()) {
                    throw new Error("Could not extract any text from the PDF.");
                }

                statusDiv.innerText = "PDF Parsed! Sending text to API...";

                // 4. Send the extracted text to your backend API
                const response = await fetch("http://localhost:8000/public/object-create?table=jobseeker", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        resume_content: extractedText
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || "Failed to save to database. Check if API is running.");
                }

                const responseData = await response.json();
                
                statusDiv.innerText = `Success! Resume saved to database. The python background worker will now pick it up!`;
                statusDiv.style.color = "#4caf50";
                
                const apiResponseDiv = document.getElementById('resumeApiResponse');
                apiResponseDiv.style.display = 'block';
                apiResponseDiv.innerText = JSON.stringify(responseData, null, 2);

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Error: " + error.message;
                statusDiv.style.color = "red";
            }
        });
    </script>
</body>
</html>
